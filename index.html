// ===== AUTH =====
async function deriveCode(user,pass){
  const raw=user.toLowerCase().trim()+":"+pass;
  const enc=new TextEncoder().encode(raw);
  const hash=await crypto.subtle.digest("SHA-256",enc);
  const hex=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
  // Convert first 16 hex chars to our code alphabet
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";for(let i=0;i<16;i++){const idx=parseInt(hex.substr(i*2,2),16)%chars.length;code+=chars[idx]}
  return code;
}

function generateSyncCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";for(let i=0;i<16;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function generateGroupCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";for(let i=0;i<8;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}

function startReOnboard(){
  const d=S.data;
  // Populate onboarding state from current data
  S.obName=d.userName||S.obName||"";
  S.obUser=localStorage.getItem("bt-user")||"";
  S.obPass=null;S.obPass2=null; // Don't pre-fill passwords
  
  // Income
  const inc=d.template.income||[];
  const baseSrc=inc.find(i=>i.label==="Base pay"||i.label==="Salary"||i.label==="Hourly pay"||i.label==="Freelance income");
  const commSrc=inc.find(i=>i.label==="Commissions");
  if(baseSrc&&commSrc){
    S.obIncomeType="base_comm";
    S.obIncomeAmts={base:baseSrc.amount,comm:commSrc.amount};
  } else if(baseSrc){
    if(baseSrc.label==="Salary")S.obIncomeType="salary";
    else if(baseSrc.label==="Hourly pay")S.obIncomeType="hourly";
    else if(baseSrc.label==="Freelance income")S.obIncomeType="freelance";
    else S.obIncomeType="salary";
    const k=S.obIncomeType==="salary"?"salary":S.obIncomeType==="hourly"?"hourly":"freelance";
    S.obIncomeAmts={[k]:baseSrc.amount};
  } else if(commSrc){
    S.obIncomeType="comm_only";
    S.obIncomeAmts={comm:commSrc.amount};
  }
  S.obExtraIncome=inc.filter(i=>i.label!=="Base pay"&&i.label!=="Salary"&&i.label!=="Hourly pay"&&i.label!=="Freelance income"&&i.label!=="Commissions").map(i=>i.label);
  S.obCommPct=S.obCommPct||50;
  
  // Categories
  S.obCats=(d.template.categories||[]).filter(c2=>c2.name!=="Misc"&&c2.name!=="Splurges").map(c2=>c2.name);
  
  // Fixed costs - extract recurring items
  S.obFixed=[];
  (d.template.categories||[]).forEach(cat=>{
    cat.items.forEach(it=>{
      if(it.recurring&&it.amount>0){
        S.obFixed.push({label:it.label,amount:it.amount,on:true,cat:cat.name});
      }
    });
  });
  if(S.obFixed.length===0){
    S.obFixed=null; // Let step 4 generate defaults
  }
  
  // Savings
  const savCat=(d.template.categories||[]).find(c2=>c2.name==="Savings")||{items:[]};
  S.obSavingsGoal=savCat.items.reduce((s,i)=>s+(i.recurring?i.amount:0),0)||savCat.items.reduce((s,i)=>s+i.amount,0);
  S.obSavingsCustom=S.obSavingsGoal>0;
  
  // Budget items
  S.obBudgets={};
  (d.template.categories||[]).forEach(cat=>{
    const items=cat.items.map(it=>({label:it.label,amount:it.amount,recurring:it.recurring||false}));
    if(items.length>0)S.obBudgets[cat.name]=items;
  });
  S.obBudgetsSeeded=true;
  
  // Cards
  S.obCards=(d.debts?.cards||[]).map(cd=>({
    name:cd.name,balance:cd.balance,limit:cd.limit||0,
    apr:cd.apr,minPayment:cd.minPayment,stmtDate:cd.stmtDate||0
  }));
  
  // Bank accounts
  S.obAccounts=(d.networth?.accounts||[]).filter(a=>a.label!=="Unsorted").map(a=>({
    label:a.label,balance:getNWBalance(a,S.month)
  }));
  if(S.obAccounts.length===0)S.obAccounts=[{label:"Checking",balance:0},{label:"Savings",balance:0}];
  
  // Store existing data so we can merge back
  S._reOnboard=true;
  S._existingMonths=JSON.parse(JSON.stringify(d.months||{}));
  S._existingGoals=JSON.parse(JSON.stringify(d.goals||{active:[],completed:[]}));
  S._existingGroups=JSON.parse(JSON.stringify(d.groups||[]));
  S._existingNetworth=JSON.parse(JSON.stringify(d.networth||{accounts:[]}));
  S._existingNotes=JSON.parse(JSON.stringify(d.monthlyNotes||{}));
  S._existingQuickBtns=JSON.parse(JSON.stringify(d.quickButtons||[]));
  S._existingStreak=d.streakDate;
  S._existingEmojis=JSON.parse(JSON.stringify(d.catEmojis||{}));
  
  S.phase="welcome";S.obStep=2;S.err=""; // Skip step 1 (account creation) - go straight to income
  render();
  toast("Editing your setup — your history is preserved");
}

async function doChangePass(){
  const oldPass=document.getElementById("m-oldpass").value;
  const newPass=document.getElementById("m-newpass").value;
  const newPass2=document.getElementById("m-newpass2").value;
  const user=localStorage.getItem("bt-user");
  if(!user){S.err="No username found. Recovery code users can't change password here.";render();return}
  if(!oldPass){S.err="Enter your current password";render();return}
  if(!newPass||newPass.length<4){S.err="New password must be at least 4 characters";render();return}
  if(newPass!==newPass2){S.err="New passwords don't match";render();return}
  // Verify old password
  const oldCode=await deriveCode(user,oldPass);
  if(oldCode!==S.pin){S.err="Current password is incorrect";render();return}
  // Generate new code and migrate data
  const newCode=await deriveCode(user,newPass);
  if(db){
    const oldHash=await sha(oldCode);
    const newHash=await sha(newCode);
    // Copy data to new path
    await db.ref("budgets/"+newHash).set(S.data);
    // Remove old path
    await db.ref("budgets/"+oldHash).remove();
    // Reconnect
    dbRef.off();dbRef=db.ref("budgets/"+newHash);
    dbRef.on("value",s=>{if(s.exists()&&S.phase==="app"){S.data=s.val();ensureStructure();try{render()}catch(e){console.error("Sync render error:",e)}}});
  } else {
    const oldHash=await sha(oldCode);
    const newHash=await sha(newCode);
    localStorage.setItem("bt-"+newHash,JSON.stringify(S.data));
    localStorage.removeItem("bt-"+oldHash);
  }
  localStorage.setItem("bt-sync",newCode);
  S.pin=newCode;S.err="";
  closeModal();
  toast("Password changed");
}

async function doLogin(){
  var user=(document.getElementById("login-user")||{}).value||"";user=user.trim();
  var pass=(document.getElementById("login-pass")||{}).value||"";
  if(!user||!pass){S.err="Enter username and password";render();return}
  try{
    var code=await deriveCode(user,pass);
    if(db){
      var h=await sha(code);
      var snap=await db.ref("budgets/"+h).once("value");
      if(!snap.exists()){S.err="Account not found. Check your username and password.";render();return}
    } else {
      var h2=await sha(code);
      if(!localStorage.getItem("bt-"+h2)){S.err="No account found on this device.";render();return}
    }
    localStorage.setItem("bt-user",user);
    localStorage.setItem("bt-sync",code);
    S.pin=code;
    await connect(code);
  }catch(e){S.err="Login failed: "+e.message;render()}
}

    S.obCards.forEach((cd,ci)=>{h+=`<div style="width:100%;max-width:300px;background:var(--c1);border-radius:12px;padding:10px 14px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)"><div><div style="font-weight:600">${esc(cd.name)}</div><div style="font-size:11px;color:var(--t2)">${fmt(cd.balance)} · ${cd.apr}% · Limit ${fmt(cd.limit)}</div></div><button class="xb" onclick="S.obCards.splice(${ci},1);render()">\u00d7</button></div>`});
    h+=`<div style="width:100%;max-width:300px;margin-top:8px"><input id="ob-cn" class="ob-input" style="text-align:left;margin:4px 0" maxlength="50" placeholder="Card name (e.g. Chase)"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="ob-cb" class="ob-input" style="margin:0" type="number" inputmode="decimal" placeholder="Balance"><input id="ob-cl" class="ob-input" style="margin:0" type="number" inputmode="decimal" placeholder="Limit"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><input id="ob-ca" class="ob-input" style="margin:0" type="number" inputmode="decimal" placeholder="APR %"><input id="ob-cm" class="ob-input" style="margin:0" type="number" inputmode="decimal" placeholder="Min payment"></div><div style="margin-top:6px"><input id="ob-cs" class="ob-input" style="margin:0" type="number" inputmode="numeric" placeholder="Bill due date (day, e.g. 15)" min="1" max="31"></div><button class="ob-btn sec" style="width:100%;margin-top:6px" onmousedown="event.preventDefault();addObCard()">+ Add this card</button></div>`;
    h+=`<button class="ob-btn" style="margin-top:12px" onmousedown="event.preventDefault();S.obStep=7;render()">Next</button><button class="ob-skip" onmousedown="event.preventDefault();S.obStep=7;render()">Skip — no cards</button></div>`;
  } else if(step===7){
    h+=`<div class="ob-top">${backBtn(6)}<div class="ob-step">Quick tour — 1 of 3</div><h2>Your dashboard</h2><div style="max-width:300px;text-align:left;line-height:1.7;font-size:14px;color:var(--t2)"><p>📊 <b style="color:var(--tx)">Budget tab</b> — your monthly overview</p><p>💰 <b style="color:var(--tx)">Money In</b> — track all income</p><p>💸 <b style="color:var(--tx)">Money Out</b> — see where it goes</p><p>↻ <b style="color:var(--tx)">Recurring</b> — tap [Pay] to confirm each month</p></div><button class="ob-btn" onmousedown="event.preventDefault();S.obStep=8;render()">Next</button></div>`;
  } else if(step===8){
    h+=`<div class="ob-top">${backBtn(7)}<div class="ob-step">Quick tour — 2 of 3</div><h2>Logging</h2><div style="max-width:300px;text-align:left;line-height:1.7;font-size:14px;color:var(--t2)"><p><span style="display:inline-flex;width:26px;height:26px;background:var(--ac);color:#ede0cc;border-radius:50%;align-items:center;justify-content:center;font-size:14px;vertical-align:middle">+</span> Quick-add expense, income, or payment</p><p>⚡ <b style="color:var(--tx)">Quick Log</b> — one-tap for daily buys</p><p>✏️ <b style="color:var(--tx)">Edit</b> — adjust budgets anytime</p></div><button class="ob-btn" onmousedown="event.preventDefault();S.obStep=9;render()">Next</button></div>`;
  } else if(step===9){
    h+=`<div class="ob-top">${backBtn(8)}<div class="ob-step">Quick tour — 3 of 3</div><h2>Other tabs</h2><div style="max-width:300px;text-align:left;line-height:1.7;font-size:14px;color:var(--t2)"><p>💳 <b style="color:var(--tx)">Cards</b> — debt payoff plan</p><p>👥 <b style="color:var(--tx)">Group</b> — split with roommates</p><p>🎯 <b style="color:var(--tx)">Goals</b> — savings targets</p><p>📊 <b style="color:var(--tx)">Trends</b> — spending charts</p></div><button class="ob-btn" onmousedown="event.preventDefault();S.obStep=10;render()">Got it!</button></div>`;
  } else if(step===10){
    const totalDebt=(S.obCards||[]).reduce((s,x)=>s+x.balance,0);
    const totalB2=Object.values(S.obBudgets||{}).flat().reduce((s,i)=>s+(i.amount||0),0);
    const totalI2=Object.values(S.obIncomeAmts||{}).reduce((s,v)=>s+v,0);
    h+=`<div class="ob-top">${backBtn(9)}<div style="font-size:48px;margin-bottom:12px">🎉</div><h2>You're ready!</h2>`;
    h+=`<div style="font-size:13px;color:var(--t2);max-width:280px;text-align:center;line-height:1.8;margin-bottom:12px">`;
    if(totalI2)h+=`Income: ${fmt(totalI2)}/mo<br>`;
    if(totalB2)h+=`Budget: ${fmt(totalB2)}/mo<br>`;
    if(totalDebt>0)h+=`Cards: ${(S.obCards||[]).length} · ${fmt(totalDebt)} debt<br>`;
    h+=`${(S.obCats||[]).length} categories</div>`;
    h+=`<button class="ob-btn" onmousedown="event.preventDefault();finishOnboarding()">Let's go</button></div>`;
  }
   h+=`</div>`;
  document.getElementById("app").innerHTML=h;
}


function finishOnboarding(){
  startOnboardFinish();return}
async function startOnboardFinish(){
  let code;
  if(S.obUser&&S.obPass){code=await deriveCode(S.obUser,S.obPass);localStorage.setItem('bt-user',S.obUser)}else{code=generateSyncCode()}
  localStorage.setItem('bt-sync',code);S.pin=code;
  if(db&&S.obUser)db.ref('usernames/'+S.obUser.toLowerCase()).set(code);
  S.data=JSON.parse(JSON.stringify(DEF));S.data.userName=S.obName||"";
  const amts=S.obIncomeAmts||{};const it=S.obIncomeType;
  if(it==="salary")S.data.template.income.push({id:uid(),label:"Salary",amount:amts.salary||0,recurring:true,note:""});
  else if(it==="hourly")S.data.template.income.push({id:uid(),label:"Hourly pay",amount:amts.hourly||0,recurring:false,note:""});
  else if(it==="base_comm"){S.data.template.income.push({id:uid(),label:"Base pay",amount:amts.base||0,recurring:true,note:""});S.data.template.income.push({id:uid(),label:"Commissions",amount:amts.comm||0,recurring:false,note:""})}
  else if(it==="comm_only")S.data.template.income.push({id:uid(),label:"Commissions",amount:amts.comm||0,recurring:false,note:""});
  else if(it==="freelance")S.data.template.income.push({id:uid(),label:"Freelance",amount:amts.freelance||0,recurring:false,note:""});
  (S.obExtraIncome||[]).forEach(label=>{S.data.template.income.push({id:uid(),label,amount:0,recurring:label==="Benefits",note:""})});
  const budgets=S.obBudgets||{};
  (S.obCats||[]).forEach(name=>{const items=(budgets[name]||[]).filter(i=>i.label.trim()).map(i=>({id:uid(),label:i.label.trim(),amount:i.amount||0,recurring:i.recurring||false,note:""}));S.data.template.categories.push({id:uid(),name,items})});
  // Ensure Misc and Splurges exist
  if(!S.data.template.categories.find(c2=>c2.name==="Misc"))S.data.template.categories.push({id:uid(),name:"Misc",items:[{id:uid(),label:"Uncategorized",amount:0,recurring:false,note:""}]});
  if(!S.data.template.categories.find(c2=>c2.name==="Splurges"))S.data.template.categories.push({id:uid(),name:"Splurges",items:[{id:uid(),label:"Unnecessary purchases",amount:0,recurring:false,note:""}]});
  // Merge fixed costs into categories (in case step 5 was skipped)
  (S.obFixed||[]).filter(f=>f.on&&f.amount>0).forEach(f=>{
    const catName=f.cat||"Misc";
    let cat=S.data.template.categories.find(c2=>c2.name===catName);
    if(!cat){cat={id:uid(),name:catName,items:[]};S.data.template.categories.push(cat)}
    const label=f.label.split("(")[0].trim();
    if(!cat.items.find(i=>i.label===label)){cat.items.push({id:uid(),label,amount:f.amount,recurring:true,note:""})}
  });
    (S.obCards||[]).forEach(cd=>{S.data.debts.cards.push({id:uid(),name:cd.name,balance:cd.balance,limit:cd.limit||0,apr:cd.apr,minPayment:cd.minPayment,stmtDate:cd.stmtDate||0,payments:[]})});
  // Net worth accounts from onboarding
  if(S.obAccounts&&S.obAccounts.length){
    S.data.networth={accounts:[]};
    S.obAccounts.filter(a=>a.label).forEach(a=>{
      S.data.networth.accounts.push({id:uid(),label:a.label,type:"asset",balances:{[S.month]:a.balance}});
    });
  }
  // Unassigned money account (always exists)
  if(!S.data.networth.accounts.find(a=>a.label==="Unsorted"))S.data.networth.accounts.push({id:uid(),label:"Unsorted",type:"asset",balances:{}});
  // Set start month (only on first onboard)
  if(!S.data._startMonth)S.data._startMonth=mk();
  // Ensure savings
  if(S.obSavingsGoal>0){
    let sc=S.data.template.categories.find(c2=>c2.name==="Savings");
    if(!sc){sc={id:uid(),name:"Savings",items:[]};S.data.template.categories.push(sc)}
    const si=sc.items.find(i=>i.label==="Savings");
    if(si){si.amount=S.obSavingsGoal;si.recurring=true}
    else{sc.items.push({id:uid(),label:"Savings",amount:S.obSavingsGoal,recurring:true,note:""})}
  }
  ensureStructure();
  // If re-onboarding, restore existing history
  if(S._reOnboard){
    S.data.months=S._reOnboard?S._existingMonths:S.data.months;
    S.data.goals=S._existingGoals||S.data.goals;
    S.data.groups=S._existingGroups||S.data.groups;
    S.data.networth=S._existingNetworth||S.data.networth;
    S.data.monthlyNotes=S._existingNotes||S.data.monthlyNotes;
    S.data.quickButtons=S._existingQuickBtns||S.data.quickButtons;
    S.data.streakDate=S._existingStreak||S.data.streakDate;
    S.data.catEmojis=S._existingEmojis||S.data.catEmojis;
    delete S._reOnboard;delete S._existingMonths;delete S._existingGoals;
    delete S._existingGroups;delete S._existingNetworth;delete S._existingNotes;
    delete S._existingQuickBtns;delete S._existingStreak;delete S._existingEmojis;
  }
  S.phase="app";S.month=mk();save();render();
}

let groupRefs={};let groupDatas={};
function createGroup(){
  const code=generateGroupCode();
  const myName=S.data.userName||"Me";
  const grpName="Group "+(S.data.groups.length+1);
  const grp={code,name:grpName,creator:myName,members:{},expenses:[]};
  S.data.groups.push(grp);
  S.activeGroup=S.data.groups.length-1;
  save();render();
}
function joinGroup(code){
  const name=S.data.userName||"Me";
  if(S.data.groups.some(g=>g.code===code)){toast("Already in this group");return}
  const grp={code,name:"Joined Group",members:{},expenses:[]};
  S.data.groups.push(grp);
  S.activeGroup=S.data.groups.length-1;
  save();render();toast("Joined group "+code);
}
function connectGroups(){
  if(!db)return;
  (S.data.groups||[]).forEach(grp=>{
    if(!groupRefs[grp.code]){
      const ref=db.ref("groups/"+grp.code);groupRefs[grp.code]=ref;
      ref.on("value",s=>{if(s.exists()){groupDatas[grp.code]=s.val();if(S.view==="group")render()}});
    }
  });
}
function addGroupMember(){
  const grp=S.data.groups[S.activeGroup];if(!grp)return;
  const gd=grp;if(!gd)return;
  S._savedModal=S.modal;
  S.modal={type:"addmember"};render();
}
function editGroupExpense(expIdx){
  const grp=S.data.groups[S.activeGroup];if(!grp)return;
  const gd=grp;if(!gd||!gd.expenses)return;
  const ex=gd.expenses[expIdx];if(!ex)return;
  const members=Object.keys(gd.members||{});
  S.modal={type:'groupexpense',splitWith:[...members],splitType:ex.customSplit?'custom':'equal',
    _amt:String(ex.amount),_note:ex.label||ex.note||'',recurring:!!ex.recurring,logToBudget:false,
    editIdx:expIdx};
  // Pre-fill custom splits
  if(ex.customSplit){
    const myName=S.data.userName||S.obName||'Me';
    S.modal._splitMe=String(ex.customSplit[myName]||0);
    members.forEach((mem,si)=>{S.modal['_split'+si]=String(ex.customSplit[mem]||0)});
  }
  render();
}
function deleteGroupExpense(expIdx){
  const grp=S.data.groups[S.activeGroup];if(!grp)return;
  if(!grp||!grp.expenses)return;
  customConfirm('Delete this expense?',()=>{
    grp.expenses.splice(expIdx,1);
    save();render();
  });
}

function inlineAddMember(){
  const inp=document.getElementById("inline-member");
  if(!inp)return;
  const name=inp.value.trim();
  if(!name){toast("Enter a name");return}
  const grp=S.data.groups[S.activeGroup];if(!grp)return;
  if(!grp.members)grp.members={};
  if(grp.members[name]){toast("Already in group");return}
  grp.members[name]=true;
  S._addingMember=false;save();render();toast("Added "+name);
}

function finishAddMember(){
  const el=document.getElementById("m-membername");if(!el)return;
  const name=el.value.trim();if(!name){toast("Enter a name");return}
  const grp=S.data.groups[S.activeGroup];if(!grp)return;
  const gd=grp;if(!gd)return;
  if(!gd.members)gd.members={};
  if(gd.members[name]){toast("Already in group");return}
  gd.members[name]=true;
  S.modal=null;render();toast("Added "+name);
}

function settleUp(code,person){
  const grp=S.data.groups.find(g=>g.code===code);if(!grp)return;
  const gd=grp;
  const{netBalances}=calcGroupBalances(gd);
  const myName=S.data.userName||S.obName||"Me";
  const key=person+"→"+myName;
  const amt=netBalances[key]||0;
  if(amt<=0){toast("Nothing to settle");return}
  if(!gd.expenses)gd.expenses=[];
  gd.expenses.push({id:uid(),label:"Settlement",amount:amt,paidBy:person,splitBetween:[myName],date:new Date().toLocaleDateString(),settled:true});
  if(db&&groupRefs[code])groupRefs[code].set(gd);
  
  // Add settlement to Group Money pool
  if(!S.data.groupMoney)S.data.groupMoney=[];
  S.data.groupMoney.push({id:uid(),date:new Date().toISOString().split("T")[0],amount:amt,from:person,type:"in",note:"Settlement from "+person});
  save();render();toast(person+" settled "+fmt(amt)+" — added to income");
}

function addGroupExpense(){
  const m=S.modal;
  const amt=parseFloat(document.getElementById("m-inp")?.value||m._amt)||0;
  if(amt===0){closeModal();return}
  const note=document.getElementById("m-note")?.value?.trim()||m._note||"Shared expense";
  const split=m.splitWith||[];if(split.length===0){toast("Select who to split with");return}
  const grp=S.data.groups[S.activeGroup];if(!grp)return;
  const myName=S.data.userName||S.obName||"Me";
  const d=new Date();
  const expense={id:uid(),label:note,paidBy:myName,amount:amt,date:(d.getMonth()+1)+"/"+d.getDate(),
    splitBetween:[myName,...split]};
  // Custom split amounts
  if(m.splitType==="custom"){
    expense.customSplit={};
    expense.customSplit[myName]=parseFloat(m._splitMe)||0;
    split.forEach((mem,si)=>{expense.customSplit[mem]=parseFloat(m['_split'+si])||0});
  }
  if(m.recurring)expense.recurring=true;
  if(!grp.expenses)grp.expenses=[];
  if(m.editIdx!==undefined&&m.editIdx!==null){grp.expenses[m.editIdx]=expense}else{grp.expenses.push(expense)}
  // Group Money pool - track your outgoing share
  const myShare=expense.customSplit?expense.customSplit[myName]:(amt/expense.splitBetween.length);
  if(myShare>0&&m.editIdx===undefined){
    if(!S.data.groupMoney)S.data.groupMoney=[];
    S.data.groupMoney.push({id:uid(),date:d.toISOString().split("T")[0],amount:myShare,type:"out",note:note+" (your share)"});
  }
  // Log your share to personal budget
  if(m.logToBudget===true&&m.editIdx===undefined){
    const md7=getMonth(S.month);
    let targetCat=md7.categories.find(c2=>note.toLowerCase().includes(c2.name.toLowerCase().split("/")[0].trim().toLowerCase()));
    if(!targetCat)targetCat=md7.categories.find(c2=>c2.items.some(i=>note.toLowerCase().includes(i.label.toLowerCase())));
    if(!targetCat)targetCat=md7.categories.find(c2=>c2.name==="Misc");
    if(targetCat){
      let targetItem=targetCat.items.find(i=>note.toLowerCase().includes(i.label.toLowerCase()));
      if(!targetItem)targetItem=targetCat.items[0];
      if(targetItem){
        if(targetItem.recurring){toast("Your share: "+fmt(myShare)+" (already in budget as recurring)")}
        else{targetItem.transactions.push({id:uid(),date:(d.getMonth()+1)+"/"+d.getDate(),isoDate:d.toISOString().split("T")[0],amount:myShare,note:note+" (group)",tags:["group"],auto:false,paidWith:"cash"})}
      }
    }
  }
  save();closeModal();toast(m.editIdx!==undefined?"Updated":"Added "+note);
}
function calcGroupBalances(gd){
  const expenses=gd?.expenses||[];const balances={};
  expenses.forEach(ex=>{
    if(ex.customSplit){
      // Custom amounts: each person owes their specified amount to the payer
      Object.entries(ex.customSplit).forEach(([person,personAmt])=>{
        if(person!==ex.paidBy&&personAmt>0){
          balances[person+"→"+ex.paidBy]=(balances[person+"→"+ex.paidBy]||0)+personAmt;
        }
      });
    } else {
      // Equal split
      const pp=ex.amount/ex.splitBetween.length;
      ex.splitBetween.forEach(person=>{if(person!==ex.paidBy){balances[person+"→"+ex.paidBy]=(balances[person+"→"+ex.paidBy]||0)+pp}});
    }
  });
  const netBalances={};const people=new Set();
  Object.entries(balances).forEach(([key,amt])=>{const[from,to]=key.split("→");people.add(from);people.add(to);const rev=balances[to+"→"+from]||0;const net=amt-rev;if(net>0)netBalances[from+"→"+to]=net});
  return{netBalances,people:[...people]};
}

window.onerror=function(msg,src,line){console.error(msg);S.view="budget";S.budgetView="dash";S.modal=null;try{render()}catch(e){}};try{initFB();autoStart()}catch(e){
  document.getElementById('app').innerHTML='<div style="padding:40px;color:#ede0cc;font-family:sans-serif"><h2>Something went wrong</h2><p style="color:#c4ac8a">'+e.message+'</p><button onclick="localStorage.clear();location.reload()" style="padding:12px 24px;background:#dbb56e;border:none;border-radius:10px;font-size:14px;margin-top:12px;cursor:pointer">Reset &amp; Reload</button></div>';
}
