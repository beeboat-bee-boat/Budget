<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<title>Budget</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>💰</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f5f0;--c1:#fff;--c2:#e9e9e3;--bd:#e0e0da;--tx:#111;--t2:#555;--t3:#999;--gn:#1a8f5c;--rd:#cc3b3b;--or:#d07020;--yl:#c89000;--ac:#2266cc;--sh:0 1px 3px rgba(0,0,0,.06);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0a0a0a;--c1:#1a1a1a;--c2:#222;--bd:#2a2a2a;--tx:#e8e8e4;--t2:#aaa;--t3:#666;--gn:#2eaa6e;--rd:#e55;--or:#e08030;--yl:#daa520;--ac:#4488ee;--sh:0 1px 3px rgba(0,0,0,.3)}}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;padding-bottom:calc(60px + var(--sb));font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}

/* Layout */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px 0;padding-top:calc(12px + var(--st))}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hdr h1{font-size:22px;font-weight:800}
.tb{display:flex;gap:6px}
.tb button{padding:8px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--c1);color:var(--t2);font-size:13px;font-weight:500;min-height:36px}
.tb button:active{opacity:.7}
.tb .on{background:var(--or);color:#fff;border-color:var(--or)}
.mnav{display:flex;align-items:center;justify-content:center;gap:20px;padding-bottom:10px;border-bottom:.5px solid var(--bd)}
.mnav button{background:none;border:none;font-size:20px;color:var(--t2);padding:6px 10px;min-height:36px}
.mnav span{font-size:16px;font-weight:600;min-width:100px;text-align:center}
.cnt{padding:4px 16px 80px}

/* Stats */
.sts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px}
.st{background:var(--c1);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.st small{font-size:11px;color:var(--t3);font-weight:500}
.st div{font-size:20px;font-weight:700;margin-top:3px}

/* Sections */
.sec{margin-bottom:16px}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 0;cursor:pointer;-webkit-user-select:none;user-select:none;min-height:44px}
.sh:active{opacity:.7}
.sh-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t2)}
.sh-v{font-size:13px;color:var(--t2);font-weight:500}

/* Item Cards */
.rw{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.rw-t{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.rw-l{font-size:15px;display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.rw-n{display:flex;align-items:center;gap:6px;flex-shrink:0}
.act{font-size:15px;font-weight:700;cursor:pointer;padding:6px 10px;border-radius:10px;min-width:48px;min-height:36px;text-align:right;display:flex;align-items:center;justify-content:flex-end}
.act:active{background:var(--c2)}
.act.z{color:var(--t3);font-weight:500;font-size:13px}
.bud{font-size:12px;color:var(--t3);min-width:40px;text-align:right;padding:6px 4px;cursor:pointer;min-height:36px;display:flex;align-items:center;justify-content:flex-end}
.bar{height:4px;border-radius:2px;background:var(--bd);overflow:hidden;margin-top:6px}
.bar-f{height:100%;border-radius:2px;transition:width .3s}
.rec-badge{font-size:10px;color:var(--t3);margin-left:3px}
.note-text{font-size:12px;color:var(--t3);margin-top:4px;font-style:italic}

/* Transaction log */
.txlog{margin:8px 0 0 0;padding:8px 12px;background:var(--bg);border-radius:10px}
.txlog-i{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;color:var(--t2);border-bottom:.5px solid var(--bd);min-height:40px}
.txlog-i:last-child{border-bottom:none}
.txlog-i .xb{min-width:36px;min-height:36px;padding:2px}
.txlog-i .amt{font-weight:600;color:var(--tx);min-width:44px;text-align:right}
.txlog-i .meta{display:flex;gap:8px;flex:1;min-width:0;overflow:hidden;align-items:center}
.txlog-i .dt{color:var(--t3);font-size:11px;flex-shrink:0}
.txlog-i .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txlog-i .tg{font-size:10px;color:var(--ac);background:rgba(34,102,204,.1);padding:1px 6px;border-radius:4px;flex-shrink:0}
.tx-toggle{font-size:13px;color:var(--ac);cursor:pointer;margin-top:4px;display:inline-flex;align-items:center;padding:10px 0;font-weight:500;min-height:44px}
.tx-toggle:active{opacity:.6}

/* Buttons */
.add{width:100%;padding:14px;border:1.5px dashed var(--bd);border-radius:14px;background:none;color:var(--t3);font-size:14px;margin-top:4px;min-height:48px;font-weight:500}
.add:active{background:var(--c1)}
.xb{background:none;border:none;color:var(--t3);font-size:16px;padding:4px 8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.xb:active{color:var(--rd)}

/* Modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.mdl{background:var(--bg);border-radius:20px 20px 0 0;padding:20px;padding-bottom:calc(20px + var(--sb));width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.mdl h3{font-size:18px;margin-bottom:12px;font-weight:700}
.mdl label{font-size:13px;color:var(--t2);display:block;margin:10px 0 4px;font-weight:500}
.mdl input,.mdl select,.mdl textarea{width:100%;padding:14px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--c1);color:var(--tx);-webkit-appearance:none}
.mdl textarea{resize:vertical;min-height:80px;font-size:15px}
.mdl input:focus,.mdl textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.mdl .tog{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;color:var(--t2);min-height:36px}
.mdl .tog input{width:20px;height:20px;flex-shrink:0}
.mbs{display:flex;gap:6px;margin-top:14px}
.mbs button{flex:1;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;min-height:48px}
.mbs .cn{background:var(--c1);color:var(--tx)}
.mbs .sv{background:var(--ac);color:#fff}
.mbs .dg{background:var(--rd);color:#fff}

/* Goals */
.gc{background:var(--c1);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.gc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gc-t{font-size:16px;font-weight:700;flex:1}
.gc-v{font-size:20px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px}
.gc-v:active{background:var(--c2)}
.gc-s{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:6px}
.gc-n{font-size:12px;color:var(--t2);margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.gc-a{display:flex;gap:6px;margin-top:10px}
.gc-a button{padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:none;color:var(--t2);font-size:13px;font-weight:500;min-height:40px}
.gc-a button:active{background:var(--bg)}
.trophy{border:1px solid var(--bd);border-radius:14px;margin-top:14px;overflow:hidden;background:var(--c1)}
.trophy summary{padding:12px 14px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.trophy summary::after{content:"▸";transition:transform .2s}
.trophy[open] summary::after{transform:rotate(90deg)}
.trophy-i{padding:10px 14px;border-top:.5px solid var(--bd);font-size:13px;color:var(--t2)}
.trophy-i .nm{color:var(--tx);font-weight:600;font-size:14px}

/* Charts */
.chart-wrap{position:relative;width:100%;height:240px;margin:12px 0;background:var(--c1);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.chart-pick{display:flex;gap:6px;margin-bottom:10px}
.chart-pick button{padding:8px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--c1);color:var(--t2);font-size:13px;font-weight:500;min-height:40px}
.chart-pick button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* Search */
.s-bar{display:flex;gap:8px;margin-bottom:12px}
.s-bar input{flex:1;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--c1);color:var(--tx);font-size:15px}
.s-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.s-filters select{padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--c1);color:var(--tx);font-size:13px;min-height:36px}
.s-result{padding:10px 14px;background:var(--c1);border-radius:12px;margin-bottom:6px;box-shadow:var(--sh)}
.s-result .top-r{display:flex;justify-content:space-between;font-size:14px}
.s-result .cat{color:var(--t3);font-size:11px;margin-top:2px}
.s-total{font-size:15px;font-weight:600;padding:10px 0;color:var(--tx)}

/* Net worth */
.nw-card{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.nw-h{display:flex;justify-content:space-between;align-items:center}
.nw-t{font-size:12px;color:var(--t2)}
.nw-v{font-size:18px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px}
.nw-v:active{background:var(--c2)}

/* Tabs */
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c1);border-top:.5px solid var(--bd);padding:6px 0 2px;padding-bottom:calc(6px + var(--sb));z-index:10;box-shadow:0 -1px 4px rgba(0,0,0,.05)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;color:var(--t3);font-size:9px;padding:2px 0;font-weight:500;min-height:44px;justify-content:center}
.tab.active{color:var(--ac)}
.tab svg{width:20px;height:20px}

/* Pin */
.pin-s{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px;gap:16px}
.pin-s h2{font-size:26px;font-weight:800}
.pin-s p{font-size:15px;color:var(--t2);text-align:center;max-width:300px;line-height:1.5}
.pin-s input{width:200px;padding:16px;font-size:22px;text-align:center;border:1px solid var(--bd);border-radius:14px;background:var(--c1);color:var(--tx);letter-spacing:8px}
.pin-s button{padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:600;background:var(--ac);color:#fff;min-height:48px}
.pin-s .sec-btn{background:var(--c1);color:var(--tx)}
.pin-s .err{color:var(--rd);font-size:13px}

/* Summary cards */
.mn{font-size:13px;color:var(--t2);margin-top:8px;padding:12px 14px;background:var(--c1);border-radius:14px;line-height:1.5;box-shadow:var(--sh)}


/* FAB */
.fab{position:fixed;bottom:calc(68px + var(--sb));right:16px;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:none;font-size:28px;font-weight:300;box-shadow:0 4px 14px rgba(34,102,204,.35);z-index:9;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.9)}
@media(prefers-color-scheme:dark){.fab{box-shadow:0 4px 14px rgba(68,136,238,.3)}}

/* Quick-add category picker */
.qa-type{display:flex;gap:0;margin-bottom:12px;border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.qa-type button{flex:1;padding:10px;border:none;font-size:14px;font-weight:600;background:var(--c1);color:var(--t2);min-height:42px}
.qa-type button.on{background:var(--ac);color:#fff}
.qa-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qa-cat{padding:8px 14px;border-radius:20px;border:1.5px solid var(--bd);background:var(--c1);color:var(--t2);font-size:13px;font-weight:500;min-height:38px}
.qa-cat:active{opacity:.7}
.qa-cat.on{border-color:var(--ac);background:rgba(34,102,204,.08);color:var(--ac)}
.qa-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;margin-bottom:4px}
.qa-item{padding:8px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--c1);color:var(--t2);font-size:13px;font-weight:500;min-height:40px}
.qa-item:active{opacity:.7}
.qa-item.on{border-color:var(--gn);background:rgba(26,143,92,.08);color:var(--gn)}


/* Debt planner */
.debt-card{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.debt-card .dc-top{display:flex;justify-content:space-between;align-items:center}
.debt-card .dc-name{font-size:15px;font-weight:600}
.debt-card .dc-bal{font-size:18px;font-weight:700;color:var(--rd);cursor:pointer;padding:4px 8px;border-radius:8px}
.debt-card .dc-bal:active{background:var(--c2)}
.debt-card .dc-details{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--t2)}
.debt-card .dc-pay{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--gn);font-weight:600}
.debt-strat{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--bd);margin-bottom:12px}
.debt-strat div{flex:1;padding:8px;font-size:12px;font-weight:600;background:var(--c1);color:var(--t2);min-height:38px}
.debt-strat div.on{background:var(--ac);color:#fff}
.debt-strat div:active{opacity:.8}
.debt-summary{background:var(--c1);border-radius:14px;padding:14px 16px;margin-top:10px;box-shadow:var(--sh)}
.debt-summary .ds-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.debt-summary .ds-label{color:var(--t2)}
.debt-summary .ds-val{font-weight:600}


/* Money In/Out headers */
.sec-in .sh{border-bottom:2px solid var(--gn)}
.sec-in .sh-t{color:var(--gn)}
.sec-out .sh{border-bottom:2px solid var(--or)}
.sec-out .sh-t{color:var(--or)}


/* Onboarding */
.ob{min-height:100dvh;display:flex;flex-direction:column;padding:24px 20px;position:relative;padding-top:calc(24px + var(--st));padding-bottom:calc(24px + var(--sb))}
.ob-top{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.ob-top h2{font-size:26px;font-weight:800;margin-bottom:8px}
.ob-top p{font-size:15px;color:var(--t2);max-width:300px;line-height:1.5;margin-bottom:20px}
.ob-step{font-size:12px;color:var(--t3);margin-bottom:12px}
.ob-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;max-width:340px}
.ob-chip{padding:10px 16px;border-radius:20px;border:1.5px solid var(--bd);background:var(--c1);font-size:14px;font-weight:500;color:var(--tx);min-height:44px;display:flex;align-items:center}
.ob-chip:active{opacity:.7}
.ob-chip.on{border-color:var(--ac);background:rgba(34,102,204,.08);color:var(--ac)}
.ob-chip.added{border-color:var(--gn);background:rgba(26,143,92,.08);color:var(--gn)}
.ob-input{width:100%;max-width:300px;padding:14px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--c1);color:var(--tx);text-align:center;margin:8px 0}
.ob-btn{padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:600;background:var(--ac);color:#fff;min-height:48px;min-width:200px;margin-top:12px}
.ob-btn:active{opacity:.8}
.ob-btn.sec{background:var(--c1);color:var(--tx);min-width:auto;padding:10px 20px;font-size:14px}
.ob-skip{background:none;border:none;color:var(--t3);font-size:13px;margin-top:10px;padding:8px;min-height:44px}
/* Group */
.grp-card{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.grp-bal{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid var(--bd)}
.grp-bal:last-child{border-bottom:none}
.grp-code{font-family:monospace;font-size:20px;font-weight:700;letter-spacing:3px;text-align:center;padding:14px;background:var(--c1);border-radius:12px;box-shadow:var(--sh);user-select:all;-webkit-user-select:all;margin:8px 0}
/* Dashboard */
.dash-total{text-align:center;padding:20px 0 8px}
.dash-total .big{font-size:36px;font-weight:800}
.dash-total .sub{font-size:12px;color:var(--t2);margin-top:2px}
.dash-card{background:var(--c1);border-radius:16px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:64px}
.dash-card:active{opacity:.8}
.dash-card .dc-l{display:flex;align-items:center;gap:10px}
.dash-card .dc-icon{font-size:22px}
.dash-card .dc-label{font-size:14px;color:var(--t2);font-weight:500}
.dash-card .dc-amt{font-size:22px;font-weight:700}
.dash-card .dc-arrow{font-size:16px;color:var(--t3)}
.dash-net{background:var(--c1);border-radius:16px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--sh);text-align:center}
.dash-net .dn-amt{font-size:24px;font-weight:700}
.dash-net .dn-label{font-size:11px;color:var(--t2);margin-top:2px}
.hist-row{background:var(--c1);border-radius:12px;padding:12px 16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)}
.hist-row .hr-left{font-size:13px}
.hist-row .hr-month{font-weight:600}
.hist-row .hr-detail{font-size:11px;color:var(--t2);margin-top:2px}
.hist-row .hr-net{font-size:16px;font-weight:700}
.back-btn{background:none;border:none;font-size:15px;color:var(--ac);font-weight:600;padding:8px 0;display:flex;align-items:center;gap:4px;min-height:44px}
.back-btn:active{opacity:.6}
/* Quick buttons */
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qb{background:var(--c1);border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--tx);min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.qb:active{background:var(--c2)}
.qb .qb-amt{color:var(--gn);font-size:12px;font-weight:500}
.qb-add{background:none;border:1.5px dashed var(--bd);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--t3);min-height:44px;display:flex;align-items:center}

/* Help tooltips */
.help-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);background:var(--c1);color:var(--t3);font-size:11px;font-weight:700;cursor:pointer;margin-left:4px;flex-shrink:0;vertical-align:middle}
.help-btn:active{background:var(--c2)}
.util-bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:6px}
.util-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.card-stat{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:.5px solid var(--bd)}
.card-stat:last-child{border-bottom:none}
.card-stat .cs-label{color:var(--t2);display:flex;align-items:center;gap:2px}
.card-stat .cs-val{font-weight:600}

/* Velocity / insights */

// ===== CONFIG =====
const FIREBASE_CONFIG = {

// ===== UTILS =====
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=n=>{const a=Math.abs(Math.round(n));return(n<0?"-$":"$")+a.toLocaleString("en-US")};
let _u=Date.now();const uid=()=>"x"+(_u++);
const mk=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const monthLabel=(m)=>{const d=new Date(m+"-15");return MO[d.getMonth()]+" "+d.getFullYear()};
async function sha(s){const e=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function pct(v,mx){return mx>0?Math.min((v/mx)*100,100):0}
function bCol(p,ov,rev){if(rev)return p<50?"var(--or)":p<80?"var(--yl)":"var(--gn)";return ov?"var(--rd)":p>85?"var(--yl)":"var(--gn)"}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

// ===== EMOJI MAP =====
const EMOJI_MAP={"Rent":"🏠","Rent / Housing":"🏠","Housing":"🏠","Food":"🍕","Food & Groceries":"🍕","Groceries":"🛒","Cats":"🐱","Pets":"🐾","Transport":"🚇","Going Out":"🍻","Savings":"💰","Shopping":"🛍️","Subscriptions":"📱","Health":"💊","Utilities":"⚡","Fun":"🎮","Entertainment":"🎬","Insurance":"🛡️","Misc":"📦","Splurges":"🛑","Unnecessary":"🛑"};
function getCatEmoji(name){return S.data.catEmojis?.[name]||EMOJI_MAP[name]||"📁"}

// ===== ID-BASED LOOKUPS =====
function findById(arr,id){return arr.find(x=>x.id===id)}
function findIdxById(arr,id){return arr.findIndex(x=>x.id===id)}

// ===== DEFAULT DATA =====
const DEF={
  template:{income:[],categories:[]},
  months:{},
  goals:{active:[],completed:[]},
  debts:{cards:[],strategy:"avalanche"},
  networth:{accounts:[]},
  monthlyNotes:{},
  quickButtons:[],
  userName:"",
  groups:[],
};

// ===== STATE =====
let db=null,dbRef=null;
let S={phase:"pin",pin:"",data:null,month:mk(),view:"budget",budgetView:"dash",edit:false,modal:null,err:"",expanded:{},chartType:"spending",searchQ:"",searchCat:"all",searchRange:"3",activeGroup:-1,payoffTarget:12};

// ===== FIREBASE =====
function hasFC(){return FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL}
function initFB(){if(!hasFC())return false;try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();return true}catch{return false}}

async function connect(pin){
  const h=await sha(pin);
  if(db){
    dbRef=db.ref("budgets/"+h);
    const snap=await dbRef.once("value");
    S.data=snap.exists()?snap.val():JSON.parse(JSON.stringify(DEF));
    if(!snap.exists())await dbRef.set(S.data);
    dbRef.on("value",s=>{if(s.exists()&&S.phase==="app"){S.data=s.val();ensureStructure();render()}});
  } else {
    const l=localStorage.getItem("bt-"+h);
    S.data=l?JSON.parse(l):JSON.parse(JSON.stringify(DEF));
  }
  ensureStructure();
  S.pin=pin;S.phase="app";render();
}

function ensureStructure(){
  const d=S.data;
  if(!d.template)d.template=JSON.parse(JSON.stringify(DEF.template));
  if(!d.months)d.months={};
  if(!d.goals)d.goals={active:[],completed:[]};
  if(!d.goals.completed)d.goals.completed=[];
  if(!d.networth)d.networth={accounts:[]};
  if(!d.monthlyNotes)d.monthlyNotes={};
  if(!d.quickButtons)d.quickButtons=[];
  if(!d.streakDate)d.streakDate=null;
  if(!d.catEmojis)d.catEmojis={};
  if(d.group&&!d.groups){d.groups=[d.group];delete d.group}
  if(!d.groups)d.groups=[];
  if(!d.userName)d.userName="";
  if(!d.debts)d.debts={cards:[],strategy:"avalanche"};
  if(!d.debts.cards)d.debts.cards=[];
  d.debts.cards.forEach(cd=>{if(!cd.payments)cd.payments=[]});
}

function save(){
  if(dbRef)dbRef.set(S.data);
  const code=localStorage.getItem("bt-sync")||S.pin;
  sha(code).then(h=>localStorage.setItem("bt-"+h,JSON.stringify(S.data)));
}

// ===== MONTH GENERATION =====
function makeAutoTx(amount,note,month){
  return {id:uid(),date:"1st",amount,note:note||"Auto-filled",tags:[],auto:true};
}

function genMonth(m){
  const t=S.data.template,md={income:[],categories:[]};
  t.income.forEach(i=>{
    const txs=i.recurring?[makeAutoTx(i.amount,i.note,m)]:[];
    md.income.push({id:i.id,label:i.label,budgeted:i.amount,recurring:!!i.recurring,note:i.note||"",transactions:txs});
  });
  t.categories.forEach(c=>{
    const cat={id:c.id,name:c.name,items:[]};
    c.items.forEach(i=>{
      const txs=i.recurring?[makeAutoTx(i.amount,i.note,m)]:[];
      cat.items.push({id:i.id,label:i.label,budgeted:i.amount,recurring:!!i.recurring,note:i.note||"",transactions:txs});
    });
    md.categories.push(cat);
  });
  return md;
}

function getMonth(m){
  if(!S.data.months[m]){S.data.months[m]=genMonth(m);save()}
  return S.data.months[m];
}
function cm(){return getMonth(S.month)}

// ===== TEMPLATE UPDATES (ID-BASED) =====
function updateTemplateItem(itemId,catId,updates){
  // Find in template
  let tmpl;
  if(catId===null){tmpl=findById(S.data.template.income,itemId)}
  else{const cat=findById(S.data.template.categories,catId);if(cat)tmpl=findById(cat.items,itemId)}
  if(!tmpl)return;
  Object.assign(tmpl,updates);

  // Update current + all future months by ID
  Object.keys(S.data.months).forEach(mk2=>{
    if(mk2>=S.month){
      const md2=S.data.months[mk2];
      let target;
      if(catId===null){target=findById(md2.income,itemId)}
      else{const mCat=findById(md2.categories,catId);if(mCat)target=findById(mCat.items,itemId)}
      if(!target)return;

      if(updates.label!==undefined)target.label=updates.label;
      if(updates.note!==undefined)target.note=updates.note;
      if(updates.amount!==undefined)target.budgeted=updates.amount;
      if(updates.recurring!==undefined)target.recurring=updates.recurring;

      // Rebuild auto transaction
      const isRec=updates.recurring!==undefined?updates.recurring:target.recurring;
      const amt=updates.amount!==undefined?updates.amount:target.budgeted;
      target.transactions=target.transactions||[];
      if(isRec){
        const ai=target.transactions.findIndex(t=>t.auto);
        const atx=makeAutoTx(amt,target.note,mk2);
        if(ai>=0)target.transactions[ai]=atx;else target.transactions.unshift(atx);
      } else {
        target.transactions=target.transactions.filter(t=>!t.auto);
      }
    }
  });
  save();
}

function addItemToAll(catId,item){
  // Add to template
  if(catId===null){S.data.template.income.push({id:item.id,label:item.label||"New item",amount:0,recurring:false,note:""})}
  else{const tc=findById(S.data.template.categories,catId);if(tc)tc.items.push({id:item.id,label:item.label||"New item",amount:0,recurring:false,note:""})}
  // Add to current + all future months
  const mItem={id:item.id,label:item.label||"New item",budgeted:0,recurring:false,note:"",transactions:[]};
  Object.keys(S.data.months).forEach(mk2=>{
    if(mk2>=S.month){
      const md2=S.data.months[mk2];
      if(catId===null){if(!findById(md2.income,item.id))md2.income.push(JSON.parse(JSON.stringify(mItem)))}
      else{const mc=findById(md2.categories,catId);if(mc&&!findById(mc.items,item.id))mc.items.push(JSON.parse(JSON.stringify(mItem)))}
    }
  });
  save();render();
}

function removeItemFromFuture(itemId,catId){
  // Remove from template
  if(catId===null){const i=findIdxById(S.data.template.income,itemId);if(i>=0)S.data.template.income.splice(i,1)}
  else{const tc=findById(S.data.template.categories,catId);if(tc){const i=findIdxById(tc.items,itemId);if(i>=0)tc.items.splice(i,1)}}
  // Remove from current + all future months (keep past for history)
  Object.keys(S.data.months).forEach(mk2=>{
    if(mk2>=S.month){
      const md2=S.data.months[mk2];
      if(catId===null){const i=findIdxById(md2.income,itemId);if(i>=0)md2.income.splice(i,1)}
      else{const mc=findById(md2.categories,catId);if(mc){const i=findIdxById(mc.items,itemId);if(i>=0)mc.items.splice(i,1)}}
    }
  });
  save();render();
}

function addCategory(){
  const cat={id:uid(),name:"New category",items:[]};
  S.data.template.categories.push({id:cat.id,name:cat.name,items:[]});
  Object.keys(S.data.months).forEach(mk2=>{
    if(mk2>=S.month){
      const md2=S.data.months[mk2];
      if(!findById(md2.categories,cat.id))md2.categories.push({id:cat.id,name:cat.name,items:[]});
    }
  });
  save();render();
}

function removeCategory(catId){
  customConfirm("Delete this category and all its items?",()=>{
    const i=findIdxById(S.data.template.categories,catId);if(i>=0)S.data.template.categories.splice(i,1);
    Object.keys(S.data.months).forEach(mk2=>{if(mk2>=S.month){const md2=S.data.months[mk2];const j=findIdxById(md2.categories,catId);if(j>=0)md2.categories.splice(j,1)}});
    save();render();
  });
}

function renameCategory(catId,name){
  const tc=findById(S.data.template.categories,catId);if(tc)tc.name=name;
  Object.keys(S.data.months).forEach(mk2=>{
    if(mk2>=S.month){const md2=S.data.months[mk2];const mc=findById(md2.categories,catId);if(mc)mc.name=name}
  });
  save();
}

// ===== TRANSACTION HELPERS =====
function txTotal(item){return(item.transactions||[]).reduce((s,t)=>s+(t.amount||0),0)}

function getItemFromMonth(md,itemId,catId){
  if(catId===null)return findById(md.income,itemId);
  const cat=findById(md.categories,catId);
  return cat?findById(cat.items,itemId):null;
}

function allTransactions(){
  const all=[];
  Object.entries(S.data.months||{}).forEach(([m,md])=>{
    md.income.forEach(i=>(i.transactions||[]).forEach(t=>all.push({...t,month:m,category:"Income",item:i.label,type:"income"})));
    md.categories.forEach(c=>c.items.forEach(i=>(i.transactions||[]).forEach(t=>all.push({...t,month:m,category:c.name,item:i.label,type:"expense"}))));
  });
  return all;
}

// ===== NET WORTH HELPERS =====
function getNWBalance(account,month){
  if(!account.balances)return 0;
  if(account.balances[month]!==undefined)return account.balances[month];
  // Walk backward to find most recent
  const months=Object.keys(account.balances).sort();
  let last=0;
  for(const m of months){if(m<=month)last=account.balances[m]}
  return last;
}

function toggleSplitMember(idx){

// Custom confirm (replaces broken confirm() in PWA)
function customConfirm(msg,onYes){
  S._pendingAction=onYes;
  S.modal={type:"confirm",msg};render();
}
// Custom toast (replaces broken alert() in PWA)
function toast(msg){
  const el=document.createElement("div");
  el.style.cssText="position:fixed;top:calc(12px + var(--st));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .2s";
  el.textContent=msg;document.body.appendChild(el);
  requestAnimationFrame(()=>{el.style.opacity="1"});
  setTimeout(()=>{el.style.opacity="0";setTimeout(()=>el.remove(),300)},2000);
}
function recommendBudget(basePay,selectedCats){
  // Budget off BASE pay only. Commissions/variable → savings/debt
  const recs={};
  const rules={
    "Rent / Housing":{pct:0.30,items:[{l:"Rent",p:0.85,r:true},{l:"Utilities",p:0.10,r:true},{l:"Insurance",p:0.05,r:true}]},
    "Food & Groceries":{pct:0.12,items:[{l:"Groceries",p:0.55,r:false},{l:"Eating out",p:0.30,r:false},{l:"Coffee",p:0.10,r:false},{l:"Delivery",p:0.05,r:false}]},
    "Transport":{pct:0.06,items:[{l:"Metro / Bus",p:0.60,r:true},{l:"Uber / Lyft",p:0.30,r:false},{l:"Gas",p:0.10,r:false}]},
    "Going Out":{pct:0.05,items:[{l:"Bars / Drinks",p:0.60,r:false},{l:"Events",p:0.40,r:false}]},
    "Savings":{pct:0.15,items:[{l:"Emergency fund",p:0.70,r:true},{l:"Investments",p:0.30,r:true}]},
    "Subscriptions":{pct:0.03,items:[{l:"Streaming",p:0.40,r:true},{l:"Software",p:0.30,r:true},{l:"Phone plan",p:0.30,r:true}]},
    "Shopping":{pct:0.04,items:[{l:"Clothes",p:0.60,r:false},{l:"Amazon",p:0.40,r:false}]},
    "Health":{pct:0.04,items:[{l:"Gym",p:0.50,r:true},{l:"Pharmacy",p:0.50,r:false}]},
    "Cats":{pct:0.03,items:[{l:"Cat food",p:0.50,r:false},{l:"Litter",p:0.30,r:false},{l:"Vet",p:0.20,r:false}]},
    "Pets":{pct:0.03,items:[{l:"Pet food",p:0.50,r:false},{l:"Vet",p:0.30,r:false},{l:"Supplies",p:0.20,r:false}]},
    "Utilities":{pct:0.05,items:[{l:"Electric",p:0.40,r:true},{l:"Internet",p:0.35,r:true},{l:"Phone",p:0.25,r:true}]},
  };
  selectedCats.forEach(cat=>{
    const rule=rules[cat];
    if(rule){
      const catTotal=Math.round(basePay*rule.pct/10)*10;
      recs[cat]=rule.items.map(it=>({label:it.l,amount:Math.round(catTotal*it.p/10)*10,recurring:it.r}));
    }
  });
  // Always add Misc and Splurges
  recs["Misc"]=[{label:"Uncategorized",amount:0,recurring:false}];
  recs["Splurges"]=[{label:"Unnecessary purchases",amount:0,recurring:false}];
  return recs;
}

function showHelp(title,text){S.modal={type:"help",title,text};render()}
function showAvailHelp(){
  const md=cm();
  const ti=md.income.reduce((s,x)=>s+txTotal(x),0)||md.income.reduce((s,x)=>s+x.budgeted,0);
  const te=md.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+x.budgeted,0),0);
  showHelp('Available for debt','This is your budgeted income minus your non-debt expenses for this month.<br><br>Income: '+fmt(ti)+'<br>Expenses: '+fmt(te)+'<br>Available: '+fmt(Math.max(0,ti-te))+'<br><br>This is the maximum you could put toward credit card payments. If this shows $0, set up your income and expenses in the Budget tab first.');
}
function showAprHelp(){
  const cards=S.data.debts?.cards||[];
  const tb=cards.reduce((s,x)=>s+x.balance,0);
  const wa=tb>0?cards.reduce((s,x)=>s+x.apr*(x.balance/tb),0):0;
  showHelp('Weighted APR','This is the average interest rate across all your cards, weighted by balance. Higher-balance cards count more.<br><br>Your weighted APR: '+wa.toFixed(1)+'%');
}
function showUtilHelp(){
  const cards=S.data.debts?.cards||[];
  const tb=cards.reduce((s,x)=>s+x.balance,0);
  const tl=cards.reduce((s,x)=>s+(x.limit||0),0);
  showHelp('Credit utilization','Utilization is the percentage of your total credit limit you are currently using. Under 30% is good for your credit score. Under 10% is ideal.<br><br>Your total balance is '+fmt(tb)+' across '+fmt(tl)+' in credit limits.');
}
function showInterestHelp(){
  const cards2=S.data.debts?.cards||[];

// ===== VOICE INPUT =====
let voiceRecog=null;
function hasVoice(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}

function startVoice(){
  if(!hasVoice()){toast("Voice not supported on this browser");return}
  S.modal={type:"voice",state:"listening",transcript:""};render();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  voiceRecog=new SR();
  voiceRecog.lang="en-US";
  voiceRecog.interimResults=false;
  voiceRecog.maxAlternatives=1;
  voiceRecog.onresult=(e)=>{
    const text=e.results[0][0].transcript;
    S.modal={type:"voice",state:"done",transcript:text};render();
    setTimeout(()=>processVoice(text),500);
  };
  voiceRecog.onerror=(e)=>{
    if(e.error==="not-allowed")toast("Microphone access denied");
    else if(e.error!=="aborted")toast("Could not hear you — try again");
    closeModal();
  };
  voiceRecog.onend=()=>{if(S.modal&&S.modal.type==="voice"&&S.modal.state==="listening"){toast("Didn't catch that — try again");closeModal()}};
  voiceRecog.start();
}

function stopVoice(){if(voiceRecog)try{voiceRecog.abort()}catch(e){};closeModal()}

function processVoice(text){
  const lower=text.toLowerCase();
  const parsed=parseVoice(lower,text);
  // Open quick-add pre-filled
  S.modal=null;
  openQuickAdd();
  S.modal.qaType=parsed.type;
  S.modal.selCat=parsed.catId||null;
  S.modal.selItem=parsed.itemId||null;
  render();
  // Fill in the fields after render
  setTimeout(()=>{
    const inp=document.getElementById("m-inp");if(inp)inp.value=parsed.amount||"";
    const note=document.getElementById("m-note");if(note)note.value=parsed.note||"";
    const tags=document.getElementById("m-tags");if(tags)tags.value="voice";
  },100);
}

function parseVoice(lower,original){
  const result={type:"expense",amount:0,note:"",catId:null,itemId:null};

  // Detect type
  if(lower.match(/\b(earned|made|got paid|received|income|commission|paycheck|salary)\b/))result.type="income";
  else if(lower.match(/\b(paid off|payment on|paid.*card|card payment)\b/))result.type="payment";

  // Extract amount
  const amtMatch=lower.match(/\$?\s*(\d+(?:\.\d{1,2})?)\s*(?:dollars?|bucks?)?/)||lower.match(/(\d+(?:\.\d{1,2})?)/);
  if(amtMatch)result.amount=parseFloat(amtMatch[1]);

  // Extract note - remove amount and filler words
  let note=original;
  note=note.replace(/\$?\d+(?:\.\d{1,2})?\s*(?:dollars?|bucks?)?/i,"").trim();
  note=note.replace(/^(i\s+)?(spent|paid|bought|got|earned|made|received)\s*/i,"").trim();
  note=note.replace(/^(at|on|for|from)\s+/i,"").trim();
  note=note.replace(/\s+/g," ").trim();
  if(note)result.note=note.charAt(0).toUpperCase()+note.slice(1);

  // Match category and item
  const md=cm();
  if(result.type==="expense"){
    const catKeywords={
      "food":["uber eats","doordash","grubhub","whole foods","trader joe","starbucks","coffee","restaurant","lunch","dinner","breakfast","pizza","burger","sushi","thai","chinese","groceries","grocery","supermarket","deli","bagel","food","eat"],
      "transport":["uber","lyft","taxi","train","metro","subway","bus","gas","parking","toll"],
      "going out":["bar","drinks","club","concert","movie","show","event","tickets"],
      "cats":["cat food","cat litter","cat","pet","vet","litter","treats"],
      "shopping":["amazon","clothes","shoes","target","walmart","store"],
      "subscriptions":["spotify","netflix","hulu","disney","icloud","apple","subscription"],
      "health":["pharmacy","doctor","hospital","medicine","gym","workout"]
    };
    // Build a flat list of all keywords sorted longest first (multi-word wins)
    const allKws=[];
    for(const[catKey,keywords] of Object.entries(catKeywords)){
      keywords.forEach(kw=>allKws.push({kw,catKey}));
    }
    allKws.sort((a,b)=>b.kw.length-a.kw.length);
    // Find first (longest) keyword match
    let matchedCatKey=null;
    for(const{kw,catKey} of allKws){
      if(lower.includes(kw)){matchedCatKey=catKey;break}
    }
    if(matchedCatKey){
      const matchCat=md.categories.find(c2=>c2.name.toLowerCase().includes(matchedCatKey));
      if(matchCat){
        result.catId=matchCat.id;
        // Match item by label — longest match wins
        let bestIt=null,bestLen=0;
        const lowerWords=lower.split(/\s+/);
        matchCat.items.forEach(it=>{
          const il=it.label.toLowerCase();
          // Direct inclusion
          if(lower.includes(il)&&il.length>bestLen){bestIt=it;bestLen=il.length}
          // Word-level: any item word starts with a speech word or vice versa (handles singular/plural)
          else{const ilWords=il.split(/\s+/);
            const matched=ilWords.filter(w=>w.length>2&&lowerWords.some(sw=>sw.length>2&&(sw.startsWith(w.slice(0,3))&&(sw.includes(w.slice(0,-1))||w.includes(sw.slice(0,-1))))));
            if(matched.length>0){const score=matched.join('').length;if(score>bestLen){bestIt=it;bestLen=score}}}
        });
        // Also check keyword→item hints
        if(!bestIt){
          const itemHints={"starbucks":"coffee","doordash":"delivery","grubhub":"delivery","uber eats":"delivery","whole foods":"groceries","trader joe":"groceries"};
          for(const[hint,itemKey] of Object.entries(itemHints)){
            if(lower.includes(hint)){const mi=matchCat.items.find(i2=>i2.label.toLowerCase().includes(itemKey));if(mi){bestIt=mi;break}}
          }
        }
        if(bestIt)result.itemId=bestIt.id;
        else if(matchCat.items.length)result.itemId=matchCat.items[0].id;
      }
    } else {
      // No keyword match — try direct item label scan across all categories
      let bestItem=null,bestCat=null,bestLen=0;
      md.categories.forEach(c2=>{c2.items.forEach(it=>{
        const il=it.label.toLowerCase();
        if(il.length>2&&lower.includes(il)&&il.length>bestLen){bestItem=it;bestCat=c2;bestLen=il.length}
      })});
      if(bestItem){result.catId=bestCat.id;result.itemId=bestItem.id}
    }
  } else if(result.type==="income"){
    // Try to match income source
    const matchInc=md.income.find(i=>{const il=i.label.toLowerCase();return lower.includes(il)||il.split(' ').some(w=>w.length>3&&lower.includes(w))});
    if(matchInc)result.selItem=matchInc.id;
    result.itemId=result.selItem||null;
  } else if(result.type==="payment"){
    // Try to match card
    const cards=S.data.debts?.cards||[];
    const matchCard=cards.find(cd=>{const cn=cd.name.toLowerCase();return lower.includes(cn)||cn.split(' ').some(w=>w.length>2&&lower.includes(w))});
    if(matchCard)result.itemId=matchCard.id;
  }

  return result;
}

// ===== QUICK BUTTONS =====
function fireQuickButton(qi){
  const qb=S.data.quickButtons[qi];if(!qb)return;
  const md=cm();
  const cat=findById(md.categories,qb.catId);
  const item=cat?findById(cat.items,qb.itemId):null;
  if(!item){toast("Item not found — edit your shortcuts");return}
  if(!item.transactions)item.transactions=[];
  const d=new Date();
  item.transactions.push({id:uid(),date:(d.getMonth()+1)+"/"+d.getDate(),amount:qb.amount,note:qb.label,tags:["quick"],auto:false});
  S.data.streakDate=new Date().toISOString().split('T')[0];
  save();render();
}

function removeQuickButton(qi){
  S.data.quickButtons.splice(qi,1);save();render();
}

function openQuickButtonModal(){
  const md=cm();
  S.modal={type:"newqb",selCat:null,selItem:null};render();
}

function saveQuickButton(){
  const m=S.modal;
  const label=document.getElementById("m-label").value.trim()||"Shortcut";
  const amt=parseFloat(document.getElementById("m-inp").value)||0;
  if(amt===0||!m.selCat||!m.selItem){toast("Fill in all fields");return}
  S.data.quickButtons.push({id:uid(),label,amount:amt,catId:m.selCat,itemId:m.selItem});
  save();closeModal();
}

// ===== QUICK ADD =====
function openQuickAdd(){
  S.modal={type:"quickadd",qaType:"expense",selCat:null,selItem:null};
  render();
  setTimeout(()=>{const i=document.getElementById("m-inp");if(i){i.focus()}},60);
}

function saveQuickAdd(){
  const m=S.modal;
  const amt=parseFloat(document.getElementById("m-inp").value)||0;
  if(amt===0){closeModal();return}
  const note=document.getElementById("m-note").value.trim();
  const tagsRaw=document.getElementById("m-tags").value.trim();
  const tags=tagsRaw?tagsRaw.split(",").map(t=>t.trim()).filter(Boolean):[];
  const d=new Date();
  const dateStr=(d.getMonth()+1)+"/"+d.getDate();

  if(m.qaType==="payment"){
    if(!m.selItem){toast("Pick a card");return}
    const card=S.data.debts.cards.find(x=>x.id===m.selItem);
    if(!card){toast("Card not found");return}
    card.balance=Math.max(0,card.balance-amt);
    if(!card.payments)card.payments=[];
    card.payments.push({id:uid(),date:dateStr,amount:amt,note:note||"Payment",month:S.month});
    S.data.streakDate=new Date().toISOString().split('T')[0];
    save();closeModal();
    return;
  }

  const tx={id:uid(),date:dateStr,amount:amt,note,tags,auto:false};
  const md=cm();
  let item=null;

  if(m.qaType==="income"){
    if(!m.selItem){toast("Pick an income source");return}
    item=findById(md.income,m.selItem);
  } else {
    if(!m.selCat||!m.selItem){toast("Pick a category and item");return}
    const cat=findById(md.categories,m.selCat);
    if(cat)item=findById(cat.items,m.selItem);
  }

  if(!item){toast("Item not found");return}
  if(!item.transactions)item.transactions=[];
  item.transactions.push(tx);
  S.data.streakDate=new Date().toISOString().split('T')[0];
  save();closeModal();
}

    const tI=md.income.reduce((s,x)=>s+txTotal(x),0),tIB=md.income.reduce((s,x)=>s+x.budgeted,0);
    const tE=md.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);
    const tEB=md.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+x.budgeted,0),0);
    const net=tI-tE;

    if(S.budgetView==="in"){
      // === MONEY IN DETAIL ===
      h+=`<div class="cnt view-enter" style="padding-top:8px">`;
      h+=`<button class="back-btn" onclick="S.budgetView='dash';S.edit=false;render()">‹ Budget</button>`;
      h+=`<div class="sec-in">`;
      h+=renderSection(md.income,"Money In",null,em,true);
      h+=`</div></div>`;

    } else if(S.budgetView==="out"){
      // === MONEY OUT DETAIL ===
      h+=`<div class="cnt view-enter" style="padding-top:8px">`;
      h+=`<button class="back-btn" onclick="S.budgetView='dash';S.edit=false;render()">‹ Budget</button>`;
      // Quick buttons
      const qbs=S.data.quickButtons||[];
      if(qbs.length>0||em){
        h+=`<div style="margin-bottom:4px;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:1px">Quick log</div>`;
        h+=`<div class="qb-row">`;
        qbs.forEach((qb,qi)=>{
          if(em){
            h+=`<button class="qb" onclick="removeQuickButton(${qi})">× ${esc(qb.label)} <span class="qb-amt">${fmt(qb.amount)}</span></button>`;
          } else {
            h+=`<button class="qb" onclick="fireQuickButton(${qi})">${esc(qb.label)} <span class="qb-amt">${fmt(qb.amount)}</span></button>`;
          }
        });
        if(em)h+=`<button class="qb-add" onclick="openQuickButtonModal()">+ Shortcut</button>`;
        h+=`</div>`;
      }
      // Categories
      h+=`<div class="sec-out">`;
      md.categories.forEach(cat=>{
        h+=renderSection(cat.items,cat.name,cat.id,em,false);
      });
      if(em)h+=`<button class="add" onclick="addCategory()">+ Add category</button>`;
      if(!em&&qbs.length===0)h+=`<div style="font-size:12px;color:var(--t3);margin-top:8px;text-align:center">Tip: In edit mode, add Quick Log shortcuts for purchases you make often</div>`;
      h+=`</div></div>`;

    } else {
      // === DASHBOARD ===
      // Running total across all months
      let runTotal=0;
      const sortedMonths=Object.keys(S.data.months||{}).sort();
      sortedMonths.forEach(m2=>{const md2=S.data.months[m2];const mI=md2.income.reduce((s,x)=>s+txTotal(x),0);const mE=md2.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);runTotal+=mI-mE});

      h+=`<div class="cnt" style="padding-top:0">`;
      // Running total
      h+=`<div class="dash-total"><div class="big" style="color:${runTotal>=0?'var(--gn)':'var(--rd)'}">${fmt(runTotal)}</div><div class="sub">Running total · all months</div></div>`;
      // This month net
      h+=`<div class="dash-net"><div class="dn-amt" style="color:${net>=0?'var(--gn)':'var(--rd)'}">${net>=0?'+':''}${fmt(net)}</div><div class="dn-label">This month</div></div>`;
      // Money In card
      h+=`<div class="dash-card view-enter" onclick="S.budgetView='in';render()"><div class="dc-l"><span class="dc-icon">💰</span><div><div class="dc-label">Money In</div><div class="dc-amt" style="color:var(--gn)">${fmt(tI)}</div></div></div><span class="dc-arrow">›</span></div>`;
      // Money Out card
      h+=`<div class="dash-card view-enter" onclick="S.budgetView='out';render()"><div class="dc-l"><span class="dc-icon">💸</span><div><div class="dc-label">Money Out</div><div class="dc-amt" style="color:${tE>0?'var(--rd)':'var(--t3)'}">${fmt(tE)}</div></div></div><span class="dc-arrow">›</span></div>`;
      // === INSIGHTS ===
      const daysInMonth=new Date(parseInt(S.month.split("-")[0]),parseInt(S.month.split("-")[1]),0).getDate();
      const today2=new Date();
      const currentDay=S.month===mk()?today2.getDate():daysInMonth;
      const daysLeft=Math.max(0,daysInMonth-currentDay);

      // Savings rate
      if(tI>0){
        const savingsRate=Math.round((net/tI)*100);
        const srColor=savingsRate>=20?'var(--gn)':savingsRate>=10?'var(--yl)':savingsRate>=0?'var(--or)':'var(--rd)';
        h+=`<div class="insight view-enter"><span class="ins-icon">${savingsRate>=20?'🏆':savingsRate>=0?'📊':'⚠️'}</span><div class="ins-body"><div class="ins-title" style="color:${srColor}">${savingsRate}% savings rate</div><div class="ins-sub">${savingsRate>=20?'Great — above 20% target':savingsRate>=10?'Decent — aim for 20%':savingsRate>=0?'Low — look for cuts':'Spending more than earning'}</div></div></div>`;
      }

      // Spending velocity
      if(tE>0&&currentDay>0&&daysLeft>0){
        const dailyAvg=tE/currentDay;
        const projected=Math.round(dailyAvg*daysInMonth);
        const overBudget=projected>tEB;
        if(Math.abs(projected-tEB)>100){
          h+=`<div class="insight view-enter"><span class="ins-icon">${overBudget?'🔥':'✅'}</span><div class="ins-body"><div class="ins-title" style="color:${overBudget?'var(--rd)':'var(--gn)'}">On pace to spend ${fmt(projected)}</div><div class="ins-sub">${overBudget?fmt(projected-tEB)+' over budget at this rate — '+daysLeft+' days to adjust':''+fmt(tEB-projected)+' under budget — '+daysLeft+' days left'}</div></div></div>`;
        }
      }

      // Spending streak
      const todayStr=mk()===S.month?(today2.getMonth()+1)+"/"+today2.getDate():"";
      if(todayStr){
        // Count days with logged transactions this month
        const allTxDates=new Set();
        md.categories.forEach(c2=>c2.items.forEach(i=>(i.transactions||[]).filter(tx=>!tx.auto).forEach(tx=>{if(tx.date)allTxDates.add(tx.date)})));
        const streakDays=allTxDates.size;
        if(streakDays>0){
          h+=`<div class="insight streak view-enter"><span class="ins-icon">🔥</span><div class="ins-body"><div class="ins-title">${streakDays} day${streakDays!==1?'s':''} logged this month</div><div class="ins-sub">Keep tracking to stay on top of spending</div></div></div>`;
        }
      }

      // Bill calendar - upcoming recurring expenses with due dates
      const recurItems=[];
      md.categories.forEach(c2=>c2.items.filter(i=>i.recurring).forEach(i=>{recurItems.push({label:i.label,amount:i.budgeted,cat:c2.name})}));
      md.income.filter(i=>i.recurring).forEach(i=>{recurItems.push({label:i.label,amount:i.budgeted,cat:"Income"})});
      // Also card statement dates
      (S.data.debts?.cards||[]).filter(cd=>cd.stmtDate).forEach(cd=>{recurItems.push({label:cd.name+" statement",amount:cd.minPayment,cat:"Card",day:cd.stmtDate})});

      if(recurItems.length>0){
        const billKey="bills-main";
        const billOpen=S.expanded[billKey];
        h+=`<div class="insight view-enter" style="cursor:pointer;flex-direction:column;align-items:stretch" onclick="S.expanded['${billKey}']=!S.expanded['${billKey}'];render()">`;
        h+=`<div style="display:flex;align-items:center;gap:10px"><span class="ins-icon">📅</span><div class="ins-body"><div class="ins-title">${recurItems.length} recurring item${recurItems.length!==1?'s':''}</div><div class="ins-sub">${billOpen?'Tap to hide':'Tap to see your fixed costs'}</div></div></div>`;
        if(billOpen){
          h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)">`;
          recurItems.forEach(b=>{
            h+=`<div class="bill-item"><span>${getCatEmoji(b.cat)} ${esc(b.label)}</span><span style="font-weight:600">${fmt(b.amount)}</span></div>`;
          });
          h+=`</div>`;
        }
        h+=`</div>`;
      }

      // Voice button on dashboard
      h+=`<div class="dash-card" onclick="startVoice()" style="justify-content:center;gap:8px;background:linear-gradient(135deg,rgba(26,143,92,.06),rgba(34,102,204,.06));border:1px solid rgba(26,143,92,.15)"><span style="font-size:20px">🎤</span><div style="font-size:14px;font-weight:600">Voice log</div><div style="font-size:11px;color:var(--t2)">Say what you spent</div></div>`;

      // Monthly note
      const mNote=S.data.monthlyNotes[S.month]||"";
      h+=`<div style="cursor:pointer;min-height:44px;display:flex;align-items:center" onclick="openModal({type:'monthnote'})">`;
      h+=mNote?`<div class="mn">${esc(mNote)}</div>`:`<div style="font-size:12px;color:var(--t3);padding:6px 0">+ Add monthly note</div>`;
      h+=`</div>`;
      // Disparity check
      const surp=tIB-tEB,disparity=Math.abs(net-surp);
      if((tI>0||tE>0)&&disparity>100){
        h+=`<div class="mn" style="border-left:3px solid ${net<surp?'var(--rd)':'var(--gn)'};background:${net<surp?'rgba(204,59,59,.08)':'rgba(26,143,92,.08)'}"><b style="color:${net<surp?'var(--rd)':'var(--gn)'}">${net<surp?'⚠️':'✅'} ${fmt(disparity)} ${net<surp?'off budget':'ahead'}</b></div>`;
      }
      // History
      h+=`<div style="margin-top:14px">`;
      const histKey="hist-main";
      const histOpen=S.expanded[histKey];
      h+=`<div class="sh" onclick="S.expanded['${histKey}']=!S.expanded['${histKey}'];render()"><div style="display:flex;align-items:center;gap:4px"><span class="sh-arrow ${histOpen?'open':''}">▸</span><span class="sh-t">History</span></div><span class="sh-v">${sortedMonths.length} months</span></div>`;
      if(histOpen){
        let cumulative=0;
        sortedMonths.forEach(m2=>{
          const md2=S.data.months[m2];
          const mI=md2.income.reduce((s,x)=>s+txTotal(x),0);
          const mE=md2.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);
          const mNet=mI-mE;
          cumulative+=mNet;
        });
        // Show in reverse chronological
        let runDown=runTotal;
        [...sortedMonths].reverse().forEach(m2=>{
          const md2=S.data.months[m2];
          const mI=md2.income.reduce((s,x)=>s+txTotal(x),0);
          const mE=md2.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);
          const mNet=mI-mE;
          const dt2=new Date(m2+"-15");
          h+=`<div class="hist-row"><div class="hr-left"><div class="hr-month">${MO[dt2.getMonth()]} ${dt2.getFullYear()}</div><div class="hr-detail">In: ${fmt(mI)} · Out: ${fmt(mE)} · Running: ${fmt(runDown)}</div></div><div class="hr-net" style="color:${mNet>=0?'var(--gn)':'var(--rd)'}">${mNet>=0?'+':''}${fmt(mNet)}</div></div>`;

      h+=`</div>`;
      // First month helper
      if(sortedMonths.length<=1&&tI===0&&tE===0){
        h+=`<div class="mn" style="margin-top:12px;text-align:center">
          <div style="font-size:18px;margin-bottom:6px">👋</div>
          <b>Get started</b><br>
          <span style="font-size:12px">Tap <b>Money In</b> to add income, then <b>Money Out</b> to add expenses. Use Edit mode inside each to set up your budget.</span>
        </div>`;

      h+=`</div>`;

  else if(S.view==="cards"){
    const cards=S.data.debts?.cards||[];
    h+=`<div class="cnt" style="padding-top:8px">`;
    if(cards.length>0){
      // Aggregates
      const totalBal=cards.reduce((s,x)=>s+x.balance,0);
      const totalLim=cards.reduce((s,x)=>s+(x.limit||0),0);
      const totalUtil=totalLim>0?Math.round(totalBal/totalLim*100):0;
      const totalMin=cards.reduce((s,x)=>s+(x.minPayment||0),0);
      const monthlyInterest=cards.reduce((s,x)=>s+x.balance*(x.apr/100/12),0);
      const weightedApr=totalBal>0?cards.reduce((s,x)=>s+x.apr*(x.balance/totalBal),0):0;

      // Budget calculation
      const md3=cm();
      const totalIncome=md3.income.reduce((s,x)=>s+txTotal(x),0)||md3.income.reduce((s,x)=>s+x.budgeted,0);
      const totalExpense=md3.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+x.budgeted,0),0);
      const available=Math.max(0,totalIncome-totalExpense);

      // Debt-to-income bracket
      const annualIncome=totalIncome*12||1;
      const dtiRatio=totalBal/annualIncome;
      let bracket,bracketLabel,bracketColor,bracketAdvice,suggestedPct;
      if(dtiRatio<0.05){bracket="low";bracketLabel="Low";bracketColor="var(--gn)";bracketAdvice="Debt is minimal. Pay a bit above minimums and focus on savings.";suggestedPct=0.10}
      else if(dtiRatio<0.15){bracket="moderate";bracketLabel="Moderate";bracketColor="var(--yl)";bracketAdvice="Solid position. Put 15-20% of your free cash toward debt to clear it within a year.";suggestedPct=0.20}
      else if(dtiRatio<0.30){bracket="elevated";bracketLabel="Elevated";bracketColor="var(--or)";bracketAdvice="Prioritize payoff. Aim to put 30-40% of available money toward debt. Cut discretionary spending.";suggestedPct=0.35}
      else if(dtiRatio<0.50){bracket="high";bracketLabel="High";bracketColor="var(--rd)";bracketAdvice="This needs attention. Allocate 50%+ of available cash to debt. Consider a side hustle or expense cuts.";suggestedPct=0.50}
      else{bracket="critical";bracketLabel="Critical";bracketColor="var(--rd)";bracketAdvice="Debt exceeds half your annual income. Put every spare dollar toward payoff. Consider balance transfers or debt consolidation.";suggestedPct=0.70}

      // Calculate recommended total payment
      const suggestedTotal=Math.max(totalMin,Math.round(available*suggestedPct/10)*10);
      const extra=Math.max(0,suggestedTotal-totalMin);

      // Strategy
      const strat=S.data.debts?.strategy||"avalanche";
      const sorted=[...cards].map((cd2,i)=>({...cd2,idx:i}));
      if(strat==="avalanche")sorted.sort((a,b)=>b.apr-a.apr);
      else sorted.sort((a,b)=>a.balance-b.balance);
      const payments={};
      cards.forEach(cd2=>{payments[cd2.id]=cd2.minPayment||0});
      let extraLeft=extra;
      for(const cd2 of sorted){if(cd2.balance>0&&extraLeft>0){const add2=Math.min(extraLeft,cd2.balance-payments[cd2.id]);if(add2>0){payments[cd2.id]+=add2;extraLeft-=add2}}}

      // Simulate payoff with suggested payments
      function simPayoff(monthlyExtra){
        let sc=cards.map(cd2=>({...cd2,bal:cd2.balance}));let mo=0;
        while(sc.some(cd2=>cd2.bal>0)&&mo<120){mo++;const ss2=[...sc].filter(cd2=>cd2.bal>0);
          if(strat==="avalanche")ss2.sort((a,b)=>b.apr-a.apr);else ss2.sort((a,b)=>a.bal-b.bal);
          let se=monthlyExtra;
          sc.forEach(cd2=>{if(cd2.bal>0){cd2.bal+=cd2.bal*(cd2.apr/100/12);const py=Math.min(cd2.bal,cd2.minPayment||0);cd2.bal-=py}});
          for(const cd2 of ss2){if(cd2.bal>0&&se>0){const py=Math.min(cd2.bal,se);cd2.bal-=py;se-=py}}
          sc.forEach(cd2=>{if(cd2.bal<1)cd2.bal=0})}
        return mo;
      }
      const months=simPayoff(extra);
      const monthsMinOnly=simPayoff(0);
      const payoffDate=new Date();payoffDate.setMonth(payoffDate.getMonth()+months);
      const minOnlyDate=new Date();minOnlyDate.setMonth(minOnlyDate.getMonth()+monthsMinOnly);
      const totalInterestRec=cards.reduce((s,x)=>{let b=x.balance,ti=0;for(let m=0;m<months&&b>0;m++){const i=b*(x.apr/100/12);ti+=i;b+=i;b-=Math.min(b,(payments[x.id]||x.minPayment||0))}return s+ti},0);
      const totalInterestMin=cards.reduce((s,x)=>{let b=x.balance,ti=0;for(let m=0;m<120&&b>0;m++){const i=b*(x.apr/100/12);ti+=i;b+=i;b-=Math.min(b,x.minPayment||0)}return s+ti},0);

      // === OVERVIEW CARD ===
      h+=`<div class="debt-summary" style="margin-bottom:14px">`;
      h+=`<div style="text-align:center;padding-bottom:10px;border-bottom:1px solid var(--bd)">`;
      h+=`<div style="font-size:32px;font-weight:800;color:var(--rd)">${fmt(totalBal)}</div>`;
      h+=`<div style="font-size:12px;color:var(--t2)">Total debt</div>`;
      if(totalLim>0){
        const uc=totalUtil>75?'var(--rd)':totalUtil>50?'var(--or)':totalUtil>30?'var(--yl)':'var(--gn)';
        h+=`<div class="util-bar"><div class="fill" style="width:${totalUtil}%;background:${uc}"></div></div>`;
        h+=`<div style="font-size:11px;color:var(--t2);margin-top:3px">${totalUtil}% utilization of ${fmt(totalLim)} total credit <button class="help-btn" onclick="showUtilHelp()">?</button></div>`;

      h+=`</div>`;

      // === PAYOFF PLANNER ===
      // Calculate required payment for target months
      const target=S.payoffTarget||12;
      function calcRequiredPayment(targetMonths){
        let lo=totalMin,hi=totalBal+monthlyInterest*targetMonths,mid;
        for(let iter=0;iter<50;iter++){mid=(lo+hi)/2;const mo=simPayoff(Math.max(0,mid-totalMin));if(mo<=targetMonths)hi=mid;else lo=mid}
        return Math.round(hi/10)*10;
      }
      const requiredPay=calcRequiredPayment(target);
      const reqExtra=Math.max(0,requiredPay-totalMin);
      // Recalc payments for target
      const tPayments={};
      cards.forEach(cd2=>{tPayments[cd2.id]=cd2.minPayment||0});
      let tExtraLeft=reqExtra;
      for(const cd2 of sorted){if(cd2.balance>0&&tExtraLeft>0){const add2=Math.min(tExtraLeft,cd2.balance-tPayments[cd2.id]);if(add2>0){tPayments[cd2.id]+=add2;tExtraLeft-=add2}}}
      // Override payments with target-based
      Object.assign(payments,tPayments);

      const targetDate=new Date();targetDate.setMonth(targetDate.getMonth()+target);
      const actualMonths=simPayoff(reqExtra);
      const interestAtTarget=cards.reduce((s,x)=>{let b=x.balance,ti=0;for(let m=0;m<target&&b>0;m++){const mi2=b*(x.apr/100/12);ti+=mi2;b+=mi2;b-=Math.min(b,(tPayments[x.id]||x.minPayment||0))}return s+ti},0);

      // Shortfall analysis: if requiredPay > available, find what to cut
      const shortfall=requiredPay-available;
      const cuttable=[];
      md3.categories.forEach(cat=>{cat.items.forEach(it=>{
        if(!it.recurring&&it.budgeted>0)cuttable.push({label:it.label,cat:cat.name,amount:it.budgeted})

      // Timeline picker
      h+=`<div style="padding:10px 0 8px">

      [6,12,18,24].forEach(mo=>{

      });
      h+=`</div>`;

      // Big payoff card
      h+=`<div style="background:${shortfall>0?'rgba(204,59,59,.06)':'rgba(26,143,92,.06)'};border:1px solid ${shortfall>0?'rgba(204,59,59,.15)':'rgba(26,143,92,.15)'};border-radius:14px;padding:14px;margin-bottom:10px">`;
      h+=`<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:22px;font-weight:800">${fmt(requiredPay)}<span style="font-size:13px;font-weight:500;color:var(--t2)">/mo</span></span><span style="font-size:12px;color:var(--t2)">debt-free by ${MO[targetDate.getMonth()]} ${targetDate.getFullYear()}</span></div>`;
      h+=`<div style="font-size:12px;color:var(--t2);margin-top:4px">${fmt(interestAtTarget)} total interest · ${fmt(totalMin)}/mo minimums + ${fmt(reqExtra)} extra</div>`;

      if(shortfall>0&&cuttable.length>0){

        h+=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)">`;

        h+=`</div>`;
      } else if(shortfall>0){
        h+=`<div style="margin-top:8px;font-size:12px;color:var(--rd)">This exceeds your available cash by ${fmt(shortfall)}/mo. Try a longer timeline or add income.</div>`;

      h+=`</div>`;

      // Minimums-only comparison
      h+=`<div style="font-size:12px;color:var(--t3);margin-bottom:10px">Minimums only: ${monthsMinOnly<120?monthsMinOnly+' months':'10+ years'} · ${fmt(totalInterestMin)} in interest</div>`;

      // === PAYOFF PROJECTION CHART ===
      // Generate month-by-month data
      const projData=[];
      const projCards=cards.map(cd2=>({name:cd2.name,bal:cd2.balance,id:cd2.id}));
      const projMonths=Math.max(target,actualMonths,12);
      for(let m=0;m<=projMonths&&m<=60;m++){

        // Apply interest + payments for next month
        const ss3=[...projCards].filter(cd2=>cd2.bal>0);
        if(strat==="avalanche")ss3.sort((a,b)=>{const ca=cards.find(x=>x.id===a.id),cb=cards.find(x=>x.id===b.id);return(cb?.apr||0)-(ca?.apr||0)});

        projCards.forEach(cd2=>{if(cd2.bal>0){const card=cards.find(x=>x.id===cd2.id);cd2.bal+=cd2.bal*((card?.apr||0)/100/12);const py=Math.min(cd2.bal,card?.minPayment||0);cd2.bal-=py}});
        for(const cd2 of ss3){if(cd2.bal>0&&se2>0){const py=Math.min(cd2.bal,se2);cd2.bal-=py;se2-=py}}
        projCards.forEach(cd2=>{if(cd2.bal<1)cd2.bal=0});
      }

      // Also generate minimums-only projection for comparison
      const minProjCards=cards.map(cd2=>({name:cd2.name,bal:cd2.balance,id:cd2.id}));

        minProjCards.forEach(cd2=>{if(cd2.bal>0){const card=cards.find(x=>x.id===cd2.id);cd2.bal+=cd2.bal*((card?.apr||0)/100/12);const py=Math.min(cd2.bal,card?.minPayment||0);cd2.bal-=py;if(cd2.bal<1)cd2.bal=0}});
      }

      // Render chart
      h+=`<div style="margin-bottom:14px"><canvas id="payoff-chart" height="200"></canvas></div>`;
      // Store chart data for rendering after DOM update
      S._payoffChart={projData,minProjData,cards:cards.map(cd2=>({id:cd2.id,name:cd2.name})),target};

      // Core stats
      h+=`<div style="padding-top:4px">`;

        h+=`</div>`;

        expenses.slice(0,20).forEach(ex=>{

          h+=`<div class="grp-card" style="padding:10px 14px"><div style="display:flex;justify-content:space-between"><span style="font-size:14px;font-weight:500">${esc(ex.note)}</span><span style="font-size:15px;font-weight:700">${fmt(ex.amount)}</span></div><div style="font-size:11px;color:var(--t2);margin-top:3px">${esc(ex.paidBy)} paid · ${fmt(pp)}/person · ${ex.date}</div></div>`;
        });
      }
      // Leave
      h+=`<button class="add" style="color:var(--rd);border-color:var(--rd);margin-top:12px" onclick="customConfirm('Leave this group?',()=>{S.data.groups.splice(${S.activeGroup},1);const ref=groupRefs['${grp.code}'];if(ref){ref.off();delete groupRefs['${grp.code}']}delete groupDatas['${grp.code}'];S.activeGroup=-1;save();render()})">Leave group</button>`;
    }
    h+=`</div>`;
  }

  else if(S.view==="goals"){
    h+=`<div class="cnt" style="padding-top:8px">`;

    // === GOALS ===
    const ga=S.data.goals?.active||[];
    ga.forEach((g,gi)=>{
      let paid,remain,pc,lb;
      if(g.type==="payoff"){paid=g.start-g.current;pc=g.start>0?pct(paid,g.start):0;remain=Math.max(0,g.current);lb=`${fmt(paid)} paid of ${fmt(g.start)}`}
      else{pc=g.target>0?pct(g.current,g.target):0;remain=Math.max(0,g.target-g.current);lb=`${fmt(g.current)} of ${fmt(g.target)}`}
      const ml=g.monthly>0&&remain>0?Math.ceil(remain/g.monthly):0;
      const done=(g.type==="payoff"&&g.current<=0)||(g.type==="savings"&&g.current>=g.target);
      h+=`<div class="gc"><div class="gc-h"><span class="gc-t">${esc(g.label)}</span><span class="gc-v" style="color:${g.type==='payoff'?(g.current>0?'var(--rd)':'var(--gn)'):'var(--gn)'}" onclick="openGoalCurrentModal(${gi})">${fmt(g.current)}</span></div>
      <div class="bar" style="height:4px"><div class="bar-f" style="width:${pc}%;background:${bCol(pc,false,true)};height:100%"></div></div>
      <div class="gc-s"><span>${lb}</span><span>${Math.round(pc)}%</span></div>`;
      if(done)h+=`<div class="gc-n" style="color:var(--gn);font-weight:600">Ready to complete! 🎉</div>`;
      else if(ml>0)h+=`<div class="gc-n">At ${fmt(g.monthly)}/mo → ~${ml} month${ml!==1?'s':''}</div>`;
      h+=`<div class="gc-a"><button onclick="openGoalEditModal(${gi})">Edit</button><button onclick="completeGoal(${gi})">Complete</button><button onclick="deleteGoal(${gi})">Delete</button></div></div>`;
    });
    if(!ga.length)h+=`<div style="text-align:center;padding:24px 0;color:var(--t3)">No active goals. Tap + Goal.</div>`;
    const gc=S.data.goals?.completed||[];
    if(gc.length){
      h+=`<details class="trophy"><summary>Completed (${gc.length}) 🏆</summary>`;
      gc.forEach(g=>{const d1=new Date(g.created),d2=new Date(g.completed);h+=`<div class="trophy-i"><div class="nm">${esc(g.label)}</div>${MO[d1.getMonth()]} ${d1.getFullYear()} → ${MO[d2.getMonth()]} ${d2.getFullYear()} · ${fmt(g.type==='payoff'?g.start:g.target)}</div>`});
      h+=`</details>`;
    }
    h+=`</div>`;
  }

  else if(S.view==="trends"){
    h+=`<div class="cnt" style="padding-top:8px"><div class="chart-pick">`;
    [{k:"spending",l:"By category"},{k:"income-vs-spend",l:"In vs out"},{k:"breakdown",l:"This month"}].forEach(t=>{
      h+=`<button class="${S.chartType===t.k?'on':''}" onclick="S.chartType='${t.k}';render()">${t.l}</button>`;
    });
    h+=`</div><div class="chart-wrap"><canvas id="mainChart"></canvas></div></div>`;
  }

  else if(S.view==="search"){
    h+=`<div class="cnt" style="padding-top:8px">`;
    h+=`<div class="s-bar"><input id="s-input" placeholder="Search transactions..." maxlength="100" value="${esc(S.searchQ)}" oninput="S.searchQ=this.value;doSearch()"></div>`;
    const cats=new Set();allTransactions().forEach(t=>cats.add(t.category));
    h+=`<div class="s-filters"><select onchange="S.searchCat=this.value;doSearch()"><option value="all">All categories</option>`;
    [...cats].sort().forEach(c=>h+=`<option value="${esc(c)}" ${S.searchCat===c?'selected':''}>${esc(c)}</option>`);
    h+=`</select><select onchange="S.searchRange=this.value;doSearch()">`;
    [{v:"1",l:"1 month"},{v:"3",l:"3 months"},{v:"6",l:"6 months"},{v:"12",l:"1 year"},{v:"all",l:"All time"}].forEach(o=>h+=`<option value="${o.v}" ${S.searchRange===o.v?'selected':''}>${o.l}</option>`);
    h+=`</select></div><div id="search-results"></div></div>`;
  }

  else if(S.view==="settings"){
    h+=`<div class="cnt" style="padding-top:8px">`;
    // Net worth
    const nw=S.data.networth?.accounts||[];
    let totalNW=0;
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Net worth</span><span class="sh-v"></span></div>`;
    nw.forEach((a,ai)=>{
      const bal=getNWBalance(a,S.month);
      totalNW+=a.type==="asset"?bal:-bal;
      h+=`<div class="nw-card"><div class="nw-h"><div><div style="font-size:12px;font-weight:600">${esc(a.label)}</div><div class="nw-t">${a.type==="asset"?"Asset":"Debt"}</div></div><span class="nw-v" style="color:${a.type==='debt'?'var(--rd)':'var(--gn)'}" onclick="openNWBalanceModal(${ai})">${fmt(bal)}</span></div></div>`;
    });
    if(nw.length)h+=`<div style="text-align:right;font-size:14px;font-weight:700;padding:5px 0;color:${totalNW>=0?'var(--gn)':'var(--rd)'}">Net worth: ${fmt(totalNW)}</div>`;
    else h+=`<div style="padding:10px 0;font-size:12px;color:var(--t3)">No accounts yet.</div>`;
    h+=`</div>`;

    // Year summary - use viewed month's year
    const viewYr=S.month.substring(0,4);
    const yrMonths=Object.keys(S.data.months||{}).filter(m=>m.startsWith(viewYr));
    if(yrMonths.length){
      let yrI=0,yrE=0;
      yrMonths.forEach(m=>{const d2=S.data.months[m];yrI+=d2.income.reduce((s,x)=>s+txTotal(x),0);yrE+=d2.categories.reduce((s,c)=>s+c.items.reduce((ss,x)=>ss+txTotal(x),0),0)});
      h+=`<div class="sec"><div class="sh"><span class="sh-t">${viewYr} Summary</span><span class="sh-v"></span></div>
        <div style="padding:5px 0;font-size:12px;color:var(--t2);line-height:1.8">
        Income: <b style="color:var(--gn)">${fmt(yrI)}</b> · Spent: <b>${fmt(yrE)}</b> · Saved: <b style="color:${yrI-yrE>=0?'var(--gn)':'var(--rd)'}">${fmt(yrI-yrE)}</b><br>
        Months: ${yrMonths.length} · Goals completed: ${(S.data.goals?.completed||[]).filter(g=>new Date(g.completed).getFullYear()==parseInt(viewYr)).length}
        </div></div>`;
    }

    // Data
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Data</span><span class="sh-v"></span></div>
      <div style="padding:5px 0;display:flex;flex-direction:column;gap:5px">
        <button class="add" onclick="exportData()">Export backup (JSON)</button>
        <button class="add" onclick="importData()">Import backup</button>
      </div></div>`;
    const syncCode=localStorage.getItem("bt-sync")||"";
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Sync</span><span class="sh-v">${db?'Cloud ☁️':'Local 📱'}</span></div>
      <div style="padding:8px 0">
        <div style="font-size:12px;color:var(--t2);margin-bottom:6px">Enter this code on another device to connect:</div>
        <div style="font-size:18px;font-weight:700;letter-spacing:3px;padding:12px;background:var(--c1);border-radius:10px;text-align:center;font-family:monospace;user-select:all;-webkit-user-select:all;box-shadow:var(--sh)">${syncCode}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:6px">Keep this private. Anyone with this code can access your budget.</div>
      </div>
      <div style="margin-bottom:8px">${localStorage.getItem('bt-user')?'<div style="font-size:12px;color:var(--t2);margin-bottom:2px">Logged in as</div><div style="font-size:15px;font-weight:600;margin-bottom:8px">'+esc(localStorage.getItem('bt-user'))+'</div>':''}
      <div style="font-size:12px;color:var(--t2);margin-bottom:2px">Recovery code — screenshot this</div></div>
      <button class="add" style="color:var(--rd);border-color:var(--rd)" onclick="customConfirm('Log out? You will need your sync code to reconnect.',()=>{localStorage.removeItem('bt-sync');location.reload()})">Log out</button>
      <button class="add" style="color:var(--rd);border-color:var(--rd);margin-top:4px" onclick="customConfirm('Start over? This will erase ALL your data and reset the app. This cannot be undone.',()=>{localStorage.clear();location.reload()})">Start over</button>
    </div></div>`;
  }

  // FAB
  if(S.view==='budget'&&!S.edit&&S.budgetView!=='dash'){h+=`<button class="mic-fab" onclick="startVoice()">🎤</button>`;h+=`<button class="fab" onclick="openQuickAdd()">+</button>`}

  // Tab bar
  h+=`<div class="tab-bar">`;
  [{v:"budget",l:"Budget",d:"M3 3h18v18H3zM3 9h18M9 3v18"},{v:"cards",l:"Cards",d:"M2 7h20v12H2zM2 7V5h20v2M6 11h4"},{v:"group",l:"Group",d:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"},{v:"goals",l:"Goals",d:"M12 3a9 9 0 110 18 9 9 0 010-18zM12 7a5 5 0 110 10 5 5 0 010-10z"},{v:"trends",l:"Trends",d:"M3 20V4M7 20V10M11 20V7M15 20V12M19 20V5"},{v:"settings",l:"More",d:"M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M3 12h2M19 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 8a4 4 0 100 8 4 4 0 000-8z"}].forEach(t=>{
    h+=`<button class="tab ${S.view===t.v?'active':''}" onclick="S.view='${t.v}';if('${t.v}'!=='budget')S.budgetView='dash';S.edit=false;render()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${t.d}"/></svg>${t.l}</button>`;
  });
  h+=`</div>`;

  // Modal
  if(S.modal)h+=renderModal();

  document.getElementById("app").innerHTML=h;
  if(S.view==="trends")setTimeout(renderChart,10);
  if(S.view==="settings")setTimeout(doSearch,10);
}
// ===== SECTION RENDERER =====
function renderSection(items,title,catId,em,isIncome){
  const total=items.reduce((s,x)=>s+txTotal(x),0);
  const budget=items.reduce((s,x)=>s+x.budgeted,0);
  const ov=total>budget;
  const secKey="sec-"+(catId||"income");
  // Default: collapse sections where all items are recurring and not in edit mode
  if(S.collapsed===undefined)S.collapsed={};
  const allRecurring=items.every(i=>i.recurring);
  const isOpen=S.collapsed[secKey]!==undefined?!S.collapsed[secKey]:(em||!allRecurring);
  let h=`<div class="sec">`;
  // Header - clickable to toggle
  h+=`<div class="sh" onclick="${em?'':'toggleSection(\''+secKey+'\')'}"><div style="display:flex;align-items:center;gap:3px">`;
  if(!em)h+=`<span class="sh-arrow ${isOpen?'open':''}">▸</span>`;
  if(em&&!isIncome)h+=`<button class="xb" onclick="event.stopPropagation();removeCategory('${catId}')">×</button>`;
  if(em&&!isIncome)h+=`<span class="cat-emoji" style="cursor:pointer" onclick="event.stopPropagation();openEmojiPicker('${catId}')">${getCatEmoji(title)}</span><span class="sh-t" style="cursor:pointer" onclick="event.stopPropagation();renameCatUI(this,'${catId}')">${esc(title)}</span>`;
  else h+=`<span class="sh-t">${isIncome?"💰 ":"<span class=\"cat-emoji\">"+getCatEmoji(title)+"</span> "}${esc(title)}</span>`;
  h+=`</div><span class="sh-v" style="color:${ov&&!isIncome?'var(--rd)':''}">${fmt(total)} / ${fmt(budget)}</span></div>`;
  // Body - collapsible
  h+=`<div class="sec-body ${isOpen?'expanded':'collapsed'}">`;

  items.forEach(it=>{
    const tot=txTotal(it),p=pct(tot,it.budgeted),iov=tot>it.budgeted;
    const expKey=(catId||"inc")+"-"+it.id;
    const isExp=S.expanded[expKey];
    const txs=it.transactions||[];

    h+=`<div class="rw"><div class="rw-t"><div class="rw-l">`;
    if(em)h+=`<button class="xb" onclick="removeItemFromFuture('${it.id}',${catId?`'${catId}'`:'null'})">×</button>`;
    h+=`<span>${esc(it.label)}</span>`;
    if(it.recurring)h+=`<span class="rec-badge">↻</span>`;
    h+=`</div><div class="rw-n">`;

    // Amount display - all items are tappable now (fix bug 12)
    if(it.recurring&&!em){
      h+=`<span class="act" onclick="openTxModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">${fmt(tot)}</span>`;
    } else {
      h+=`<span class="act ${tot===0?'z':''}" style="${iov&&!isIncome?'color:var(--rd)':''}" onclick="openTxModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">${tot===0?(isIncome?"+log":"+add"):fmt(tot)}</span>`;
    }

    if(em){
      h+=`<span class="bud" onclick="openEditItemModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">✎ ${fmt(it.budgeted)}</span>`;
    } else {
      h+=`<span class="bud">/ ${fmt(it.budgeted)}</span>`;
    }
    h+=`</div></div>`;
    h+=`<div class="bar"><div class="bar-f" style="width:${p}%;background:${bCol(p,iov,isIncome)}"></div></div>`;
    if(it.note&&!em)h+=`<div class="note-text">${esc(it.note)}</div>`;

    // Transaction log
    const manualTxs=txs.filter(t=>!t.auto);
    if(manualTxs.length>0||txs.length>1){
      const showTxs=it.recurring?txs:manualTxs;
      if(showTxs.length>0){
        h+=`<span class="tx-toggle" onclick="S.expanded['${expKey}']=!S.expanded['${expKey}'];render()">${isExp?'▾ Hide':'▸ '+showTxs.length+' entr'+(showTxs.length!==1?'ies':'y')}</span>`;
        if(isExp){
          h+=`<div class="txlog">`;
          showTxs.forEach(tx=>{
            h+=`<div class="txlog-i"><div class="meta"><span class="dt">${tx.date||""}</span><span class="nt">${esc(tx.note||"")}</span>`;
            if(tx.tags?.length)tx.tags.forEach(tg=>h+=`<span class="tg">${esc(tg)}</span>`);
            h+=`</div><span class="amt">${fmt(tx.amount)}</span>`;
            if(!tx.auto)h+=`<button class="xb" onclick="removeTxById('${it.id}',${catId?`'${catId}'`:'null'},'${tx.id}')" style="font-size:14px">×</button>`;
            h+=`</div>`;
          });
          h+=`</div>`;
        }
      }
    }
    h+=`</div>`;
  });

  if(em){
    if(isIncome)h+=`<button class="add" onclick="addItemToAll(null,{id:uid()})">+ Add income</button>`;
    else h+=`<button class="add" onclick="addItemToAll('${catId}',{id:uid()})">+ Add item</button>`;
  }
  h+=`</div></div>`;
  return h;
}

  if(m.type==="addtx"){
    h+=`<h3>${esc(m.label)}</h3>`;
    if(m.currentTotal>0)h+=`<div style="font-size:12px;color:var(--t2);margin-bottom:6px">Current total: ${fmt(m.currentTotal)}</div>`;
    h+=`<label>Amount</label><input id="m-inp" type="number" inputmode="decimal" placeholder="0" onkeydown="if(event.key==='Enter')saveTx()">
      <label>What's it for?</label><input id="m-note" maxlength="100" placeholder="e.g. Uber Eats, dinner with friends">
      <label>Tags (comma separated, optional)</label><input id="m-tags" maxlength="100" placeholder="e.g. impulse, work lunch">

function openTxModal(itemId,catId,isIncome){
  const md=cm(),item=getItemFromMonth(md,itemId,catId);
  if(!item)return;
  S.modal={type:"addtx",label:item.label,itemId,catId,isIncome,currentTotal:txTotal(item)};
  render();setTimeout(()=>{const i=document.getElementById("m-inp");if(i){i.focus();i.select()}},60);
}

function saveTx(){
  const m=S.modal,md=cm();
  const amt=parseFloat(document.getElementById("m-inp").value)||0;
  if(amt===0){closeModal();return}
  const note=document.getElementById("m-note").value.trim();
  const tagsRaw=document.getElementById("m-tags").value.trim();
  const tags=tagsRaw?tagsRaw.split(",").map(t=>t.trim()).filter(Boolean):[];
  const d=new Date();
  const tx={id:uid(),date:(d.getMonth()+1)+"/"+d.getDate(),amount:amt,note,tags,auto:false};
  const item=getItemFromMonth(md,m.itemId,m.catId);
  if(!item)return;
  if(!item.transactions)item.transactions=[];
  item.transactions.push(tx);
  S.data.streakDate=new Date().toISOString().split('T')[0];
  save();closeModal();
}

function removeTxById(itemId,catId,txId){
  const md=cm(),item=getItemFromMonth(md,itemId,catId);
  if(!item||!item.transactions)return;
  item.transactions=item.transactions.filter(t=>t.id!==txId);
  save();render();
}

function clearItemTxs(itemId,catId){
  const md=cm(),item=getItemFromMonth(md,itemId,catId);
  if(!item)return;
  item.transactions=item.recurring?item.transactions.filter(t=>t.auto):[];
  save();closeModal();
}

function openEditItemModal(itemId,catId,isIncome){
  const md=cm(),item=getItemFromMonth(md,itemId,catId);
  if(!item)return;
  S.modal={type:"edititem",itemId,catId,isIncome,label:item.label,amount:item.budgeted,note:item.note,recurring:item.recurring};
  render();
}

function saveItemEdit(){
  const m=S.modal;
  const label=document.getElementById("m-label").value.trim()||"Item";
  const amt=parseFloat(document.getElementById("m-amt").value)||0;
  const note=document.getElementById("m-note").value.trim();

function resetMonth(){

function saveNewGoal(){
  const label=document.getElementById("m-label").value.trim()||"Goal";
  const gtype=document.getElementById("m-gtype").value;

  const monthly=parseFloat(document.getElementById("m-monthly").value)||200;
