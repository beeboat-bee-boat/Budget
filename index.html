<style>
/* ═══ DESIGN SYSTEM ═══ */
:root{
  --bg:#1a1a2e;--c1:#16213e;--c2:#1a1a3e;--bd:rgba(255,255,255,.06);
  --tx:#e8e8ef;--t2:#8b8ba3;--t3:#5c5c73;
  --ac:#6c63ff;--gn:#2ed573;--rd:#ff6b6b;--or:#ffa502;
  --radius:14px;--radius-sm:10px;
  --sh:0 2px 12px rgba(0,0,0,.2);--sh-lg:0 8px 30px rgba(0,0,0,.3);
  --font:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)!important;color:var(--tx);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px));min-height:100vh}

/* ═══ TYPOGRAPHY ═══ */
h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
h2{font-size:24px;font-weight:800;letter-spacing:-.3px}
h3{font-size:18px;font-weight:700;letter-spacing:-.2px;margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 6px}

/* ═══ LAYOUT ═══ */
.cnt{padding:0 16px;padding-top:4px}
.top{position:sticky;top:0;background:var(--bg);z-index:20;padding:12px 16px 8px;border-bottom:1px solid var(--bd)}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:0}
.hdr h1{cursor:pointer}
.hdr .tb{display:flex;gap:6px;align-items:center}
.hdr .tb button{background:rgba(108,99,255,.08)!important;color:var(--ac)!important;border:1px solid rgba(108,99,255,.2)!important;padding:8px 12px!important;border-radius:8px!important;font-size:12px!important;font-weight:600;font-family:var(--font);cursor:pointer;white-space:nowrap}
.hdr .tb button.on{background:var(--ac);color:white;border-color:var(--ac)}
.mnav{display:flex;justify-content:center;align-items:center;gap:16px;padding:6px 0 2px;font-size:14px;font-weight:600}
.mnav button{background:none;border:none;color:var(--t3);font-size:18px;padding:8px;cursor:pointer;border-radius:8px}
.mnav button:active{background:rgba(255,255,255,.05)}

/* ═══ CARDS ═══ */
.dash-card{background:var(--c1);border-radius:var(--radius);padding:16px 18px;margin:8px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:transform .1s,box-shadow .1s;box-shadow:var(--sh);border:1px solid var(--bd)}
.dash-card:active{transform:scale(.98);box-shadow:var(--sh-lg)}
.dc-l{display:flex;align-items:center;gap:14px}
.dc-icon{font-size:24px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(108,99,255,.08);border-radius:12px}
.dc-label{font-size:14px;color:var(--t2);font-weight:500}
.dc-amt{font-size:22px;font-weight:800;letter-spacing:-.5px}
.dc-arrow{color:var(--t3);font-size:18px}

/* ═══ INSIGHT CARDS ═══ */
.insight{background:var(--c1);border-radius:var(--radius);padding:14px 16px;margin:6px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--bd);box-shadow:var(--sh);cursor:pointer}
.insight:active{transform:scale(.98)}
.ins-icon{font-size:20px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(108,99,255,.08);border-radius:10px;flex-shrink:0}
.ins-body{flex:1;min-width:0}
.ins-title{font-size:14px;font-weight:600}
.ins-sub{font-size:13px;color:var(--t2);margin-top:2px}

/* ═══ SECTIONS ═══ */
.sec{background:var(--c1);border-radius:var(--radius);margin:8px 16px;border:1px solid var(--bd);box-shadow:var(--sh);overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;user-select:none;touch-action:manipulation}
.sh:active{background:rgba(255,255,255,.02)}
.sh-t{font-size:15px;font-weight:600}
.sh-v{font-size:14px;color:var(--t2);font-weight:500}

/* ═══ BUDGET ROWS ═══ */
.rw{padding:12px 16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.rw-h{display:flex;justify-content:space-between;align-items:center}
.rw-n{display:flex;align-items:baseline;gap:6px}
.bud{font-size:13px;color:var(--t3);cursor:pointer;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.03)}
.bud:active{background:rgba(108,99,255,.1)}
.act{font-size:15px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:6px}
.act:active{background:rgba(255,255,255,.05)}
.rec-badge{font-size:11px;color:var(--t3);margin-left:4px}

/* ═══ BUTTONS ═══ */
button{font-family:var(--font);touch-action:manipulation;min-height:44px;cursor:pointer;background:none;color:var(--tx);border:none;-webkit-appearance:none;appearance:none}
.add{width:100%;padding:14px;margin:3px 0;background:transparent!important;border:1.5px dashed var(--bd)!important;color:var(--t2)!important;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:var(--font);transition:all .15s}
.add:active{background:rgba(108,99,255,.08);border-color:var(--ac);color:var(--ac)}
.xb{background:none;border:none;color:var(--t3);font-size:16px;min-width:40px;min-height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer}
.xb:active{background:rgba(255,255,255,.05)}

/* ═══ TAB BAR ═══ */
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c1);border-top:1px solid var(--bd);padding:8px 0 4px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--t3);font-size:10px;font-weight:500;font-family:var(--font);padding:4px 0;touch-action:manipulation;cursor:pointer;transition:color .15s}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--ac)}
.tab.active svg{stroke:var(--ac)}

/* ═══ MODAL ═══ */
.modal-overlay,.mbg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-card,.mdl{background:var(--bg);color:var(--tx);border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;max-height:85vh;overflow-y:auto;box-shadow:var(--sh-lg)}
.mdl.fresh{animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.mbs{display:flex;gap:10px;margin-top:24px}
.cn{flex:1;padding:14px!important;background:rgba(255,255,255,.05)!important;color:var(--tx)!important;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:var(--font)}
.sv{flex:1;padding:14px!important;background:var(--ac)!important;color:white!important;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:var(--font)}
.dg{flex:1;padding:14px!important;background:var(--rd)!important;color:white!important;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:var(--font)}

/* ═══ INPUTS ═══ */
input[type="text"],input[type="number"],input[type="password"],input[type="date"],input[type="email"],textarea,.ob-input{width:100%;padding:14px 16px;border:1.5px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);border-radius:var(--radius-sm);font-size:15px;font-family:var(--font);outline:none;transition:border-color .15s;box-sizing:border-box}
input:focus,.ob-input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(108,99,255,.15)}
textarea{resize:vertical;min-height:80px}
select{padding:12px 16px;border:1.5px solid var(--bd);background:var(--c1)!important;color:var(--tx)!important;border-radius:var(--radius-sm);font-size:14px;font-family:var(--font);outline:none;-webkit-appearance:none;appearance:none}
input,textarea,select{background:var(--c1)!important;color:var(--tx)!important;border:1.5px solid var(--bd)!important;padding:14px 16px!important;border-radius:10px!important;font-size:15px!important;font-family:var(--font)!important;width:100%;box-sizing:border-box}
input::placeholder,textarea::placeholder{color:var(--t3)!important}
input[type="date"]{color-scheme:dark}
input[type="number"]{-moz-appearance:textfield}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
option{background:var(--c1);color:var(--tx)}

/* ═══ CHIPS ═══ */
.qa-type{display:flex;gap:4px;margin-bottom:16px}
.qa-type button{flex:1;padding:12px 8px;background:rgba(255,255,255,.03);border:1.5px solid var(--bd);color:var(--t2);border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:var(--font);touch-action:manipulation}
.qa-type button.on{background:rgba(108,99,255,.12);border-color:var(--ac);color:var(--ac)}
.qa-cats{display:flex;flex-wrap:wrap;gap:8px}
.qa-cat{padding:10px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);font-size:13px;font-weight:500;font-family:var(--font);touch-action:manipulation;cursor:pointer;transition:all .1s}
.qa-cat.on{background:rgba(108,99,255,.12);border-color:var(--ac);color:var(--ac)}
.qa-cat:active{transform:scale(.96)}
.qa-items{display:flex;flex-wrap:wrap;gap:8px}
.qa-item{padding:10px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);font-size:13px;font-weight:500;font-family:var(--font);touch-action:manipulation;cursor:pointer}
.qa-item.on{background:rgba(108,99,255,.12);border-color:var(--ac);color:var(--ac)}

/* ═══ ONBOARDING ═══ */
.ob-top{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px;min-height:80vh;justify-content:center}
.ob-step{font-size:13px;color:var(--t2);margin-bottom:8px;font-weight:500}
.ob-btn{padding:16px 32px!important;border-radius:var(--radius)!important;background:var(--ac)!important;color:white!important;border:none!important;font-size:16px;font-weight:700;font-family:var(--font);cursor:pointer;min-width:200px;transition:transform .1s;touch-action:manipulation}
.ob-btn:active{transform:scale(.96)}
.ob-btn.sec{background:rgba(255,255,255,.05)!important;color:var(--tx)!important;border:1.5px solid var(--bd)!important}
.ob-skip{background:none;border:none;color:var(--t2);font-size:13px;font-weight:500;font-family:var(--font);padding:12px;cursor:pointer;touch-action:manipulation}
.ob-chip{display:flex;align-items:center;gap:8px;padding:14px 20px;border-radius:var(--radius-sm);border:1.5px solid var(--bd);background:rgba(255,255,255,.03);color:var(--tx);font-size:14px;font-weight:500;font-family:var(--font);cursor:pointer;touch-action:manipulation;transition:all .1s}
.ob-chip.on{background:rgba(108,99,255,.12);border-color:var(--ac);color:var(--ac)}

/* ═══ PROGRESS BARS ═══ */
.prog{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}

/* ═══ CARDS TAB ═══ */
.card-stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px}
.cs-label{color:var(--t2);font-weight:500}
.cs-val{font-weight:600}

/* ═══ CHECKBOX BUTTONS ═══ */
.ob-check{width:32px!important;height:32px!important;min-width:32px!important;min-height:32px!important;max-width:32px!important;max-height:32px!important;padding:0!important;border-radius:8px;border:1.5px solid var(--bd);background:rgba(255,255,255,.03);color:white;font-size:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ob-check.on{background:var(--ac);border-color:var(--ac)}

/* ═══ CHART PICKER ═══ */
.chart-pick{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.chart-pick button{padding:8px 14px;border-radius:8px;border:1.5px solid var(--bd);background:rgba(255,255,255,.03);color:var(--t2);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;touch-action:manipulation}
.chart-pick button.on{background:rgba(108,99,255,.15);border-color:var(--ac);color:var(--ac)}
.chart-wrap{background:var(--c1);border-radius:var(--radius);padding:16px;border:1px solid var(--bd);margin-bottom:12px}

/* ═══ HELP ═══ */
.info-label{border-bottom:1px dotted var(--t3);cursor:pointer;touch-action:manipulation}.info-label:active{color:var(--ac);border-color:var(--ac)}

/* ═══ TRANSACTION LOG ═══ */
.txlog-i{padding:10px 16px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.txlog-i .xb{min-width:40px;min-height:40px;padding:6px;font-size:16px;display:flex;align-items:center;justify-content:center}

/* ═══ SEARCH ═══ */
.s-bar{margin:0 16px 12px}
.s-bar input{width:100%;padding:12px 16px;border-radius:var(--radius);background:var(--c1);border:1px solid var(--bd);color:var(--tx);font-size:14px;font-family:var(--font);outline:none}
.s-bar input:focus{border-color:var(--ac)}

/* ═══ VIEW TRANSITIONS ═══ */
.view-enter{animation:fadeIn .2s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
</style>
</head>

<div id="safe-top" style="height:env(safe-area-inset-top,0px);min-height:0;background:var(--bg,#1a1a2e);position:sticky;top:0;z-index:100"></div><div id="app"></div>
<script>
// ===== CONFIG =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCGmTihM2ZpqYxdComWxxkW33O2GjZNVis",
  authDomain: "budget-app-dba33.firebaseapp.com",
  databaseURL: "https://budget-app-dba33-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "budget-app-dba33",
  storageBucket: "budget-app-dba33.firebasestorage.app",
  messagingSenderId: "976872547157",
  appId: "1:976872547157:web:6c82cfb9209329f20b85dc",
  measurementId: "G-8JPBZ1Y44G"
};

// ===== UTILS =====
var DEBT_KEYWORDS=["mortgage","car payment","car loan","student loan","personal loan","loan","debt"];
function isDebtItem(label){return DEBT_KEYWORDS.some(function(kw){return label.toLowerCase().indexOf(kw)!==-1})}
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function round2(n){return Math.round((n||0)*100)/100}
const fmt=n=>{if(n===undefined||n===null)n=0;n=round2(n);var neg=n<0;n=Math.abs(n);var s=n>=1000?n.toLocaleString("en-US",{maximumFractionDigits:0}):n%1===0?String(n):n.toFixed(2);return(neg?"-":"")+"$"+s};
function clampDay(day,month,year){if(!day||day<=0)return day;const y=year||new Date().getFullYear();const m2=month!==undefined?month:new Date().getMonth();return Math.min(day,new Date(y,m2+1,0).getDate())}
let _u=Date.now();const uid=()=>"x"+(_u++);
const mk=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const monthLabel=(m)=>{const d=new Date(m+"-15");return MO[d.getMonth()]+" "+d.getFullYear()};
async function sha(s){const e=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function pct(v,mx){return mx>0?Math.min((v/mx)*100,100):0}
function bCol(p,ov,rev){if(rev)return p<50?"var(--or)":p<80?"var(--yl)":"var(--gn)";return ov?"var(--rd)":p>85?"var(--yl)":"var(--gn)"}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

// ===== EMOJI MAP =====
const EMOJI_MAP={"Rent":"🏠","Rent / Housing":"🏠","Housing":"🏠","Food":"🍕","Food & Groceries":"🍕","Groceries":"🛒","Cats":"🐱","Pets":"🐾","Transport":"🚇","Going Out":"🍻","Savings":"💰","Shopping":"🛍️","Subscriptions":"📱","Health":"💊","Utilities":"⚡","Loans":"💳","Fun":"🎮","Entertainment":"🎬","Insurance":"🛡️","Misc":"📦","Splurges":"🛑","Unnecessary":"🛑"};
function getCatEmoji(name){return S.data.catEmojis?.[name]||EMOJI_MAP[name]||"📁"}

// ===== ID-BASED LOOKUPS =====
function findById(arr,id){return arr.find(x=>x.id===id)}
function findIdxById(arr,id){return arr.findIndex(x=>x.id===id)}

// ===== DEFAULT DATA =====
const DEF={
  template:{income:[],categories:[]},
  months:{},
  goals:{active:[],completed:[]},
  debts:{cards:[],strategy:"avalanche"},
  networth:{accounts:[]},
  monthlyNotes:{},
  quickButtons:[],
  userName:"",
  groups:[],
};

// ===== STATE =====
let db=null,dbRef=null;
var _modalScroll=0;var _dismissedAlerts={};
let S={phase:"pin",_navHistory:[],pin:"",data:null,month:mk(),view:"budget",budgetView:"dash",edit:false,modal:null,err:"",expanded:{},chartType:"spending",searchQ:"",searchCat:"all",searchRange:"3",activeGroup:-1,payoffTarget:12};

// ===== FIREBASE =====
function hasFC(){return FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL}
let auth=null;
function initFB(){if(!hasFC()){console.error("No Firebase config");return false}try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();auth=firebase.auth();return true}catch(e){console.error("Firebase init failed:",e);return false}}

async function connect(pin){
  var h=await sha(pin);  if(db){
    try{
      dbRef=db.ref("budgets/"+h);
      var snap=await dbRef.once("value");
      S.data=snap.exists()?snap.val():JSON.parse(JSON.stringify(DEF));
      if(!snap.exists()){
        await dbRef.set(S.data);
              }
      dbRef.on("value",function(s){if(s.exists()&&S.phase==="app"){S.data=s.val();ensureStructure();try{render()}catch(e){console.error("Sync render error:",e)}}});
    }catch(e){

function _doCleanGroupTxs(){

  Object.keys(S.data.months||{}).forEach(mk2=>{
    const md=S.data.months[mk2];if(!md)return;
    md.categories.forEach(cat=>{cat.items.forEach(item=>{

    })});

function archiveOldMonths(){
  const cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-12);
  const cutoffKey=mk(cutoff);
  if(!S.data.months)return;
  Object.keys(S.data.months).forEach(m=>{
    if(m>=cutoffKey)return; // keep recent
    if(!S.data._closed?.[m])return; // only archive closed months
    const md=S.data.months[m];
    if(md._archived)return; // already archived
    // Calculate summaries before stripping
    const mI=md.income.reduce((s,x)=>s+txTotal(x),0);
    const mE=md.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);
    // Strip individual transactions, keep budgeted amounts
    md.income.forEach(item=>{item.transactions=[];item._total=mI});
    md.categories.forEach(cat=>{cat.items.forEach(item=>{
      const itemTotal=txTotal(item);
      item.transactions=[];item._total=itemTotal;
    })});
    md._archived=true;
    md._summary={income:mI,expenses:mE,net:mI-mE};
  });
}

  if(!d.userName)d.userName="";
  if(!d.debts)d.debts={cards:[],strategy:"avalanche"};
  if(!d._sorted)d._sorted={};
  if(!d._sortedDetail)d._sortedDetail={};
  if(!d._closed)d._closed={};
  // Clean phantom future months
  const curMoClean=mk();
  if(d.months){Object.keys(d.months).forEach(m=>{if(m>curMoClean)delete d.months[m]})}
  if(!d.theme)d.theme='bee';
  if(!d._startMonth)d._startMonth=mk();

  if(!d.subscriptions)d.subscriptions=[];
  if(!d.debts.cards)d.debts.cards=[];
  d.debts.cards.forEach(cd=>{if(!cd.payments)cd.payments=[];if(!cd.id)cd.id=uid()});
  // Ensure all months have proper structure
  Object.keys(d.months||{}).forEach(mk2=>{
    const md2=d.months[mk2];if(!md2){delete d.months[mk2];return}
    if(!md2.categories)md2.categories=[];
    if(!md2.income)md2.income=[];
    md2.categories.forEach(cat=>{
      if(!cat.items)cat.items=[];
      cat.items.forEach(it=>{if(!it.transactions)it.transactions=[]});
    });
    md2.income.forEach(it=>{if(!it.transactions)it.transactions=[]});
  });
  // Ensure NW accounts have balances objects
  (d.networth?.accounts||[]).forEach(a=>{if(!a.balances)a.balances={};if(!a.id)a.id=uid()});
  // Template items must have ids
  (d.template?.categories||[]).forEach(c2=>{if(!c2.id)c2.id=uid();(c2.items||[]).forEach(i=>{if(!i.id)i.id=uid()})});
  (d.template?.income||[]).forEach(i=>{if(!i.id)i.id=uid()});
  // Nav history
  if(!S._navHistory)S._navHistory=[];
}

async function connectWithUid(uid,displayName){  try{
    dbRef=db.ref("budgets/"+uid);
    var snap=await dbRef.once("value");
    if(snap.exists()){
      var remoteData=snap.val();
      var localKey="bt-local-data";
      var localRaw=localStorage.getItem(localKey);
      if(localRaw){
        try{
          var localData=JSON.parse(localRaw);
          var remoteTime=remoteData._lastModified||0;
          var localTime=localData._lastModified||0;
          if(localTime>remoteTime){
            // Local is newer - push to Firebase
            S.data=localData;
            dbRef.set(localData);
          } else {
            S.data=remoteData;
          }
        }catch(e){S.data=remoteData}
      } else {
        S.data=remoteData;
      }
      // Check if this is effectively empty/default data (never onboarded)
      var tmpl=S.data.template||{};
      var hasSetup=(tmpl.income&&tmpl.income.length>0)||(tmpl.categories&&tmpl.categories.length>2);
      if(!hasSetup)S._isNewUser=true;
    } else {
      S.data=JSON.parse(JSON.stringify(DEF));
      S.data.userName=displayName||"";
      await dbRef.set(S.data);
      S._isNewUser=true;
    }
    ensureStructure();
    dbRef.on("value",function(s){if(s.exists()&&S.phase==="app"){S.data=s.val();ensureStructure();try{render()}catch(e){}}});
    archiveOldMonths();
    if(S.data.theme&&THEMES[S.data.theme])applyTheme(S.data.theme);
    S.phase="app";S.month=mk();
    if(S._isNewUser){delete S._isNewUser;S._showWalkthrough=true;S.phase="welcome";S.obStep=2;S.obName=displayName||"";S.obIncomeType=null;S.obIncomeAmts={};S.obCats=[];S.obFixed=[];S.obBudgets={};S.obBudgetsSeeded=false;S.obSavingsGoal=0;S.obCards=[];S.obAccounts=[]}
    render();
  }catch(e){
    console.error("Connect error:",e);
    toast("Connection error: "+e.message);
  }
}

function startOver(){
  // Stop ALL saves and listeners immediately
  clearTimeout(_saveTimer);
  if(dbRef){try{dbRef.off()}catch(e){}}
  dbRef=null;
  S.data=null;

  // Clear local storage FIRST so nothing can restore
  localStorage.clear();
  sessionStorage.clear();

  // Show wiping message
  try{document.getElementById('app').innerHTML='<div style="padding:60px 20px;text-align:center;font-family:sans-serif;color:#8b8ba3"><div style="font-size:24px;margin-bottom:12px">Clearing data...</div></div>'}catch(e){}

  // Delete Firebase data and sign out
  var uid2=S.firebaseUser?S.firebaseUser.uid:null;
  var step1=Promise.resolve();
  if(db&&uid2){
    step1=db.ref("budgets/"+uid2).set(null).catch(function(){});
  }
  step1.then(function(){
    if(auth)return auth.signOut();
  }).then(function(){
    // Double-check it's gone
    if(db&&uid2)return db.ref("budgets/"+uid2).set(null);
  }).then(function(){
    window.location.reload();
  }).catch(function(){
    window.location.reload();
  });
}

function forceSync(){
  if(!db){toast("No Firebase connection");return}
  if(!S.data){toast("No data to sync");return}
  var btn=event.target;btn.textContent="Syncing...";
  sha(S.pin).then(function(h){
    var ref=db.ref("budgets/"+h);
    // Push local → Firebase
    ref.set(S.data).then(function(){
      // Pull Firebase → local (to confirm)
      ref.once("value").then(function(snap){
        if(snap.exists()){
          S.data=snap.val();
          ensureStructure();
          localStorage.setItem("bt-"+h,JSON.stringify(S.data));
          render();
          toast("Synced ✓ — data pushed to cloud");
        } else {
          toast("Sync failed — data not found after push");
        }
        btn.textContent="Sync data now";
      });
    }).catch(function(e){
      toast("Sync error: "+e.message);
      btn.textContent="Sync data now";
    });
  });
}

// ===== MONTH GENERATION =====
function makeAutoTx(amount,note,month){
  const[yr,mo]=month.split("-");
  const cur=mk();
  const d2=month===cur?new Date():new Date(yr+"-"+mo+"-01T12:00:00");
  const isoDate=d2.toISOString().split("T")[0];
  const dateStr=(d2.getMonth()+1)+"/"+d2.getDate();
  return {id:uid(),date:dateStr,isoDate,amount,note:note||"Auto-filled",tags:[],auto:true};
}

function genMonth(m){
  const t=S.data.template,md={income:[],categories:[]};
  // Auto-log subscriptions into a Subscriptions category if it exists
  const subs=S.data.subscriptions||[];
  if(subs.length){
    let subCat=t.categories.find(c2=>c2.name==="Subscriptions");
    if(subCat){
      subs.forEach(sub=>{
        if(!subCat.items.find(i=>i.label===sub.name)){
          subCat.items.push({id:uid(),label:sub.name,amount:sub.amount,recurring:true,note:"Subscription"});
        }
      });
    }
  }
  t.income.forEach(i=>{
    const txs=i.recurring?[makeAutoTx(i.amount,i.note,m)]:[];
    md.income.push({id:i.id,label:i.label,budgeted:i.amount,recurring:!!i.recurring,note:i.note||"",transactions:txs});
  });
  t.categories.forEach(c=>{
    const cat={id:c.id,name:c.name,items:[]};
    c.items.forEach(i=>{
      // Recurring expenses start at $0 until confirmed paid
      const txs=i.recurring?[makeAutoTx(0,i.note||i.label,m)]:[];
      cat.items.push({id:i.id,label:i.label,budgeted:i.amount,recurring:!!i.recurring,note:i.note||"",transactions:txs});
    });
    md.categories.push(cat);
  });
  return md;
}

// ===== TEMPLATE UPDATES (ID-BASED) =====
function updateTemplateItem(itemId,catId,updates){
  // Find in template
  let tmpl;
  if(catId===null){tmpl=findById(S.data.template.income,itemId)}
  else{const cat=findById(S.data.template.categories,catId);if(cat)tmpl=findById(cat.items,itemId)}
  if(!tmpl)return;
  Object.assign(tmpl,updates);

  // Update current + all future months by ID
  Object.keys(S.data.months).forEach(mk2=>{
    if(mk2>=S.month){
      const md2=S.data.months[mk2];
      let target;
      if(catId===null){target=findById(md2.income,itemId)}
      else{const mCat=findById(md2.categories,catId);if(mCat)target=findById(mCat.items,itemId)}
      if(!target)return;

      if(updates.label!==undefined)target.label=updates.label;
      if(updates.note!==undefined)target.note=updates.note;
      if(updates.amount!==undefined)target.budgeted=updates.amount;
      if(updates.recurring!==undefined)target.recurring=updates.recurring;

      // Rebuild auto transaction
      const isRec=updates.recurring!==undefined?updates.recurring:target.recurring;
      const amt=updates.amount!==undefined?updates.amount:target.budgeted;
      target.transactions=target.transactions||[];
      if(isRec){
        const ai=target.transactions.findIndex(t=>t.auto);
        const atx=makeAutoTx(amt,target.note,mk2);
        if(ai>=0)target.transactions[ai]=atx;else target.transactions.unshift(atx);
      } else {
        target.transactions=target.transactions.filter(t=>!t.auto);
      }
    }
  });
  save();
}

// ===== TRANSACTION HELPERS =====
var _txCache=new WeakMap();
function txTotal(item){if(_txCache.has(item)){var cv=_txCache.get(item);if(cv.len===item.transactions.length)return cv.val}return(item.transactions||[]).reduce((s,t)=>s+(t.amount||0),0)}

function getItemFromMonth(md,itemId,catId){
  if(catId===null)return findById(md.income,itemId);
  const cat=findById(md.categories,catId);
  return cat?findById(cat.items,itemId):null;
}

function allTransactions(){
  const all=[];
  Object.entries(S.data.months||{}).forEach(([m,md])=>{
    md.income.forEach(i=>(i.transactions||[]).forEach(t=>all.push({...t,month:m,category:"Income",item:i.label,type:"income"})));
    md.categories.forEach(c=>c.items.forEach(i=>(i.transactions||[]).forEach(t=>all.push({...t,month:m,category:c.name,item:i.label,type:"expense"}))));
  });
  return all;
}

// ===== NET WORTH HELPERS =====
function getNWBalance(account,month){
  if(!account.balances)return 0;
  if(account.balances[month]!==undefined)return account.balances[month];
  // Walk backward to find most recent
  const months=Object.keys(account.balances).sort();
  let last=0;
  for(const m of months){if(m<=month)last=account.balances[m]}
  return last;
}

function finishToggleRecurring(itemId,catId,type){
  if(type==="balance"){
    // Show balance input
    const el=document.getElementById("bal-input");
    if(el)el.style.display="block";
    // Replace modal buttons
    const mbs=document.querySelector(".mbs");
    if(mbs)mbs.innerHTML='<button class="cn" onclick="closeModal()">Cancel</button><button class="sv" onclick="applyRecurringWithBalance(\''+itemId+'\',\''+catId+'\')">Set</button>';
    return;
  }
  // Ongoing - just set recurring
  const md=cm();let item=null;
  if(catId&&catId!=="null"){const cat=findById(md.categories,catId);if(cat)item=findById(cat.items,itemId)}
  if(!item)return;
  item.recurring=true;
  const tCat=findById(S.data.template.categories,catId);
  if(tCat){const ti=findById(tCat.items,itemId);if(ti)ti.recurring=true}
  if(!item.transactions.some(t=>t.auto)){
    const d2=new Date();item.transactions.unshift({id:uid(),date:(d2.getMonth()+1)+"/"+d2.getDate(),isoDate:d2.toISOString().split("T")[0],amount:0,note:item.label,tags:[],auto:true});
  }
  // Propagate to future months
  Object.keys(S.data.months||{}).forEach(mk2=>{if(mk2<=S.month)return;const fmd=S.data.months[mk2];if(!fmd)return;
    if(catId&&catId!=="null"){const fc=findById(fmd.categories,catId);if(fc){const fi=findById(fc.items,itemId);if(fi&&!fi.recurring){fi.recurring=true;fi.transactions.unshift({id:uid(),date:"1",isoDate:mk2+"-01",amount:0,note:fi.label,tags:[],auto:true})}}}});
  save();closeModal();toast(item.label+" set as recurring");
}

function applyRecurringWithBalance(itemId,catId){
  const bal=parseFloat(document.getElementById("sr-bal")?.value)||0;
  const apr=parseFloat(document.getElementById("sr-apr")?.value)||0;
  const md=cm();let item=null;
  if(catId&&catId!=="null"){const cat=findById(md.categories,catId);if(cat)item=findById(cat.items,itemId)}
  if(!item){closeModal();return}
  item.recurring=true;
  item._balance=bal;
  item._startBalance=bal;
  item._apr=apr;
  const tCat=findById(S.data.template.categories,catId);
  if(tCat){const ti=findById(tCat.items,itemId);if(ti){ti.recurring=true;ti._balance=bal;ti._startBalance=bal;ti._apr=apr}}
  if(!item.transactions.some(t=>t.auto)){
    const d2=new Date();item.transactions.unshift({id:uid(),date:(d2.getMonth()+1)+"/"+d2.getDate(),isoDate:d2.toISOString().split("T")[0],amount:0,note:item.label,tags:[],auto:true});
  }
  save();closeModal();toast(item.label+" set as recurring — "+fmt(bal)+" to pay off");
}

function toggleRecurring(itemId,catId){
  const md=cm();let item=null;
  if(catId){const cat=findById(md.categories,catId);if(cat)item=findById(cat.items,itemId)}
  else{item=findById(md.income,itemId)}
  if(!item)return;
  if(!item.recurring){
    // Turning ON recurring - ask if it has a balance
    S.modal={type:"setrecurring",itemId,catId};render();return;
  }
  item.recurring=!item.recurring;
  // Update template too
  const tCat=catId?findById(S.data.template.categories,catId):null;
  const tItem=tCat?findById(tCat.items,itemId):findById(S.data.template.income,itemId);
  if(tItem)tItem.recurring=item.recurring;
  if(item.recurring){
    // Add auto tx with $0 (unpaid)
    if(!item.transactions.some(t=>t.auto)){
      const[yr,mo]=S.month.split("-");
      const d2=S.month===mk()?new Date():new Date(yr+"-"+mo+"-01T12:00:00");
      item.transactions.unshift({id:uid(),date:(d2.getMonth()+1)+"/"+d2.getDate(),isoDate:d2.toISOString().split("T")[0],amount:0,note:item.label,tags:[],auto:true});
    }
    // Propagate to future months
    Object.keys(S.data.months||{}).forEach(mk2=>{
      if(mk2<=S.month)return;
      const fmd=S.data.months[mk2];if(!fmd)return;
      if(catId){const fc=findById(fmd.categories,catId);if(fc){const fi=findById(fc.items,itemId);if(fi&&!fi.recurring){fi.recurring=true;
        fi.transactions.unshift({id:uid(),date:"1",isoDate:mk2+"-01",amount:0,note:fi.label,tags:[],auto:true})}}}
    });
    toast(item.label+" set as recurring ↻ (future months synced)");
  } else {
    // Remove auto tx
    item.transactions=item.transactions.filter(t=>!t.auto);
    // Propagate to future months
    Object.keys(S.data.months||{}).forEach(mk2=>{
      if(mk2<=S.month)return;
      const fmd=S.data.months[mk2];if(!fmd)return;
      if(catId){const fc=findById(fmd.categories,catId);if(fc){const fi=findById(fc.items,itemId);if(fi){fi.recurring=false;fi.transactions=fi.transactions.filter(t=>!t.auto)}}}
    });
    toast(item.label+" set as one-time (future months synced)");
  }
  save();render();
}

function confirmPaid(itemId,catId){
  const md=cm();let item=null;
  if(catId){const cat=findById(md.categories,catId);if(cat)item=findById(cat.items,itemId)}
  else{item=findById(md.income,itemId)}
  if(!item||!item.recurring)return;
  const autoTx=item.transactions.find(t=>t.auto);
  if(!autoTx)return;
  if(autoTx.confirmed){
    // Toggle off - zero out the amount
    delete autoTx.confirmed;
    const prevAmt=autoTx.amount;
    autoTx.amount=0;
    // Reverse balance deduction
    if(item._balance!==undefined)item._balance+=prevAmt;
    // Reverse goal progress
    const matchGoal2=S.data.goals?.active?.find(g=>g.linkedItem===item.id||g.label===item.label);
    if(matchGoal2){
      if(matchGoal2.type==="payoff")matchGoal2.current=(item._balance!==undefined?item._balance:Math.min(matchGoal2.start||0,(matchGoal2.current||0)+prevAmt));
      else matchGoal2.current=Math.max(0,(matchGoal2.current||0)-prevAmt);
    }
    toast(item.label+" unmarked");
  } else {
    // Mark as paid
    autoTx.confirmed=true;
    autoTx.amount=item.budgeted;
    autoTx.isoDate=new Date().toISOString().split("T")[0];
    autoTx.date=(new Date().getMonth()+1)+"/"+new Date().getDate();
    // Accrue interest then deduct payment
    if(item._balance!==undefined&&item._balance>0){
      if(item._apr>0){const moInterest=item._balance*(item._apr/100/12);item._balance+=moInterest}
      item._balance=Math.max(0,item._balance-item.budgeted);
      if(item._balance<=0){toast("🎉 "+item.label+" fully paid off!");item.recurring=false;
        const tItem=catId?findById(findById(S.data.template.categories,catId)?.items||[],itemId):findById(S.data.template.income,itemId);
        if(tItem)tItem.recurring=false;
      } else {toast(item.label+" paid — "+fmt(item._balance)+" remaining")}
    }
    // Sync with linked goal
    const matchGoal=S.data.goals?.active?.find(g=>g.linkedItem===item.id||g.label===item.label);
    if(matchGoal){
      if(matchGoal.type==="payoff")matchGoal.current=item._balance!==undefined?item._balance:Math.max(0,(matchGoal.current||0)-item.budgeted);
      else matchGoal.current=(matchGoal.current||0)+item.budgeted;
    }
    if(!item._balance&&!matchGoal)toast(item.label+" paid — "+fmt(item.budgeted)+" ✓");
  }
  save();render();
}

  const dateVal=document.getElementById("et-date")?.value||"";

function saveEditBudget(){
  const amt=parseFloat(document.getElementById("eb-amt")?.value)||0;
  const m2=S.modal;const md=cm();
  let isRecurring=false;
  if(m2.isIncome){
    const item=findById(md.income,m2.itemId);if(item){item.budgeted=amt;isRecurring=item.recurring}
    const ti=findById(S.data.template.income,m2.itemId);if(ti)ti.amount=amt;
  } else {
    const cat=findById(md.categories,m2.catId);
    if(cat){const item=findById(cat.items,m2.itemId);if(item){item.budgeted=amt;isRecurring=item.recurring}}
    const tc=findById(S.data.template.categories,m2.catId);
    if(tc){const ti=findById(tc.items,m2.itemId);if(ti)ti.amount=amt}
  }
  // Propagate recurring changes to all future months
  if(isRecurring){
    Object.keys(S.data.months||{}).forEach(mk2=>{
      if(mk2<=S.month)return; // skip current and past
      const fmd=S.data.months[mk2];if(!fmd)return;
      if(m2.isIncome){
        const fi=findById(fmd.income,m2.itemId);
        if(fi){fi.budgeted=amt;const atx=fi.transactions.find(t=>t.auto);if(atx&&!atx.confirmed)atx.amount=0}
      } else {
        const fc=findById(fmd.categories,m2.catId);
        if(fc){const fi=findById(fc.items,m2.itemId);if(fi){fi.budgeted=amt;const atx=fi.transactions.find(t=>t.auto);if(atx&&!atx.confirmed)atx.amount=0}}
      }
    });
  }
  save();closeModal();toast(isRecurring?"Updated — future months synced":"Updated");
}

function doCloseMonth(){
  // Critical save
  const md5=cm();
  // Use txTotal - same as dashboard, counts actual transaction amounts
  const tI5=md5.income.reduce((s,x)=>s+txTotal(x),0);
  const savCats5=["Savings","Goals"];
  const tE5=md5.categories.filter(c2=>!savCats5.includes(c2.name)).reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);
  const net5=tI5-tE5;
  
  // Lock surplus into Unsorted
  if(net5>0&&S.data.networth?.accounts){
    const ua=S.data.networth.accounts.find(a=>a.label==="Unsorted");
    if(ua)ua.balances[S.month]=net5;
  }
  
  // Mark month as closed
  if(!S.data._closed)S.data._closed={};
  S.data._closed[S.month]={
    date:new Date().toLocaleDateString(),
    net:net5,
    income:tI5,
    expenses:tE5
  };
  
  // Also mark sorted so auto-surplus doesn't overwrite
  if(!S.data._sorted)S.data._sorted={};
  S.data._sorted[S.month]=true;
  
  saveNow();closeModal();toast("Month closed — net: "+fmt(net5));
}

function reopenMonth(){
  customConfirm("Reopen this month? Surplus and any sorted amounts will be reversed.",()=>{
    // Remove surplus from Unsorted
    if(S.data.networth?.accounts){
      const ua=S.data.networth.accounts.find(a=>a.label==="Unsorted");
      if(ua)delete ua.balances[S.month];
    }
    // Reverse any sorted amounts back from accounts
    const sortDetail=S.data._sortedDetail?.[S.month];
    if(sortDetail&&S.data.networth?.accounts){
      Object.entries(sortDetail).forEach(([acctId,amt])=>{
        const acct=S.data.networth.accounts.find(a=>a.id===acctId);
        if(acct){const cur=getNWBalance(acct,S.month);acct.balances[S.month]=Math.max(0,cur-amt)}
      });
      delete S.data._sortedDetail[S.month];
    }
    // Remove flags
    delete S.data._closed[S.month];
    if(!S.data._sorted)S.data._sorted={};
    S.data._sorted[S.month]=true;
    save();render();toast("Month reopened");
  });
}

function updateSortRemaining(){
  const m=S.modal;if(!m||m.type!=="sortfunds")return;
  const nw2=(S.data.networth?.accounts||[]).filter(a=>a.label!=="Unsorted");
  const totalAvail=m.remaining||0;
  let allocated=0;
  nw2.forEach((_,ai)=>{allocated+=parseFloat(m['_sort'+ai])||0});
  const left=totalAvail-allocated;
  const el=document.getElementById("sort-status");
  if(el){
    el.style.color=left<0?'var(--rd)':left===0?'var(--gn)':'var(--t2)';
    el.innerHTML=left<0?'Over by '+fmt(Math.abs(left)):left===0?'\u2713 Fully allocated':fmt(left)+' remaining';
  }
  // Disable Apply if over
  const btn=document.querySelector('.mbs .sv');
  if(btn){btn.style.opacity=left<0?'0.4':'1';btn.style.pointerEvents=left<0?'none':'auto'}
}

function applySortFunds(){
  const m=S.modal;
  // Validate total doesn't exceed available
  const nwCheck=(S.data.networth?.accounts||[]).filter(a=>a.label!=="Unsorted");
  let totalAlloc=0;nwCheck.forEach((_,ai)=>{totalAlloc+=parseFloat(m['_sort'+ai])||0});
  if(totalAlloc>(m.remaining||0)+1){toast("Total exceeds available surplus");return}if(!m)return;
  const nw2=(S.data.networth?.accounts||[]).filter(a=>a.label!=="Unsorted");
  let totalAllocated=0;
  nw2.forEach((a,ai)=>{
    const add=parseFloat(m['_sort'+ai])||0;
    if(add>0){
      const curBal=getNWBalance(a,S.month);
      a.balances[S.month]=curBal+add;
      totalAllocated+=add;
    }
  });
  // Reduce unsorted by allocated amount (from total across all months)
  const unsorted2=S.data.networth.accounts.find(a=>a.label==="Unsorted");
  if(unsorted2){
    let totalUnsorted=0;
    Object.values(unsorted2.balances||{}).forEach(v=>{totalUnsorted+=v||0});
    const remaining=Math.max(0,totalUnsorted-totalAllocated);
    // Clear all month balances and set remaining on current month
    Object.keys(unsorted2.balances).forEach(k=>{unsorted2.balances[k]=0});
    if(remaining>0)unsorted2.balances[S.month]=remaining;
  }
  // Track what was sorted for this month (so reopen can reverse it)
  if(!S.data._sortedDetail)S.data._sortedDetail={};
  if(!S.data._sortedDetail[S.month])S.data._sortedDetail[S.month]={};
  nw2.forEach((a,ai)=>{
    const add=parseFloat(m['_sort'+ai])||0;
    if(add>0)S.data._sortedDetail[S.month][a.id]=(S.data._sortedDetail[S.month][a.id]||0)+add;
  });
  if(!S.data._sorted)S.data._sorted={};
  S.data._sorted[S.month]=true;
  save();closeModal();toast("Sorted "+fmt(totalAllocated)+" into accounts");
}

function recommendBudget(basePay,selectedCats){
  // Budget off BASE pay only. Commissions/variable → savings/debt
  const recs={};
  const rules={
    "Rent / Housing":{pct:0.30,items:[{l:"Rent",p:0.85,r:true},{l:"Utilities",p:0.10,r:true},{l:"Insurance",p:0.05,r:true}]},
    "Food & Groceries":{pct:0.12,items:[{l:"Groceries",p:0.55,r:false},{l:"Eating out",p:0.30,r:false},{l:"Coffee",p:0.10,r:false},{l:"Delivery",p:0.05,r:false}]},
    "Transport":{pct:0.06,items:[{l:"Metro / Bus",p:0.60,r:true},{l:"Uber / Lyft",p:0.30,r:false},{l:"Gas",p:0.10,r:false}]},
    "Going Out":{pct:0.05,items:[{l:"Bars / Drinks",p:0.60,r:false},{l:"Events",p:0.40,r:false}]},
    "Savings":{pct:0.15,items:[{l:"Emergency fund",p:0.70,r:true},{l:"Investments",p:0.30,r:true}]},
    "Subscriptions":{pct:0.03,items:[{l:"Streaming",p:0.40,r:true},{l:"Software",p:0.30,r:true},{l:"Phone plan",p:0.30,r:true}]},
    "Shopping":{pct:0.04,items:[{l:"Clothes",p:0.60,r:false},{l:"Amazon",p:0.40,r:false}]},
    "Health":{pct:0.04,items:[{l:"Gym",p:0.50,r:true},{l:"Pharmacy",p:0.50,r:false}]},
    "Cats":{pct:0.03,items:[{l:"Cat food",p:0.50,r:false},{l:"Litter",p:0.30,r:false},{l:"Vet",p:0.20,r:false}]},
    "Pets":{pct:0.03,items:[{l:"Pet food",p:0.50,r:false},{l:"Vet",p:0.30,r:false},{l:"Supplies",p:0.20,r:false}]},
    "Utilities":{pct:0.05,items:[{l:"Electric",p:0.40,r:true},{l:"Internet",p:0.35,r:true},{l:"Phone",p:0.25,r:true}]},
  };
  selectedCats.forEach(cat=>{
    const rule=rules[cat];
    if(rule){
      const catTotal=Math.round(basePay*rule.pct/10)*10;
      recs[cat]=rule.items.map(it=>({label:it.l,amount:Math.round(catTotal*it.p/10)*10,recurring:it.r}));
    }
  });
  // Always add Misc and Splurges
  recs["Misc"]=[{label:"Uncategorized",amount:0,recurring:false}];
  recs["Splurges"]=[{label:"Unnecessary purchases",amount:0,recurring:false}];
  return recs;

  const ti=md.income.reduce((s,x)=>s+txTotal(x),0);
  const te=md.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+x.budgeted,0),0);
  showHelp('Available for debt','This is your budgeted income minus your non-debt expenses for this month.<br><br>Income: '+fmt(ti)+'<br>Expenses: '+fmt(te)+'<br>Available: '+fmt(Math.max(0,ti-te))+'<br><br>This is the maximum you could put toward credit card payments. If this shows $0, set up your income and expenses in the Budget tab first.');
}
function showAprHelp(){
  const cards=S.data.debts?.cards||[];
  const tb=cards.reduce((s,x)=>s+x.balance,0);
  const wa=tb>0?cards.reduce((s,x)=>s+x.apr*(x.balance/tb),0):0;
  showHelp('Avg interest rate','The average interest rate you are paying across all your cards. Cards with bigger balances count more in the average.<br><br>Your weighted APR: '+wa.toFixed(1)+'%');
}
function showUtilHelp(){
  const cards=S.data.debts?.cards||[];
  const tb=cards.reduce((s,x)=>s+x.balance,0);
  const tl=cards.reduce((s,x)=>s+(x.limit||0),0);
  showHelp('Credit utilization','This is how much of your credit you are using. Under 30% is good for your credit score, under 10% is great.<br><br>Your total balance is '+fmt(tb)+' across '+fmt(tl)+' in credit limits.');
}
function showInterestHelp(){
  const cards2=S.data.debts?.cards||[];
  let detail=cards2.map(cd=>{
    const mi=cd.balance*(cd.apr/100/12);
    return cd.name+': '+fmt(cd.balance)+' × '+cd.apr+'% ÷ 12 = <b>'+fmt(mi)+'</b>/mo';
  }).join('<br>');
  const total=cards2.reduce((s,cd)=>s+cd.balance*(cd.apr/100/12),0);
  showHelp('Monthly interest','Each card charges you interest every month based on what you owe:<br><br>How it works: Balance × (Interest rate ÷ 12)<br><br>'+detail+'<br><br>Total: <b>'+fmt(total)+'</b>/mo in interest charges');
  return;
}

function checkAndAlert(){
  var warnings=[];
  // Check negative account balances
  (S.data.networth?.accounts||[]).forEach(function(a){
    if(a.label==='Unsorted')return;
    var bal=getNWBalance(a,S.month);
    if(bal<0)warnings.push({msg:a.label+' is negative ('+fmt(bal)+')',fix:'Go to More > Net Worth to adjust the balance, or log a deposit to bring it positive.',tab:'settings'});
  });
  // Check if spending > income
  var md=getMonth(S.month);
  var tI=md.income.reduce(function(s,x){return s+txTotal(x)},0);
  var savCats=['Savings','Goals'];
  var tE=md.categories.filter(function(c2){return savCats.indexOf(c2.name)===-1}).reduce(function(s,c2){return s+c2.items.reduce(function(ss,x){return ss+txTotal(x)},0)},0);
  if(tE>tI&&tI>0)warnings.push({msg:'Spending exceeds income by '+fmt(tE-tI),fix:'Review your Money Out tab to find areas to cut back, or log additional income.',tab:'budget'});
  // Check card utilization
  (S.data.debts?.cards||[]).forEach(function(cd){
    if(cd.limit>0){
      var util=Math.round(cd.balance/cd.limit*100);
      var uThresh=S.data.alertUtilPct||30;if(util>uThresh)warnings.push({msg:cd.name+' is at '+util+'% utilization',fix:'High utilization hurts your credit score. Make a payment in the Cards tab.',tab:'cards'});
    }
    if(cd.balance<0)warnings.push({msg:cd.name+' has a negative balance ('+fmt(cd.balance)+')',fix:'This means you overpaid. Go to Cards to verify the balance.',tab:'cards'});
  });
  // Show toast for first warning
  if(warnings.length>0){
    var w=warnings[0];
    toastWithAction('⚠️ '+w.msg,'View',function(){switchTab('settings');S.expanded=S.expanded||{};S.expanded['s-alerts']=true;render()});
  }
}

function toastWithAction(msg,btnText,action){
  var el=document.createElement('div');
  el.style.cssText='position:fixed;bottom:100px;left:16px;right:16px;max-width:440px;margin:0 auto;background:var(--c1,#16213e);color:var(--tx,#e8e8ef);padding:14px 16px;border-radius:12px;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);animation:fadeIn .2s';
  el.innerHTML='<span style="font-size:13px;flex:1">'+msg+'</span><button style="background:var(--ac,#6c63ff);color:white;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;white-space:nowrap" onclick="this.parentElement.remove()">'+btnText+'</button>';
  el.querySelector('button').addEventListener('click',function(){el.remove();if(action)action()});
  document.body.appendChild(el);
  el.onclick=function(){el.remove()};setTimeout(function(){if(el.parentElement)el.remove()},8000);
}

function saveQuickAdd(){
  var m=S.modal;
  saveModalInputs();
  var inpEl=document.getElementById("m-inp");
  var amt=parseFloat(inpEl?inpEl.value:'')||parseFloat(m._amt)||0;
  if(amt===0){toast("Enter an amount");return}
  var noteEl=document.getElementById("m-note");
  var note=noteEl?noteEl.value.trim():(m._note||'');
  var tagsEl=document.getElementById("m-tags");
  var tagsRaw=tagsEl?tagsEl.value.trim():'';
  const tags=tagsRaw?tagsRaw.split(",").map(t=>t.trim()).filter(Boolean):[];
  const dateInput=document.getElementById('m-date')?.value;
  const d=dateInput?new Date(dateInput+'T12:00:00'):new Date();
  const dateStr=(d.getMonth()+1)+"/"+d.getDate();
  const isoDate=d.toISOString().split('T')[0];

  if(m.qaType==="payment"){
    if(!m.selItem){toast("Pick a card");return}
    var card=S.data.debts.cards.find(function(x){return x.id===m.selItem});
    if(!card){toast("Card not found");return}
    card.balance=Math.max(0,card.balance-amt);
    if(!card.payments)card.payments=[];
    card.payments.push({id:uid(),date:dateStr,isoDate:isoDate,amount:amt,note:note||"Payment",month:S.month,payFrom:m.payFrom||"other"});
    // Deduct from source account
    if(m.payFrom&&m.payFrom!=="none"&&m.payFrom!=="other"){
      var payAcct=(S.data.networth?.accounts||[]).find(function(a){return a.id===m.payFrom});
      if(payAcct){var cur=getNWBalance(payAcct,S.month);payAcct.balances[S.month]=cur-amt}
    }
    S.data.streakDate=new Date().toISOString().split('T')[0];
    save();closeModal();checkAndAlert();
    toast("Payment logged — "+card.name+" now "+fmt(card.balance));
    return;
  }

  const tx={id:uid(),date:dateStr,isoDate,amount:amt,note,tags,auto:false};
  const md=cm();
  let item=null;

  if(m.qaType==="income"){
    if(!m.selItem){toast("Pick an income source");return}
    item=findById(md.income,m.selItem);
  } else {
    if(!m.selCat||!m.selItem){toast("Pick a category and item");return}
    const cat=findById(md.categories,m.selCat);
    if(cat)item=findById(cat.items,m.selItem);
  }

  if(!item){toast("Item not found");return}
  if(!item.transactions)item.transactions=[];
  tx.paidWith=m.paidWith||"cash";
  item.transactions.push(tx);
  // If paid with credit card, increase card balance
  if(m.qaType==="expense"&&m.paidWith&&m.paidWith!=="cash"&&m.paidWith!=="debit"){
    var ecard=(S.data.debts?.cards||[]).find(function(cd){return cd.id===m.paidWith});
    if(ecard)ecard.balance+=amt;
  }
  // If paid with debit, deduct from bank account
  if(m.qaType==="expense"&&m.paidWith==="debit"&&m.debitAccount){
    var debitAcct=(S.data.networth?.accounts||[]).find(function(a){return a.id===m.debitAccount});
    if(debitAcct){var curD=getNWBalance(debitAcct,S.month);debitAcct.balances[S.month]=curD-amt}
  }
  S.data.streakDate=new Date().toISOString().split('T')[0];
  // Deposit income to account if selected
  if(m.qaType==="income"&&m.depositTo&&m.depositTo!=="none"&&m.depositTo!=="cash"){
    var depAcct2=(S.data.networth?.accounts||[]).find(function(a){return a.id===m.depositTo});
    if(depAcct2){var curI=getNWBalance(depAcct2,S.month);depAcct2.balances[S.month]=curI+amt}
  }
  save();closeModal();checkAndAlert();
}

function render(){

  const _scrollY=window.scrollY||window.pageYOffset||0;
  try{_render();window.scrollTo(0,_scrollY)}catch(e){console.error('Render error:',e);S.view='budget';S.budgetView='dash';S.modal=null;S.activeGroup=-1;S._addingMember=false;if(!S.expanded)S.expanded={};try{_render()}catch(e2){console.error('Fatal:',e2)}}
}
function _render(){
  if(S.phase==="pin"||S.phase==="welcome")return renderWelcome();
  connectGroups();
  const md=cm(),mL=monthLabel(S.month),em=S.edit;
  const tI=md.income.reduce((s,x)=>s+txTotal(x),0),tIB=md.income.reduce((s,x)=>s+x.budgeted,0);
  const savCats=["Savings","Goals"];
  const tE=md.categories.filter(c=>!savCats.includes(c.name)).reduce((s,c)=>s+c.items.reduce((ss,x)=>ss+txTotal(x),0),0);
  const tSaved=md.categories.filter(c=>savCats.includes(c.name)).reduce((s,c)=>s+c.items.reduce((ss,x)=>ss+txTotal(x),0),0);
  const tEB=md.categories.reduce((s,c)=>s+c.items.reduce((ss,x)=>ss+x.budgeted,0),0);
  const rem=tI-tE,surp=tIB-tEB;
  let h="";

  // Top bar
  // Header with back button
    const isHome=S.view==="budget"&&S.budgetView==="dash";
    // Quick add in header
    const qaBtn=S.phase==="app"?`<button style="background:var(--ac);color:white;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;font-family:var(--font);cursor:pointer" onclick="openQuickAdd()">+ Add</button>`:"";
    const viewNames={budget:acctTerm("Budget"),cards:acctTerm("Credit Cards"),group:"Group",goals:acctTerm("Goals"),trends:acctTerm("Trends"),settings:"More"};
    const subNames={in:acctTerm("Money In"),out:acctTerm("Money Out"),dash:""};
    const viewLabel=S.view==="budget"&&S.budgetView!=="dash"?subNames[S.budgetView]||"Budget":viewNames[S.view]||"BetterBudget";

    h+=`<div class="top"><div class="hdr">${isHome?'<h1>BetterBudget</h1>':`<h1 style="cursor:pointer" onclick="goBack()"><span style="color:var(--ac);margin-right:4px">‹</span>${esc(viewLabel)}</h1>`}<div class="tb">`;
  if(S.view==="budget"&&S.budgetView!=="dash")h+=`<button onclick="resetMonth()">Reset</button><button class="${em?'on':''}" onclick="S.edit=!S.edit;render()">${em?"Done":"Edit"}</button>`;
  h+=qaBtn;
  if(S.view==="cards")h+=`<button onclick="openDebtModal()">+ Card</button>`;
  if(S.view==="goals")h+=`<button onclick="openGoalModal()">+ Goal</button>`;

  h+=`</div></div><div class="mnav"><button onclick="nav(-1)">‹</button><span>${mL}</span><button onclick="nav(1)" style="${S.month>=mk()?"opacity:0.2;pointer-events:none":""}">›</button></div></div>`;

  if(S.view==="budget"){
    const md=cm();
    const tI=md.income.reduce((s,x)=>s+txTotal(x),0),tIB=md.income.reduce((s,x)=>s+x.budgeted,0);
    const tE=md.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);
    const tEB=md.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+x.budgeted,0),0);
    const net=tI-tE;

    if(S.budgetView==="in"){
      // === MONEY IN DETAIL ===
      h+=`<div class="cnt view-enter" style="padding-top:8px">`;
      h+=`<button class="back-btn" onclick="S.budgetView='dash';S.edit=false;render()">‹ Budget</button>`;
      h+=`<div class="sec-in">`;
      h+=renderSection(md.income,"Money In",null,em,true);
      h+=`</div></div>`;

    } else if(S.budgetView==="out"){
      // === MONEY OUT DETAIL ===
      h+=`<div class="cnt view-enter" style="padding-top:8px">`;
      h+=`<button class="back-btn" onclick="S.budgetView='dash';S.edit=false;render()">‹ Budget</button>`;
      // Quick buttons
      const qbs=S.data.quickButtons||[];
      if(qbs.length>0||em){
        h+=`<div style="margin-bottom:4px;font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:1px">Quick log</div>`;
        h+=`<div class="qb-row">`;
        qbs.forEach((qb,qi)=>{
          if(em){
            h+=`<button class="qb" onclick="removeQuickButton(${qi})">× ${esc(qb.label)} <span class="qb-amt">${fmt(qb.amount)}</span></button>`;
          } else {
            h+=`<button class="qb" onclick="fireQuickButton(${qi})">${esc(qb.label)} <span class="qb-amt">${fmt(qb.amount)}</span></button>`;
          }
        });
        if(em)h+=`<button class="qb-add" onclick="openQuickButtonModal()">+ Shortcut</button>`;
        h+=`</div>`;
      }
      // Categories
      h+=`<div class="sec-out">`;
      md.categories.forEach(cat=>{
        h+=renderSection(cat.items,cat.name,cat.id,em,false);
      });
      if(em)h+=`<button class="add" onclick="addCategory()">+ Add category</button>`;
      if(!em&&qbs.length===0)h+=`<div style="font-size:12px;color:var(--t3);margin-top:8px;text-align:center">Tip: In edit mode, add Quick Log shortcuts for purchases you make often</div>`;
      h+=`</div></div>`;

    } else {
      // === DASHBOARD ===
      // Running total across all months
      let runTotal=0;
      const curMoHist=mk();const startMoHist=S.data._startMonth||curMoHist;
      const sortedMonths=Object.keys(S.data.months||{}).filter(m2=>m2>=startMoHist&&m2<=curMoHist).sort();
      sortedMonths.forEach(m2=>{const md2=S.data.months[m2];if(!md2)return;const mI=md2.income.reduce((s,x)=>s+txTotal(x),0);const mE=md2.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);runTotal+=mI-mE});

      h+=`<div class="cnt" style="padding-top:0">`;
      // Running total
      h+=`<div class="dash-total"><div class="big" style="color:${runTotal>=0?'var(--gn)':'var(--rd)'}">${fmt(runTotal)}</div><div class="sub">${acctTerm('Total saved')} · all months</div></div>`;
      // This month net
      // Today's spending
      const todayISO=new Date().toISOString().split('T')[0];
      const todayTxs=[];
      md.categories.forEach(cat=>{cat.items.forEach(item=>{item.transactions.forEach(tx=>{
        if(!tx.auto&&tx.amount>0&&tx.isoDate===todayISO)todayTxs.push({amount:tx.amount,note:tx.note||item.label,cat:cat.name,paidWith:tx.paidWith})
      })})});
      const todayTotal=todayTxs.reduce((s,x)=>s+x.amount,0);
      if(todayTxs.length>0){
        h+=`<div class="insight view-enter" onclick="S.view='trends';S.trendsView='log';S.txFilter='all';S.searchRange='1';render()"><span class="ins-icon">📅</span><div class="ins-body"><div class="ins-title">Today: ${fmt(todayTotal)} spent</div><div class="ins-sub">${todayTxs.length} transaction${todayTxs.length>1?'s':''} — tap for full log</div></div></div>`;
      }

      // Surplus tracked only on month close (not auto)
      h+=`<div class="dash-net"><div class="dn-amt" style="color:${net>=0?'var(--gn)':'var(--rd)'}">${net>=0?'+':''}${fmt(net)}</div><div class="dn-label">${acctTerm('This month')}</div></div>`;
      // Money In card
      h+=`<div class="dash-card view-enter" onclick="S._navHistory.push({view:S.view,budgetView:S.budgetView,activeGroup:S.activeGroup});S.budgetView='in';render()"><div class="dc-l"><span class="dc-icon">💰</span><div><div class="dc-label">${acctTerm('Money In')}</div><div class="dc-amt" style="color:var(--gn)">${fmt(tI)}</div></div></div><span class="dc-arrow">›</span></div>`;
      // Money Out card
      if(tSaved>0){
        h+=`<div class="dash-card view-enter" onclick="S._navHistory.push({view:S.view,budgetView:S.budgetView,activeGroup:S.activeGroup});S.budgetView='out';render()"><div class="dc-l"><span class="dc-icon">🏦</span><div><div class="dc-label">${acctTerm('Saved')}</div><div class="dc-amt" style="color:var(--gn)">${fmt(tSaved)}</div></div></div><span class="dc-arrow">›</span></div>`;
      }
      h+=`<div class="dash-card view-enter" onclick="S._navHistory.push({view:S.view,budgetView:S.budgetView,activeGroup:S.activeGroup});S.budgetView='out';render()"><div class="dc-l"><span class="dc-icon">💸</span><div><div class="dc-label">${acctTerm('Money Out')}</div><div class="dc-amt" style="color:${tE>0?'var(--rd)':'var(--t3)'}">${fmt(tE)}</div></div></div><span class="dc-arrow">›</span></div>`;
      // === INSIGHTS ===
      const daysInMonth=new Date(parseInt(S.month.split("-")[0]),parseInt(S.month.split("-")[1]),0).getDate();
      const today2=new Date();
      const currentDay=S.month===mk()?today2.getDate():daysInMonth;
      const daysLeft=Math.max(0,daysInMonth-currentDay);

      // Savings rate
      if(tI>0){
        const savingsRate=Math.round((net/tI)*100);
        const srColor=savingsRate>=20?'var(--gn)':savingsRate>=10?'var(--yl)':savingsRate>=0?'var(--or)':'var(--rd)';
        h+=`<div class="insight view-enter"><span class="ins-icon">${savingsRate>=20?'🏆':savingsRate>=0?'📊':'⚠️'}</span><div class="ins-body"><div class="ins-title" style="color:${srColor}">${savingsRate}% savings rate</div><div class="ins-sub">${savingsRate>=20?'Great — above 20% target':savingsRate>=10?'Decent — aim for 20%':savingsRate>=0?'Low — look for cuts':'Spending more than earning'}</div></div></div>`;
      }

      // Spending velocity
      if(tE>0&&currentDay>0&&daysLeft>0){
        const dailyAvg=tE/currentDay;
        const projected=Math.round(dailyAvg*daysInMonth);
        const overBudget=projected>tEB;
        if(Math.abs(projected-tEB)>100){
          h+=`<div class="insight view-enter"><span class="ins-icon">${overBudget?'🔥':'✅'}</span><div class="ins-body"><div class="ins-title" style="color:${overBudget?'var(--rd)':'var(--gn)'}"><span class="info-label" onclick="event.stopPropagation();showHelpTopic('velocity')">On pace to spend</span> ${fmt(projected)}</div><div class="ins-sub">${overBudget?fmt(projected-tEB)+' over budget at this rate — '+daysLeft+' days to adjust':''+fmt(tEB-projected)+' under budget — '+daysLeft+' days left'}</div></div></div>`;
        }
      }

      // Spending streak
      const todayStr=mk()===S.month?(today2.getMonth()+1)+"/"+today2.getDate():"";
      if(todayStr){

      // Sanity check minimums: real min payments are typically max($25, 1-3% of balance)
      cards.forEach(cd2=>{const realMin=Math.max(25,Math.round(cd2.balance*0.01));if(cd2.minPayment>cd2.balance)cd2.minPayment=cd2.balance;if(cd2.minPayment>cd2.balance*0.15)cd2.minPayment=realMin;if(cd2.balance>0&&cd2.minPayment<=0)cd2.minPayment=realMin});
      const totalMin=cards.reduce((s,x)=>s+Math.min(x.minPayment||25,x.balance),0);

      var totalExpense=totalActual>0?totalActual:totalBudgeted;
      const available=Math.max(0,totalIncome-totalExpense);

      // Debt-to-income bracket
      const annualIncome=totalIncome*12||1;
      const dtiRatio=totalBal/annualIncome;
      let bracket,bracketLabel,bracketColor,bracketAdvice,suggestedPct;
      if(dtiRatio<0.05){bracket="low";bracketLabel="Low";bracketColor="var(--gn)";bracketAdvice="Debt is minimal. Pay a bit above minimums and focus on savings.";suggestedPct=0.10}

      else{bracket="critical";bracketLabel="Critical";bracketColor="var(--rd)";bracketAdvice="Debt exceeds half your annual income. Put every spare dollar toward payoff. Consider balance transfers or debt consolidation.";suggestedPct=0.70}

      const strat="avalanche";
      const sorted=[...cards].map((cd2,i)=>({...cd2,idx:i}));

      // Simulate payoff month-by-month (avalanche: highest APR first)
      // totalBudget = total amount you put toward ALL cards each month
      function simPayoffBudget(totalBudget){
        if(totalBudget<=0)return{months:999,interest:0};

// ===== SECTION RENDERER =====
function renderSection(items,title,catId,em,isIncome){
  const total=items.reduce((s,x)=>s+txTotal(x),0);
  const budget=items.reduce((s,x)=>s+x.budgeted,0);
  const ov=total>budget;
  const secKey="sec-"+(catId||"income");
  // Default: collapse sections where all items are recurring and not in edit mode
  if(S.collapsed===undefined)S.collapsed={};
  const allRecurring=items.every(i=>i.recurring);
  const isOpen=S.collapsed[secKey]===true?false:true;
  let h=`<div class="sec">`;
  // Header - clickable to toggle
  h+=`<div class="sh" onclick="${em?'':'toggleSection(\''+secKey+'\')'}"><div style="display:flex;align-items:center;gap:3px">`;
  if(!em)h+=`<span class="sh-arrow ${isOpen?'open':''}">▸</span>`;
  if(em&&!isIncome)h+=`<button class="xb" onclick="event.stopPropagation();removeCategory('${catId}')">×</button>`;
  if(em&&!isIncome)h+=`<span class="cat-emoji" style="cursor:pointer" onclick="event.stopPropagation();openEmojiPicker('${catId}')">${getCatEmoji(title)}</span><span class="sh-t" style="cursor:pointer" onclick="event.stopPropagation();renameCatUI(this,'${catId}')">${esc(title)}</span>`;
  else h+=`<span class="sh-t">${isIncome?"💰 ":"<span class=\"cat-emoji\">"+getCatEmoji(title)+"</span> "}${esc(title)}</span>`;
  h+=`</div><span class="sh-v" style="color:${ov&&!isIncome?'var(--rd)':''}">${fmt(total)} / ${fmt(budget)}</span></div>`;
  // Body - collapsible
  h+=`<div class="sec-body ${isOpen?'expanded':'collapsed'}">`;

  items.forEach(it=>{
    const tot=txTotal(it),p=pct(tot,it.budgeted),iov=tot>it.budgeted;
    const expKey=(catId||"inc")+"-"+it.id;
    const isExp=S.expanded[expKey];
    const txs=it.transactions||[];

    h+=`<div class="rw"><div class="rw-t"><div class="rw-l">`;
    if(em)h+=`<button class="xb" onclick="removeItemFromFuture('${it.id}',${catId?`'${catId}'`:'null'})">×</button>`;
    h+=`<span>${esc(it.label)}</span>`;
    if(it.recurring){
      const autoTx=it.transactions.find(t=>t.auto);
      const isPaid=autoTx?.confirmed;
      if(!em&&!isIncome){
        h+=`<button style="font-size:12px;padding:6px 12px;border-radius:8px;border:1.5px solid ${isPaid?'var(--gn)':'var(--bd)'};background:${isPaid?'rgba(140,192,99,.15)':'transparent'};color:${isPaid?'var(--gn)':'var(--t3)'};cursor:pointer;margin-left:4px;min-height:32px" onclick="event.stopPropagation();event.preventDefault();confirmPaid('${it.id}',${catId?"'"+catId+"'":'null'})">${isPaid?'✓ Paid':'Pay'}</button>`;
      } else {
        h+=`<span class="rec-badge">↻</span>`;
      }
    }
    // Show remaining balance for debt items
    if(!em&&it._balance!==undefined&&it._balance>0){
      const bPct=it._startBalance?Math.round((1-it._balance/it._startBalance)*100):0;
      const moInt=it._apr?it._balance*(it._apr/100/12):0;
      const moLeft=it.budgeted>moInt?Math.ceil(it._balance/(it.budgeted-moInt)):999;
      h+=`<span style="font-size:10px;color:var(--t3);margin-left:4px">${fmt(it._balance)} left${it._apr?' · '+it._apr+'%':''}</span>`;
    } else if(!em&&it._balance!==undefined&&it._balance<=0&&it.recurring){
      h+=`<span style="font-size:10px;color:var(--gn);margin-left:4px">✓ Paid off!</span>`;
    }
    if(!em&&!isIncome){
      const isRec=!!it.recurring;
      h+=`<button style="font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid `+(isRec?`var(--ac)`:`var(--bd)`)+`;background:`+(isRec?`rgba(219,181,110,.1)`:`transparent`)+`;color:`+(isRec?`var(--ac)`:`var(--t3)`)+`;cursor:pointer;margin-left:3px" onclick="event.stopPropagation();event.preventDefault();toggleRecurring('${it.id}',`+(catId?`'${catId}'`:`null`)+`)">`+(isRec?`↻`:`set ↻`)+`</button>`;
    }
    h+=`</div><div class="rw-n">`;

    // Amount display
    if(it.recurring&&!em){
      h+=`<span class="act" onclick="openTxModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">${fmt(tot)}</span>`;
    } else {
      h+=`<span class="act ${tot===0?'z':''}" style="${iov&&!isIncome?'color:var(--rd)':''}" onclick="openTxModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">${tot===0?(isIncome?"+log":"+add"):fmt(tot)}</span>`;
    }

    if(em){
      h+=`<span class="bud" onclick="openEditItemModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">✎ ${fmt(it.budgeted)}</span>`;
    } else {
      h+=`<span class="bud" onclick="event.stopPropagation();event.preventDefault();editBudgetInline('${catId}','${it.id}',${isIncome},${it.budgeted})" style="cursor:pointer">/ ${fmt(it.budgeted)}</span>`;
    }
    h+=`</div></div>`;
    if(!em&&it.budgeted>0&&!isIncome){const remaining=it.budgeted-tot;
      h+=`<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px"><span style="color:var(--t3)">${fmt(tot)} spent</span><span style="color:${remaining>=0?'var(--gn)':'var(--rd)'};font-weight:600">${remaining>=0?fmt(remaining)+' left':fmt(Math.abs(remaining))+' over'}</span></div>`;
      if(it._balance>0&&it.budgeted>0){
        const mi3=it._apr?it._balance*(it._apr/100/12):0;
        const eff=it.budgeted-mi3;
        const moEst=eff>0?Math.ceil(it._balance/eff):999;
        h+=`<div style="font-size:10px;color:var(--t3);margin-bottom:2px">${fmt(it._balance)} remaining${it._apr?' · '+fmt(mi3)+'/mo interest':''} · ~${moEst} months to payoff</div>`}
    }
    h+=`<div class="bar"><div class="bar-f" style="width:${p}%;background:${bCol(p,iov,isIncome)}"></div></div>`;
    if(it.note&&!em)h+=`<div class="note-text">${esc(it.note)}</div>`;

    // Transaction log
    const manualTxs=txs.filter(t=>!t.auto);
    if(manualTxs.length>0||txs.length>1){
      const showTxs=it.recurring?txs:manualTxs;
      if(showTxs.length>0){
        h+=`<span class="tx-toggle" onclick="S.expanded['${expKey}']=!S.expanded['${expKey}'];render()">${isExp?'▾ Hide':'▸ '+showTxs.length+' entr'+(showTxs.length!==1?'ies':'y')}</span>`;
        if(isExp){
          h+=`<div class="txlog">`;
          showTxs.forEach(tx=>{
            h+=`<div class="txlog-i"><div class="meta"><span class="dt">${tx.date||""}</span><span class="nt">${esc(tx.note||"")}</span>`;
            if(tx.tags?.length)tx.tags.forEach(tg=>h+=`<span class="tg">${esc(tg)}</span>`);
            h+=`</div><span class="amt">${fmt(tx.amount)}</span>`;
            if(!tx.auto){h+=`<button class="xb" onclick="editTx('${it.id}',${catId?"'"+catId+"'":'null'},'${tx.id}')" style="font-size:11px">✎</button>`;h+=`<button class="xb" onclick="removeTxById('${it.id}',${catId?"'"+catId+"'":'null'},'${tx.id}')" style="font-size:14px">×</button>`}
            h+=`</div>`;
          });
          h+=`</div>`;
        }
      }
    }
    h+=`</div>`;
  });

  if(em){
    if(isIncome)h+=`<button class="add" onclick="addItemToAll(null,{id:uid()})">+ Add income</button>`;
    else h+=`<button class="add" onclick="addItemToAll('${catId}',{id:uid()})">+ Add item</button>`;
  }
  h+=`</div></div>`;
  return h;
}

// ===== ACTION HANDLERS =====
function openTxModal(itemId,catId,isIncome){
  const md=cm(),item=getItemFromMonth(md,itemId,catId);
  if(!item)return;
  S.modal={type:"addtx",label:item.label,itemId,catId,isIncome,currentTotal:txTotal(item)};
  render();setTimeout(()=>{const i=document.getElementById("m-inp");if(i){i.focus();i.select()}},60);
}

function saveTx(){
  const m=S.modal,md=cm();
  const amt=parseFloat(document.getElementById("m-inp").value)||0;
  if(amt===0){closeModal();return}
  var noteEl=document.getElementById("m-note");
  var note=noteEl?noteEl.value.trim():(m._note||'');
  var tagsEl=document.getElementById("m-tags");
  var tagsRaw=tagsEl?tagsEl.value.trim():'';
  const tags=tagsRaw?tagsRaw.split(",").map(t=>t.trim()).filter(Boolean):[];
  const d=new Date();
  const tx={id:uid(),date:(d.getMonth()+1)+"/"+d.getDate(),isoDate:d.toISOString().split('T')[0],amount:amt,note,tags,auto:false};
  const item=getItemFromMonth(md,m.itemId,m.catId);
  if(!item)return;
  if(!item.transactions)item.transactions=[];
  tx.paidWith=m.paidWith||"cash";
  item.transactions.push(tx);
  // If paid with credit card, increase card balance
  if(m.qaType==="expense"&&m.paidWith&&m.paidWith!=="cash"&&m.paidWith!=="debit"){
    var ecard=(S.data.debts?.cards||[]).find(function(cd){return cd.id===m.paidWith});
    if(ecard)ecard.balance+=amt;
  }
  // If paid with debit, deduct from bank account
  if(m.qaType==="expense"&&m.paidWith==="debit"&&m.debitAccount){
    var debitAcct=(S.data.networth?.accounts||[]).find(function(a){return a.id===m.debitAccount});
    if(debitAcct){var curD=getNWBalance(debitAcct,S.month);debitAcct.balances[S.month]=curD-amt}
  }
  S.data.streakDate=new Date().toISOString().split('T')[0];
  // Deposit income to account if selected
  if(m.qaType==="income"&&m.depositTo&&m.depositTo!=="none"&&m.depositTo!=="cash"){

function removeTxById(itemId,catId,txId){

  if(catId){const cat=findById(md.categories,catId);if(cat)item=findById(cat.items,itemId)}
  else{item=findById(md.income,itemId)}
  if(!item)return;
  const txIdx=item.transactions.findIndex(t=>t.id===txId);
  if(txIdx<0)return;
  const tx=item.transactions[txIdx];
  // Reverse card balance if paid with a card
  if(tx.paidWith&&tx.paidWith!=="cash"&&tx.paidWith!=="debit"){
    const card=S.data.debts?.cards?.find(cd=>cd.id===tx.paidWith);
    if(card)card.balance=Math.max(0,card.balance-tx.amount);
  }
  item.transactions.splice(txIdx,1);
  save();render();
}

function exportCSV(){
  var rows=[["Date","Type","Category","Item","Amount","Note","Payment Method","Tags"]];
  Object.keys(S.data.months||{}).sort().forEach(function(mk2){
    var md=S.data.months[mk2];if(!md)return;

      rows.push([tx.isoDate||tx.date||mk2,"Expense",cat.name,it.label,tx.amount,tx.note||"",pw,(tx.tags||[]).join(";")]);
    })})});
    (md.income||[]).forEach(function(it){(it.transactions||[]).forEach(function(tx){
      if(tx.auto&&tx.amount===0)return;
      rows.push([tx.isoDate||tx.date||mk2,"Income","Income",it.label,tx.amount,tx.note||"","",""]);
    })});
  });
  // Add card balances
  rows.push([]);rows.push(["","","","","",""]);
  rows.push(["Card","Balance","Limit","APR","Min Payment","Bill Due Date"]);
  (S.data.debts?.cards||[]).forEach(function(cd){
    rows.push([cd.name,cd.balance,cd.limit||0,cd.apr||0,cd.minPayment||0,cd.stmtDate||""]);
  });
  // Add accounts
  rows.push([]);rows.push(["","","","","",""]);
  rows.push(["Account","Balance"]);
  (S.data.networth?.accounts||[]).forEach(function(a){
    if(a.label==="Unsorted")return;
    rows.push([a.label,getNWBalance(a,mk())]);
  });
  // Add subscriptions
  rows.push([]);rows.push(["","","","","",""]);
  rows.push(["Subscription","Monthly Cost","Category","Bill Day"]);
  (S.data.subscriptions||[]).forEach(function(sub){
    rows.push([sub.name,sub.amount,sub.category||"",sub.billDay||""]);
  });
  var csv=rows.map(function(r){return r.map(function(cell){

}

function importCSV(text){
  var lines=text.split("\n").map(function(l){
    var cells=[];var cur="";var inQuote=false;
    for(var i=0;i<l.length;i++){
      if(l[i]==='"'){inQuote=!inQuote}
      else if(l[i]===","&&!inQuote){cells.push(cur.trim());cur=""}
      else{cur+=l[i]}
    }
    cells.push(cur.trim());return cells;
  });
  if(lines.length<2){toast("CSV is empty");return}
  // Parse transactions
  var txCount=0;
  for(var i=1;i<lines.length;i++){
    var row=lines[i];if(!row[0]||row[0]==="Card"||row[0]==="Account"||row[0]==="Subscription"||row[0]==="")continue;
    if(row[1]==="Expense"||row[1]==="Income"){
      var date=row[0],type=row[1],catName=row[2],itemName=row[3],amount=parseFloat(row[4])||0,note=row[5]||"",pw=row[6]||"cash",tags=(row[7]||"").split(";").filter(Boolean);
      if(!amount)continue;
      var monthKey=date.substring(0,7);if(!monthKey||monthKey.length!==7)continue;
      var md=getMonth(monthKey);
      if(type==="Expense"){
        var cat=md.categories.find(function(c2){return c2.name===catName});
        if(!cat){cat={id:uid(),name:catName,items:[]};md.categories.push(cat);
          if(!S.data.template.categories.find(function(c2){return c2.name===catName}))S.data.template.categories.push({id:cat.id,name:catName,items:[]})}
        var item=cat.items.find(function(it){return it.label===itemName});
        if(!item){item={id:uid(),label:itemName,budgeted:0,recurring:false,note:"",transactions:[]};cat.items.push(item);
          var tCat=S.data.template.categories.find(function(c2){return c2.id===cat.id});if(tCat&&!tCat.items.find(function(i2){return i2.label===itemName}))tCat.items.push({id:item.id,label:itemName,amount:0,recurring:false,note:""})}
        item.transactions.push({id:uid(),date:date,isoDate:date,amount:amount,note:note,paidWith:pw,tags:tags,auto:false});
        txCount++;
      } else {
        var inc=md.income.find(function(it){return it.label===itemName});
        if(!inc){inc={id:uid(),label:itemName,budgeted:0,recurring:false,note:"",transactions:[]};md.income.push(inc);
          if(!S.data.template.income.find(function(i2){return i2.label===itemName}))S.data.template.income.push({id:uid(),label:itemName,amount:0,recurring:false,note:""})}
        inc.transactions.push({id:uid(),date:date,isoDate:date,amount:amount,note:note,tags:[],auto:false});
        txCount++;
      }
    }
  }
  ensureStructure();save();render();
  toast("Imported "+txCount+" transactions from CSV");
}

function importData(){
  var inp=document.createElement("input");inp.type="file";inp.accept=".json,.csv";
  inp.onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){
    try{
      if(f.name.endsWith(".csv")){
        importCSV(ev.target.result);
      } else {
        var parsed=JSON.parse(ev.target.result);
        if(parsed._syncCode)delete parsed._syncCode;
        S.data=parsed;ensureStructure();save();render();toast("Restored from JSON");
      }
    }catch(err){toast("Import failed: "+err.message)}
  };r.readAsText(f)};
  inp.click();
}
