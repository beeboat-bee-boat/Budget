<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2c2318">
<title>Budget</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Budget%20Tracker%22%2C%22short_name%22%3A%22Budget%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%232c2318%22%2C%22theme_color%22%3A%22%232c2318%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%253E%253Ctext%20y%3D'.9em'%20font-size%3D'80'%253E%25F0%259F%2592%25B0%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='80'>💰</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#2c2318;
  --c1:#382d21;
  --c2:#443626;
  --bd:#5a4a38;
  --tx:#ede0cc;
  --t2:#c4ac8a;
  --t3:#96836a;
  --ac:#dbb56e;
  --gn:#8cc063;
  --rd:#e07055;
  --or:#dba05a;
  --yl:#dbb56e;
  --sh:0 2px 8px rgba(0,0,0,.4);
  --sb:env(safe-area-inset-bottom,0px);
}
}
html,body{background:#2c2318!important}body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;padding-bottom:calc(60px + var(--sb));font-size:15px;line-height:1.45}
button{touch-action:manipulation;min-height:36px;font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}

/* Layout */
.top{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px 0;padding-top:calc(12px + var(--st))}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hdr h1{font-size:22px;font-weight:800}
.tb{display:flex;gap:6px}
.tb button{touch-action:manipulation;min-height:36px;padding:8px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--c1);color:var(--t2);font-size:13px;font-weight:500;min-height:36px}
.tb button:active{opacity:.7}
.tb .on{background:var(--or);color:#ede0cc;border-color:var(--or)}
.mnav{display:flex;align-items:center;justify-content:center;gap:20px;padding-bottom:10px;border-bottom:.5px solid var(--bd)}
.mnav button{touch-action:manipulation;min-height:36px;background:none;border:none;font-size:20px;color:var(--t2);padding:6px 10px;min-height:36px}
.mnav span{font-size:16px;font-weight:600;min-width:100px;text-align:center}
.cnt{padding:4px 16px 80px;background:var(--bg)}

/* Stats */
.sts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px}
.st{background:var(--c1);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.st small{font-size:11px;color:var(--t3);font-weight:500}
.st div{font-size:20px;font-weight:700;margin-top:3px}

/* Sections */
.sec{margin-bottom:16px}
.sh{display:flex;touch-action:manipulation;justify-content:space-between;align-items:center;padding:12px 0;cursor:pointer;-webkit-user-select:none;user-select:none;min-height:44px}
.sh:active{opacity:.7}
.sh-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--t2)}
.sh-v{font-size:13px;color:var(--t2);font-weight:500}

/* Item Cards */
.rw{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.rw-t{display:flex;justify-content:space-between;align-items:center;min-height:28px}
.rw-l{font-size:15px;display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500}
.rw-n{display:flex;align-items:center;gap:6px;flex-shrink:0}
.act{font-size:15px;font-weight:700;cursor:pointer;padding:6px 10px;border-radius:10px;min-width:48px;min-height:36px;text-align:right;display:flex;align-items:center;justify-content:flex-end}
.act:active{background:var(--c2)}
.act.z{color:var(--t3);font-weight:500;font-size:13px}
.bud{font-size:12px;color:var(--t3);min-width:40px;text-align:right;padding:6px 4px;cursor:pointer;min-height:36px;display:flex;align-items:center;justify-content:flex-end}
.bar{height:4px;border-radius:2px;background:var(--bd);overflow:hidden;margin-top:6px}
.bar-f{height:100%;border-radius:2px;transition:width .3s}
.rec-badge{font-size:10px;color:var(--t3);margin-left:3px}
.note-text{font-size:12px;color:var(--t3);margin-top:4px;font-style:italic}

/* Transaction log */
.txlog{margin:8px 0 0 0;padding:8px 12px;background:var(--bg);border-radius:10px}
.txlog-i{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;color:var(--t2);border-bottom:.5px solid var(--bd);min-height:40px}
.txlog-i:last-child{border-bottom:none}
.txlog-i .xb{min-width:40px;min-height:40px;padding:6px;font-size:16px;display:flex;align-items:center;justify-content:center}
.txlog-i .amt{font-weight:600;color:var(--tx);min-width:44px;text-align:right}
.txlog-i .meta{display:flex;gap:8px;flex:1;min-width:0;overflow:hidden;align-items:center}
.txlog-i .dt{color:var(--t3);font-size:11px;flex-shrink:0}
.txlog-i .nt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txlog-i .tg{font-size:10px;color:var(--ac);background:rgba(34,102,204,.1);padding:1px 6px;border-radius:4px;flex-shrink:0}
.tx-toggle{font-size:13px;color:var(--ac);cursor:pointer;margin-top:4px;display:inline-flex;align-items:center;padding:10px 0;font-weight:500;min-height:44px}
.tx-toggle:active{opacity:.6}

/* Buttons */
.add{width:100%;padding:14px;border:1.5px dashed var(--bd);border-radius:14px;background:none;color:var(--t3);font-size:14px;margin-top:4px;min-height:48px;font-weight:500}
.add:active{background:var(--c1)}
.xb{background:none;border:none;color:var(--t3);font-size:16px;padding:4px 8px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}
.xb:active{color:var(--rd)}

/* Modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.mdl{background:var(--bg);border-radius:20px 20px 0 0;padding:20px;padding-bottom:calc(20px + var(--sb));width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.mdl h3{font-size:18px;margin-bottom:12px;font-weight:700}
.mdl label{font-size:13px;color:var(--t2);display:block;margin:10px 0 4px;font-weight:500}
.mdl input,.mdl select,.mdl textarea{width:100%;padding:14px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--c1);color:var(--tx);-webkit-appearance:none}
.mdl textarea{resize:vertical;min-height:80px;font-size:15px}
.mdl input:focus,.mdl textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.mdl .tog{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;color:var(--t2);min-height:36px}
.mdl .tog input{width:20px;height:20px;flex-shrink:0}
.mbs{display:flex;gap:6px;margin-top:14px}
.mbs button{touch-action:manipulation;min-height:36px;flex:1;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;min-height:48px}
.mbs .cn{background:var(--c1);color:var(--tx)}
.mbs .sv{background:var(--ac);color:#ede0cc}
.mbs .dg{background:var(--rd);color:#ede0cc}

/* Goals */
.gc{background:var(--c1);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.gc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gc-t{font-size:16px;font-weight:700;flex:1}
.gc-v{font-size:20px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px}
.gc-v:active{background:var(--c2)}
.gc-s{display:flex;justify-content:space-between;font-size:12px;color:var(--t2);margin-top:6px}
.gc-n{font-size:12px;color:var(--t2);margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.gc-a{display:flex;gap:6px;margin-top:10px}
.gc-a button{touch-action:manipulation;min-height:36px;padding:8px 14px;border:1px solid var(--bd);border-radius:8px;background:none;color:var(--t2);font-size:13px;font-weight:500;min-height:40px}
.gc-a button:active{background:var(--bg)}
.trophy{border:1px solid var(--bd);border-radius:14px;margin-top:14px;overflow:hidden;background:var(--c1)}
.trophy summary{padding:12px 14px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.trophy summary::after{content:"▸";transition:transform .2s}
.trophy[open] summary::after{transform:rotate(90deg)}
.trophy-i{padding:10px 14px;border-top:.5px solid var(--bd);font-size:13px;color:var(--t2)}
.trophy-i .nm{color:var(--tx);font-weight:600;font-size:14px}

/* Charts */
.chart-wrap{position:relative;width:100%;height:240px;margin:12px 0;background:var(--c1);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.chart-pick{display:flex;gap:6px;margin-bottom:10px}
.chart-pick button{touch-action:manipulation;min-height:36px;padding:8px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--c1);color:var(--t2);font-size:13px;font-weight:500;min-height:40px}
.chart-pick button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}

/* Search */
.s-bar{display:flex;gap:8px;margin-bottom:12px}
.s-bar input{flex:1;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--c1);color:var(--tx);font-size:15px}
.s-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.s-filters select{padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--c1);color:var(--tx);font-size:13px;min-height:36px}
.s-result{padding:10px 14px;background:var(--c1);border-radius:12px;margin-bottom:6px;box-shadow:var(--sh)}
.s-result .top-r{display:flex;justify-content:space-between;font-size:14px}
.s-result .cat{color:var(--t3);font-size:11px;margin-top:2px}
.s-total{font-size:15px;font-weight:600;padding:10px 0;color:var(--tx)}

/* Net worth */
.nw-card{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.nw-h{display:flex;justify-content:space-between;align-items:center}
.nw-t{font-size:12px;color:var(--t2)}
.nw-v{font-size:18px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px}
.nw-v:active{background:var(--c2)}

/* Tabs */
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c1);border-top:.5px solid var(--bd);padding:6px 0 2px;padding-bottom:calc(6px + var(--sb));z-index:10;box-shadow:0 -1px 4px rgba(0,0,0,.05)}
.tab{flex:1;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:none;color:var(--t3);font-size:9px;padding:2px 0;font-weight:500;min-height:44px;justify-content:center}
.tab.active{color:var(--ac)}
.tab svg{width:20px;height:20px}

/* Pin */
.pin-s{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px;gap:16px}
.pin-s h2{font-size:26px;font-weight:800}
.pin-s p{font-size:15px;color:var(--t2);text-align:center;max-width:300px;line-height:1.5}
.pin-s input{width:200px;padding:16px;font-size:22px;text-align:center;border:1px solid var(--bd);border-radius:14px;background:var(--c1);color:var(--tx);letter-spacing:8px}
.pin-s button{touch-action:manipulation;min-height:36px;padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:600;background:var(--ac);color:#ede0cc;min-height:48px}
.pin-s .sec-btn{background:var(--c1);color:var(--tx)}
.pin-s .err{color:var(--rd);font-size:13px}

/* Summary cards */
.mn{font-size:13px;color:var(--t2);margin-top:8px;padding:12px 14px;background:var(--c1);border-radius:14px;line-height:1.5;box-shadow:var(--sh)}


/* FAB */
.fab{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom,0px));right:16px;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#ede0cc;border:none;font-size:28px;font-weight:300;box-shadow:0 4px 14px rgba(219,181,110,.35);z-index:9;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.9)}
}

/* Quick-add category picker */
.qa-type{display:flex;gap:0;margin-bottom:12px;border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.qa-type button{touch-action:manipulation;min-height:36px;flex:1;padding:10px;border:none;font-size:14px;font-weight:600;background:var(--c1);color:var(--t2);min-height:42px}
.qa-type button.on{background:var(--ac);color:#ede0cc}
.qa-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qa-cat{touch-action:manipulation;padding:8px 14px;border-radius:20px;border:1.5px solid var(--bd);background:var(--c1);color:var(--t2);font-size:13px;font-weight:500;min-height:38px}
.qa-cat:active{opacity:.7}
.qa-cat.on{border-color:var(--ac);background:rgba(219,181,110,.12);color:var(--ac)}
.qa-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;margin-bottom:4px}
.qa-item{touch-action:manipulation;padding:8px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--c1);color:var(--t2);font-size:13px;font-weight:500;min-height:40px}
.qa-item:active{opacity:.7}
.qa-item.on{border-color:var(--gn);background:rgba(140,192,99,.1);color:var(--gn)}


/* Debt planner */
.debt-card{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.debt-card .dc-top{display:flex;justify-content:space-between;align-items:center}
.debt-card .dc-name{font-size:15px;font-weight:600}
.debt-card .dc-bal{font-size:18px;font-weight:700;color:var(--rd);cursor:pointer;padding:4px 8px;border-radius:8px}
.debt-card .dc-bal:active{background:var(--c2)}
.debt-card .dc-details{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--t2)}
.debt-card .dc-pay{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:8px;font-size:13px;color:var(--gn);font-weight:600}
.debt-summary{background:var(--c1);border-radius:14px;padding:14px 16px;margin-top:10px;box-shadow:var(--sh)}
.debt-summary .ds-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.debt-summary .ds-label{color:var(--t2)}
.debt-summary .ds-val{font-weight:600}


/* Money In/Out headers */
.sec-in .sh{border-bottom:2px solid var(--gn)}
.sec-in .sh-t{color:var(--gn)}
.sec-out .sh{border-bottom:2px solid var(--or)}
.sec-out .sh-t{color:var(--or)}


/* Onboarding */
.ob{min-height:100dvh;display:flex;flex-direction:column;padding:24px 20px;position:relative;padding-top:calc(24px + var(--st));padding-bottom:calc(24px + var(--sb))}
.ob-top{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.ob-top h2{font-size:26px;font-weight:800;margin-bottom:8px}
.ob-top p{font-size:15px;color:var(--t2);max-width:300px;line-height:1.5;margin-bottom:20px}
.ob-step{font-size:12px;color:var(--t3);margin-bottom:12px}
.ob-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;max-width:340px}
.ob-chip{touch-action:manipulation;padding:10px 16px;border-radius:20px;border:1.5px solid var(--bd);background:var(--c1);font-size:14px;font-weight:500;color:var(--tx);min-height:44px;display:flex;align-items:center}
.ob-chip:active{opacity:.7}
.ob-chip.on{border-color:var(--ac);background:rgba(219,181,110,.12);color:var(--ac)}
.ob-chip.added{border-color:var(--gn);background:rgba(140,192,99,.1);color:var(--gn)}
.ob-input{width:100%;max-width:300px;padding:14px;font-size:16px;border:1px solid var(--bd);border-radius:12px;background:var(--c1);color:var(--tx);text-align:center;margin:8px 0}
.ob-btn{padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:600;background:var(--ac);color:#ede0cc;min-height:48px;min-width:200px;margin-top:12px}
.ob-btn:active{opacity:.8}
.ob-btn.sec{background:var(--c1);color:var(--tx);min-width:auto;padding:10px 20px;font-size:14px}
.ob-skip{background:none;border:none;color:var(--t3);font-size:13px;margin-top:10px;padding:8px;min-height:44px}
/* Group */
.grp-card{background:var(--c1);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--sh)}
.grp-bal{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid var(--bd)}
.grp-bal:last-child{border-bottom:none}
.grp-code{font-family:monospace;font-size:20px;font-weight:700;letter-spacing:3px;text-align:center;padding:14px;background:var(--c1);border-radius:12px;box-shadow:var(--sh);user-select:all;-webkit-user-select:all;margin:8px 0}
/* Dashboard */
.dash-total{text-align:center;padding:20px 0 8px}
.dash-total .big{font-size:36px;font-weight:800}
.dash-total .sub{font-size:12px;color:var(--t2);margin-top:2px}
.dash-card{background:var(--c1);touch-action:manipulation;border-radius:16px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:64px}
.dash-card:active{opacity:.8}
.dash-card .dc-l{display:flex;align-items:center;gap:10px}
.dash-card .dc-icon{font-size:22px}
.dash-card .dc-label{font-size:14px;color:var(--t2);font-weight:500}
.dash-card .dc-amt{font-size:22px;font-weight:700}
.dash-card .dc-arrow{font-size:16px;color:var(--t3)}
.dash-net{background:var(--c1);border-radius:16px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--sh);text-align:center}
.dash-net .dn-amt{font-size:24px;font-weight:700}
.dash-net .dn-label{font-size:11px;color:var(--t2);margin-top:2px}
.hist-row{background:var(--c1);border-radius:12px;padding:12px 16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)}
.hist-row .hr-left{font-size:13px}
.hist-row .hr-month{font-weight:600}
.hist-row .hr-detail{font-size:11px;color:var(--t2);margin-top:2px}
.hist-row .hr-net{font-size:16px;font-weight:700}
.back-btn{background:none;border:none;font-size:15px;color:var(--ac);font-weight:600;padding:8px 0;display:flex;align-items:center;gap:4px;min-height:44px}
.back-btn:active{opacity:.6}
/* Quick buttons */
.qb-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qb{background:var(--c1);border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--tx);min-height:44px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.qb:active{background:var(--c2)}
.qb .qb-amt{color:var(--gn);font-size:12px;font-weight:500}
.qb-add{background:none;border:1.5px dashed var(--bd);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--t3);min-height:44px;display:flex;align-items:center}

/* Help tooltips */
.help-btn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--bd);background:var(--c1);color:var(--t3);font-size:11px;font-weight:700;cursor:pointer;margin-left:4px;flex-shrink:0;vertical-align:middle}
.help-btn:active{background:var(--c2)}
.util-bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin-top:6px}
.util-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.card-stat{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:.5px solid var(--bd)}
.card-stat:last-child{border-bottom:none}
.card-stat .cs-label{color:var(--t2);display:flex;align-items:center;gap:2px}
.card-stat .cs-val{font-weight:600}

/* Velocity / insights */
.insight{background:var(--c1);touch-action:manipulation;border-radius:14px;padding:12px 16px;margin-bottom:8px;box-shadow:var(--sh);display:flex;align-items:center;gap:12px}
.insight .ins-icon{font-size:22px;flex-shrink:0}
.insight .ins-body{flex:1}
.insight .ins-title{font-size:13px;font-weight:600}
.insight .ins-sub{font-size:11px;color:var(--t2);margin-top:1px}
.streak{background:linear-gradient(135deg,rgba(34,102,204,.08),rgba(140,192,99,.08));border:1px solid rgba(219,181,110,.15)}
.bill-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:.5px solid var(--bd);font-size:13px}
.bill-item:last-child{border-bottom:none}
.bill-day{font-size:11px;color:var(--t3);min-width:40px}
/* Animations */
.view-enter{animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cat-emoji{font-size:16px;margin-right:2px}


.listening{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(26,143,92,.4)}50%{box-shadow:0 0 0 16px rgba(26,143,92,0)}}

/* Collapsible sections */
.sh-arrow{font-size:12px;color:var(--t3);margin-right:4px;transition:transform .2s;display:inline-block}
.sh-arrow.open{transform:rotate(90deg)}
.sec-body{overflow:hidden;transition:max-height .25s ease,opacity .2s ease}
.sec-body.collapsed{max-height:0!important;opacity:0;pointer-events:none;margin:0;padding:0}
.sec-body.expanded{opacity:1}
</style>

<body>
<div id="safe-top" style="height:env(safe-area-inset-top,0px);min-height:0;background:var(--bg,#2c2318);position:sticky;top:0;z-index:100"></div><div id="app"></div>
<script>
// ===== CONFIG =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCGmTihM2ZpqYxdComWxxkW33O2GjZNVis",
  authDomain: "budget-app-dba33.firebaseapp.com",
  databaseURL: "https://budget-app-dba33-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "budget-app-dba33",
  storageBucket: "budget-app-dba33.firebasestorage.app",
  messagingSenderId: "976872547157",
  appId: "1:976872547157:web:6c82cfb9209329f20b85dc",
  measurementId: "G-8JPBZ1Y44G"
};

// ===== UTILS =====
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmt=n=>{const a=Math.abs(Math.round(n));return(n<0?"-$":"$")+a.toLocaleString("en-US")};
function clampDay(day,month,year){if(!day||day<=0)return day;const y=year||new Date().getFullYear();const m2=month!==undefined?month:new Date().getMonth();return Math.min(day,new Date(y,m2+1,0).getDate())}
let _u=Date.now();const uid=()=>"x"+(_u++);
const mk=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const monthLabel=(m)=>{const d=new Date(m+"-15");return MO[d.getMonth()]+" "+d.getFullYear()};
async function sha(s){const e=new TextEncoder().encode(s);const h=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function pct(v,mx){return mx>0?Math.min((v/mx)*100,100):0}
function bCol(p,ov,rev){if(rev)return p<50?"var(--or)":p<80?"var(--yl)":"var(--gn)";return ov?"var(--rd)":p>85?"var(--yl)":"var(--gn)"}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

// ===== EMOJI MAP =====
const EMOJI_MAP={"Rent":"🏠","Rent / Housing":"🏠","Housing":"🏠","Food":"🍕","Food & Groceries":"🍕","Groceries":"🛒","Cats":"🐱","Pets":"🐾","Transport":"🚇","Going Out":"🍻","Savings":"💰","Shopping":"🛍️","Subscriptions":"📱","Health":"💊","Utilities":"⚡","Fun":"🎮","Entertainment":"🎬","Insurance":"🛡️","Misc":"📦","Splurges":"🛑","Unnecessary":"🛑"};
function getCatEmoji(name){return S.data.catEmojis?.[name]||EMOJI_MAP[name]||"📁"}

// ===== ID-BASED LOOKUPS =====
function findById(arr,id){return arr.find(x=>x.id===id)}
function findIdxById(arr,id){return arr.findIndex(x=>x.id===id)}

// ===== DEFAULT DATA =====
const DEF={
  template:{income:[],categories:[]},
  months:{},
  goals:{active:[],completed:[]},
  debts:{cards:[],strategy:"avalanche"},
  networth:{accounts:[]},
  monthlyNotes:{},
  quickButtons:[],
  userName:"",
  groups:[],
};

// ===== STATE =====
let db=null,dbRef=null;
let S={phase:"pin",_navHistory:[],pin:"",data:null,month:mk(),view:"budget",budgetView:"dash",edit:false,modal:null,err:"",expanded:{},chartType:"spending",searchQ:"",searchCat:"all",searchRange:"3",activeGroup:-1,payoffTarget:12};

// ===== FIREBASE =====
function hasFC(){return FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL}
function initFB(){if(!hasFC())return false;try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();return true}catch{return false}}

async function connect(pin){
  var h=await sha(pin);
  if(db){
    dbRef=db.ref("budgets/"+h);
    const snap=await dbRef.once("value");
    S.data=snap.exists()?snap.val():JSON.parse(JSON.stringify(DEF));
    if(!snap.exists())await dbRef.set(S.data);
    dbRef.on("value",s=>{if(s.exists()&&S.phase==="app"){S.data=s.val();ensureStructure();try{render()}catch(e){console.error("Sync render error:",e)}}});
  } else {
    const l=localStorage.getItem("bt-"+h);
    S.data=l?JSON.parse(l):JSON.parse(JSON.stringify(DEF));
  }
  ensureStructure();
  // Net worth accounts from onboarding
  if(S.obAccounts&&S.obAccounts.length){
    S.data.networth={accounts:[]};
    S.obAccounts.filter(a=>a.label).forEach(a=>{
      S.data.networth.accounts.push({id:uid(),label:a.label,type:"asset",balances:{[S.month]:a.balance}});
    });
  }
  // Unassigned money account (always exists)
  if(!S.data.networth.accounts.find(a=>a.label==="Unsorted"))S.data.networth.accounts.push({id:uid(),label:"Unsorted",type:"asset",balances:{}});
  // Ensure savings category exists with savings goal amount
  if(S.obSavingsGoal>0){
    var savCat2=S.data.template.categories.find(function(c2){return c2.name==="Savings"});
    if(!savCat2){savCat2={id:uid(),name:"Savings",items:[]};S.data.template.categories.push(savCat2)}
    if(!savCat2.items.find(function(i){return i.label==="Savings"})){savCat2.items.push({id:uid(),label:"Savings",amount:S.obSavingsGoal,recurring:true,note:""})}
    else{var si2=savCat2.items.find(function(i){return i.label==="Savings"});si2.amount=S.obSavingsGoal;si2.recurring=true}
  }
  archiveOldMonths();
  if(S.data.theme&&THEMES[S.data.theme])applyTheme(S.data.theme);
  S.pin=pin;S.phase="app";
  if(S._recoveredNeedsCreds){delete S._recoveredNeedsCreds;S.modal={type:'setcreds'}}
  try{render()}catch(e){console.error("Initial render failed:",e);S.view="budget";S.budgetView="dash";S.modal=null;S.expanded={};S.collapsed={};render()}
}

function resetMonthTxs(){
  const md=cm();
  md.categories.forEach(cat=>{cat.items.forEach(item=>{
    item.transactions=item.transactions.filter(t=>t.auto);
  })});
  md.income.forEach(item=>{
    item.transactions=item.transactions.filter(t=>t.auto);
  });
  // Unclose if closed
  if(S.data._closed?.[S.month])delete S.data._closed[S.month];
  if(S.data._sorted?.[S.month])delete S.data._sorted[S.month];
  if(S.data._sortedDetail?.[S.month])delete S.data._sortedDetail[S.month];
  const ua=S.data.networth?.accounts?.find(a=>a.label==="Unsorted");
  if(ua)delete ua.balances[S.month];
  saveNow();closeModal();toast("Month reset — manual transactions cleared");
}
function recalcAll(){
  // Force regenerate auto transactions for current month
  const md=cm();
  md.categories.forEach(cat=>{cat.items.forEach(item=>{
    if(item.recurring){
      const hasAuto=item.transactions.some(t=>t.auto);
      if(!hasAuto){
        const[yr,mo]=S.month.split("-");
        const d2=S.month===mk()?new Date():new Date(yr+"-"+mo+"-01T12:00:00");
        item.transactions.unshift({id:uid(),date:(d2.getMonth()+1)+"/"+d2.getDate(),isoDate:d2.toISOString().split("T")[0],amount:item.budgeted,note:item.label,tags:[],auto:true});
      }
    }
  })});
  md.income.forEach(item=>{
    if(item.recurring){
      const hasAuto=item.transactions.some(t=>t.auto);
      if(!hasAuto){
        const[yr,mo]=S.month.split("-");
        const d2=S.month===mk()?new Date():new Date(yr+"-"+mo+"-01T12:00:00");
        item.transactions.unshift({id:uid(),date:(d2.getMonth()+1)+"/"+d2.getDate(),isoDate:d2.toISOString().split("T")[0],amount:item.budgeted,note:item.label,tags:[],auto:true});
      }
    }
  });
  saveNow();render();toast("Totals recalculated");
}

function applyManualOverride(){
  const cards6=S.data.debts?.cards||[];
  cards6.forEach((cd,ci)=>{
    const el=document.getElementById("ov-card-"+ci);
    if(el)cd.balance=parseFloat(el.value)||0;
  });
  const nwAccts6=(S.data.networth?.accounts||[]);
  nwAccts6.forEach((a,ai)=>{
    const el=document.getElementById("ov-nw-"+ai);
    if(el)a.balances[S.month]=parseFloat(el.value)||0;
  });
  saveNow();closeModal();toast("Balances updated");
}

function cleanGroupTxs(){
  customConfirm("Remove all group-logged transactions from your budget? This fixes double-counting from group expenses but cannot be undone.",_doCleanGroupTxs);
}
function _doCleanGroupTxs(){
  let removed=0;
  Object.keys(S.data.months||{}).forEach(mk2=>{
    const md=S.data.months[mk2];if(!md)return;
    md.categories.forEach(cat=>{cat.items.forEach(item=>{
      const before=item.transactions.length;
      item.transactions=item.transactions.filter(tx=>!tx.tags||!tx.tags.includes("group"));
      removed+=before-item.transactions.length;
    })});
    md.income.forEach(item=>{
      const before=item.transactions.length;
      item.transactions=item.transactions.filter(tx=>!tx.tags||!tx.tags.includes("group"));
      removed+=before-item.transactions.length;
    });
  });
  saveNow();render();toast("Removed "+removed+" group-logged transactions");}

function archiveOldMonths(){
  const cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-12);
  const cutoffKey=mk(cutoff);
  if(!S.data.months)return;
  Object.keys(S.data.months).forEach(m=>{
    if(m>=cutoffKey)return; // keep recent
    if(!S.data._closed?.[m])return; // only archive closed months
    const md=S.data.months[m];
    if(md._archived)return; // already archived
    // Calculate summaries before stripping
    const mI=md.income.reduce((s,x)=>s+txTotal(x),0);
    const mE=md.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);
    // Strip individual transactions, keep budgeted amounts
    md.income.forEach(item=>{item.transactions=[];item._total=mI});
    md.categories.forEach(cat=>{cat.items.forEach(item=>{
      const itemTotal=txTotal(item);
      item.transactions=[];item._total=itemTotal;
    })});
    md._archived=true;
    md._summary={income:mI,expenses:mE,net:mI-mE};
  });
}

function ensureStructure(){
  if(!S.data||typeof S.data!=="object"){S.data=JSON.parse(JSON.stringify(DEF));return}
  const d=S.data;
  if(!d.template)d.template=JSON.parse(JSON.stringify(DEF.template));
  if(!d.months)d.months={};
  if(!d.goals)d.goals={active:[],completed:[]};
  (d.groups||[]).forEach(g=>{if(!g.members)g.members={};if(!g.expenses)g.expenses=[]});
  if(d.groupMoney&&d.groupMoney.length>200)d.groupMoney=d.groupMoney.slice(-200);
  if(!d.goals.completed)d.goals.completed=[];
  if(!d.networth)d.networth={accounts:[]};
  if(!d.monthlyNotes)d.monthlyNotes={};
  if(!d.quickButtons)d.quickButtons=[];
  if(!d.streakDate)d.streakDate=null;
  if(!d.catEmojis)d.catEmojis={};
  if(d.group&&!d.groups){d.groups=[d.group];delete d.group}
  if(!d.groups)d.groups=[];
  if(!d.userName)d.userName="";
  if(!d.debts)d.debts={cards:[],strategy:"avalanche"};
  if(!d._sorted)d._sorted={};
  if(!d._sortedDetail)d._sortedDetail={};
  if(!d._closed)d._closed={};
  // Clean phantom future months
  const curMoClean=mk();
  if(d.months){Object.keys(d.months).forEach(m=>{if(m>curMoClean)delete d.months[m]})}
  if(!d.theme)d.theme='bee';
  if(!d._startMonth)d._startMonth=mk();
  if(!d.timezone)d.timezone=Intl?.DateTimeFormat?.()?.resolvedOptions?.()?.timeZone||'';
  if(!d.subscriptions)d.subscriptions=[];
  if(!d.debts.cards)d.debts.cards=[];
  d.debts.cards.forEach(cd=>{if(!cd.payments)cd.payments=[];if(!cd.id)cd.id=uid()});
  // Ensure all months have proper structure
  Object.keys(d.months||{}).forEach(mk2=>{
    const md2=d.months[mk2];if(!md2){delete d.months[mk2];return}
    if(!md2.categories)md2.categories=[];
    if(!md2.income)md2.income=[];
    md2.categories.forEach(cat=>{
      if(!cat.items)cat.items=[];
      cat.items.forEach(it=>{if(!it.transactions)it.transactions=[]});
    });
    md2.income.forEach(it=>{if(!it.transactions)it.transactions=[]});
  });
  // Ensure NW accounts have balances objects
  (d.networth?.accounts||[]).forEach(a=>{if(!a.balances)a.balances={};if(!a.id)a.id=uid()});
  // Template items must have ids
  (d.template?.categories||[]).forEach(c2=>{if(!c2.id)c2.id=uid();(c2.items||[]).forEach(i=>{if(!i.id)i.id=uid()})});
  (d.template?.income||[]).forEach(i=>{if(!i.id)i.id=uid()});
  // Nav history
  if(!S._navHistory)S._navHistory=[];
}

let _saveTimer=null;
function save(){
  // Debounce: batch rapid saves into one write (500ms)
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(_doSave,500);
}
function saveNow(){clearTimeout(_saveTimer);_doSave()}
function _doSave(){
  if(dbRef)dbRef.set(S.data);
  const code=localStorage.getItem("bt-sync")||S.pin;
  sha(code).then(h=>localStorage.setItem("bt-"+h,JSON.stringify(S.data)));
}

// ===== THEMES =====
const THEMES={
  bee:{name:"Bee",bg:"#2c2318",c1:"#382d21",c2:"#443626",bd:"#5a4a38",tx:"#ede0cc",t2:"#c4ac8a",t3:"#96836a",ac:"#dbb56e",gn:"#8cc063",rd:"#e07055",or:"#dba05a"},
  ocean:{name:"Ocean",bg:"#0d1926",c1:"#142233",c2:"#1a2d42",bd:"#284058",tx:"#d4e8f2",t2:"#88b4cc",t3:"#5888a4",ac:"#30c0c0",gn:"#50c890",rd:"#e06878",or:"#e0a050"},
  sunset:{name:"Sunset",bg:"#1e1418",c1:"#2c1c24",c2:"#38242e",bd:"#503848",tx:"#f0dce0",t2:"#c498a4",t3:"#946878",ac:"#e8706a",gn:"#78c868",rd:"#e06050",or:"#f0a840"},
  midnight:{name:"Midnight",bg:"#110e24",c1:"#1a1632",c2:"#221e3e",bd:"#342d58",tx:"#dcd4f0",t2:"#9e96c0",t3:"#6e6690",ac:"#7c6cf0",gn:"#58c890",rd:"#e06878",or:"#e0a050"},
  forest:{name:"Forest",bg:"#101c16",c1:"#18261e",c2:"#203026",bd:"#2e4236",tx:"#cce8d4",t2:"#88b898",t3:"#5e8870",ac:"#4cb878",gn:"#68c868",rd:"#d87060",or:"#d8a850"},
  mono:{name:"Slate",bg:"#18191e",c1:"#22232a",c2:"#2c2d36",bd:"#3e4050",tx:"#dcdee8",t2:"#9498a8",t3:"#686c80",ac:"#7090e0",gn:"#60c080",rd:"#e06868",or:"#e0a050"}
};

function applyTheme(id){
  const t=THEMES[id];if(!t)return;
  const r=document.documentElement?.style;if(!r)return;
  r.setProperty("--bg",t.bg);r.setProperty("--c1",t.c1);r.setProperty("--c2",t.c2);r.setProperty("--bd",t.bd);
  r.setProperty("--tx",t.tx);r.setProperty("--t2",t.t2);r.setProperty("--t3",t.t3);
  r.setProperty("--ac",t.ac);r.setProperty("--gn",t.gn);r.setProperty("--rd",t.rd);r.setProperty("--or",t.or);r.setProperty("--yl",t.ac);
  document.body.style.background=t.bg;document.querySelector("html").style.background=t.bg;
  document.querySelector('meta[name=theme-color]')?.setAttribute("content",t.bg);
  S.data.theme=id;save();
}

// ===== MONTH GENERATION =====
function makeAutoTx(amount,note,month){
  const[yr,mo]=month.split("-");
  const cur=mk();
  const d2=month===cur?new Date():new Date(yr+"-"+mo+"-01T12:00:00");
  const isoDate=d2.toISOString().split("T")[0];
  const dateStr=(d2.getMonth()+1)+"/"+d2.getDate();
  return {id:uid(),date:dateStr,isoDate,amount,note:note||"Auto-filled",tags:[],auto:true};
}

function genMonth(m){
  const t=S.data.template,md={income:[],categories:[]};
  // Auto-log subscriptions into a Subscriptions category if it exists
  const subs=S.data.subscriptions||[];
  if(subs.length){
    let subCat=t.categories.find(c2=>c2.name==="Subscriptions");
    if(subCat){
      subs.forEach(sub=>{
        if(!subCat.items.find(i=>i.label===sub.name)){
          subCat.items.push({id:uid(),label:sub.name,amount:sub.amount,recurring:true,note:"Subscription"});
        }
      });
    }
  }
  t.income.forEach(i=>{
    const txs=i.recurring?[makeAutoTx(i.amount,i.note,m)]:[];
    md.income.push({id:i.id,label:i.label,budgeted:i.amount,recurring:!!i.recurring,note:i.note||"",transactions:txs});
  });
  t.categories.forEach(c=>{
    const cat={id:c.id,name:c.name,items:[]};
    c.items.forEach(i=>{
      // Recurring expenses start at $0 until confirmed paid
      const txs=i.recurring?[makeAutoTx(0,i.note||i.label,m)]:[];
      cat.items.push({id:i.id,label:i.label,budgeted:i.amount,recurring:!!i.recurring,note:i.note||"",transactions:txs});
    });
    md.categories.push(cat);
  });
  return md;
}

function getMonth(m){
  if(!S.data.months[m]){S.data.months[m]=genMonth(m);save()}
  return S.data.months[m];
}
function cm(){return getMonth(S.month)}

// ===== TEMPLATE UPDATES (ID-BASED) =====
function updateTemplateItem(itemId,catId,updates){
  // Find in template
  let tmpl;
  if(catId===null){tmpl=findById(S.data.template.income,itemId)}
  else{const cat=findById(S.data.template.categories,catId);if(cat)tmpl=findById(cat.items,itemId)}
  if(!tmpl)return;
  Object.assign(tmpl,updates);

  // Update current + all future months by ID
  Object.keys(S.data.months).forEach(mk2=>{
    if(mk2>=S.month){
      const md2=S.data.months[mk2];
      let target;
      if(catId===null){target=findById(md2.income,itemId)}
      else{const mCat=findById(md2.categories,catId);if(mCat)target=findById(mCat.items,itemId)}
      if(!target)return;

      if(updates.label!==undefined)target.label=updates.label;
      if(updates.note!==undefined)target.note=updates.note;
      if(updates.amount!==undefined)target.budgeted=updates.amount;
      if(updates.recurring!==undefined)target.recurring=updates.recurring;

      // Rebuild auto transaction
      const isRec=updates.recurring!==undefined?updates.recurring:target.recurring;
      const amt=updates.amount!==undefined?updates.amount:target.budgeted;
      target.transactions=target.transactions||[];
      if(isRec){
        const ai=target.transactions.findIndex(t=>t.auto);
        const atx=makeAutoTx(amt,target.note,mk2);
        if(ai>=0)target.transactions[ai]=atx;else target.transactions.unshift(atx);
      } else {
        target.transactions=target.transactions.filter(t=>!t.auto);
      }
    }
  });
  save();
}

function addItemToAll(catId,item){
  // Add to template
  if(catId===null){S.data.template.income.push({id:item.id,label:item.label||"New item",amount:0,recurring:false,note:""})}
  else{const tc=findById(S.data.template.categories,catId);if(tc)tc.items.push({id:item.id,label:item.label||"New item",amount:0,recurring:false,note:""})}
  // Add to current + all future months
  const mItem={id:item.id,label:item.label||"New item",budgeted:0,recurring:false,note:"",transactions:[]};

// ===== NET WORTH HELPERS =====
function getNWBalance(account,month){
  if(!account.balances)return 0;
  if(account.balances[month]!==undefined)return account.balances[month];
  // Walk backward to find most recent
  const months=Object.keys(account.balances).sort();
  let last=0;
  for(const m of months){if(m<=month)last=account.balances[m]}
  return last;
}

function toggleRecurring(itemId,catId){
  const md=cm();let item=null;
  if(catId){const cat=findById(md.categories,catId);if(cat)item=findById(cat.items,itemId)}
  else{item=findById(md.income,itemId)}
  if(!item)return;
  if(!item.recurring){
    // Turning ON recurring - ask if it has a balance
    S.modal={type:"setrecurring",itemId,catId};render();return;
  }
  item.recurring=!item.recurring;
  // Update template too
  const tCat=catId?findById(S.data.template.categories,catId):null;
  const tItem=tCat?findById(tCat.items,itemId):findById(S.data.template.income,itemId);
  if(tItem)tItem.recurring=item.recurring;
  if(item.recurring){
    // Add auto tx with $0 (unpaid)
    if(!item.transactions.some(t=>t.auto)){
      const[yr,mo]=S.month.split("-");
      const d2=S.month===mk()?new Date():new Date(yr+"-"+mo+"-01T12:00:00");
      item.transactions.unshift({id:uid(),date:(d2.getMonth()+1)+"/"+d2.getDate(),isoDate:d2.toISOString().split("T")[0],amount:0,note:item.label,tags:[],auto:true});
    }
    // Propagate to future months
    Object.keys(S.data.months||{}).forEach(mk2=>{
      if(mk2<=S.month)return;
      const fmd=S.data.months[mk2];if(!fmd)return;
      if(catId){const fc=findById(fmd.categories,catId);if(fc){const fi=findById(fc.items,itemId);if(fi&&!fi.recurring){fi.recurring=true;
        fi.transactions.unshift({id:uid(),date:"1",isoDate:mk2+"-01",amount:0,note:fi.label,tags:[],auto:true})}}}
    });
    toast(item.label+" set as recurring ↻ (future months synced)");
  } else {
    // Remove auto tx
    item.transactions=item.transactions.filter(t=>!t.auto);
    // Propagate to future months
    Object.keys(S.data.months||{}).forEach(mk2=>{
      if(mk2<=S.month)return;
      const fmd=S.data.months[mk2];if(!fmd)return;
      if(catId){const fc=findById(fmd.categories,catId);if(fc){const fi=findById(fc.items,itemId);if(fi){fi.recurring=false;fi.transactions=fi.transactions.filter(t=>!t.auto)}}}
    });
    toast(item.label+" set as one-time (future months synced)");
  }
  save();render();
}

function confirmPaid(itemId,catId){
  const md=cm();let item=null;
  if(catId){const cat=findById(md.categories,catId);if(cat)item=findById(cat.items,itemId)}
  else{item=findById(md.income,itemId)}
  if(!item||!item.recurring)return;
  const autoTx=item.transactions.find(t=>t.auto);
  if(!autoTx)return;
  if(autoTx.confirmed){
    // Toggle off - zero out the amount
    delete autoTx.confirmed;
    const prevAmt=autoTx.amount;
    autoTx.amount=0;
    // Reverse balance deduction
    if(item._balance!==undefined)item._balance+=prevAmt;
    // Reverse goal progress
    const matchGoal2=S.data.goals?.active?.find(g=>g.linkedItem===item.id||g.label===item.label);
    if(matchGoal2){
      if(matchGoal2.type==="payoff")matchGoal2.current=(item._balance!==undefined?item._balance:Math.min(matchGoal2.start||0,(matchGoal2.current||0)+prevAmt));
      else matchGoal2.current=Math.max(0,(matchGoal2.current||0)-prevAmt);
    }
    toast(item.label+" unmarked");
  } else {
    // Mark as paid
    autoTx.confirmed=true;
    autoTx.amount=item.budgeted;
    autoTx.isoDate=new Date().toISOString().split("T")[0];
    autoTx.date=(new Date().getMonth()+1)+"/"+new Date().getDate();
    // Accrue interest then deduct payment
    if(item._balance!==undefined&&item._balance>0){
      if(item._apr>0){const moInterest=item._balance*(item._apr/100/12);item._balance+=moInterest}
      item._balance=Math.max(0,item._balance-item.budgeted);
      if(item._balance<=0){toast("🎉 "+item.label+" fully paid off!");item.recurring=false;
        const tItem=catId?findById(findById(S.data.template.categories,catId)?.items||[],itemId):findById(S.data.template.income,itemId);
        if(tItem)tItem.recurring=false;
      } else {toast(item.label+" paid — "+fmt(item._balance)+" remaining")}
    }
    // Sync with linked goal
    const matchGoal=S.data.goals?.active?.find(g=>g.linkedItem===item.id||g.label===item.label);
    if(matchGoal){
      if(matchGoal.type==="payoff")matchGoal.current=item._balance!==undefined?item._balance:Math.max(0,(matchGoal.current||0)-item.budgeted);
      else matchGoal.current=(matchGoal.current||0)+item.budgeted;
    }
    if(!item._balance&&!matchGoal)toast(item.label+" paid — "+fmt(item.budgeted)+" ✓");
  }
  save();render();
}

async function saveNewCreds(){
  var user=(document.getElementById('sc-user')||{}).value||'';user=user.trim();
  var pass=(document.getElementById('sc-pass')||{}).value||'';
  var pass2=(document.getElementById('sc-pass2')||{}).value||'';
  var errEl=document.getElementById('sc-err');
  if(!user||user.length<3){if(errEl)errEl.textContent='Username must be at least 3 characters';return}
  if(!pass||pass.length<4){if(errEl)errEl.textContent='Password must be at least 4 characters';return}
  if(pass!==pass2){if(errEl)errEl.textContent='Passwords do not match';return}
  // Check username uniqueness
  if(db){
    var taken=await db.ref('usernames/'+user.toLowerCase()).once('value');
    var oldUser=(S.data.userName||'').toLowerCase();
    if(taken.exists()&&taken.val()!==S.pin&&user.toLowerCase()!==oldUser){
      if(errEl)errEl.textContent='Username already taken';return;
    }
    // Reserve new username, release old
    if(oldUser&&oldUser!==user.toLowerCase())await db.ref('usernames/'+oldUser).remove();
    await db.ref('usernames/'+user.toLowerCase()).set(S.pin);
  }
  // Update credentials
  var newCode=await deriveCode(user,pass);
  // Move data to new sync code
  if(db&&dbRef){
    var data=S.data;
    var newHash=await sha(newCode);
    await db.ref('budgets/'+newHash).set(data);
    if(newCode!==S.pin){var oldHash=await sha(S.pin);await db.ref('budgets/'+oldHash).remove()}
    dbRef=db.ref('budgets/'+newHash);
  }
  S.data.userName=user;
  localStorage.setItem('bt-sync',newCode);localStorage.setItem('bt-user',user);
  S.pin=newCode;save();closeModal();toast('Credentials updated');
}

function doCloseMonth(){
  // Critical save
  const md5=cm();
  // Use txTotal - same as dashboard, counts actual transaction amounts
  const tI5=md5.income.reduce((s,x)=>s+txTotal(x),0);
  const savCats5=["Savings","Goals"];
  const tE5=md5.categories.filter(c2=>!savCats5.includes(c2.name)).reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+txTotal(x),0),0);
  const net5=tI5-tE5;
  
  // Lock surplus into Unsorted
  if(net5>0&&S.data.networth?.accounts){
    const ua=S.data.networth.accounts.find(a=>a.label==="Unsorted");
    if(ua)ua.balances[S.month]=net5;
  }
  
  // Mark month as closed
  if(!S.data._closed)S.data._closed={};
  S.data._closed[S.month]={
    date:new Date().toLocaleDateString(),
    net:net5,
    income:tI5,
    expenses:tE5
  };
  
  // Also mark sorted so auto-surplus doesn't overwrite
  if(!S.data._sorted)S.data._sorted={};
  S.data._sorted[S.month]=true;
  
  saveNow();closeModal();toast("Month closed — net: "+fmt(net5));
}

function reopenMonth(){
  customConfirm("Reopen this month? Surplus and any sorted amounts will be reversed.",()=>{
    // Remove surplus from Unsorted
    if(S.data.networth?.accounts){
      const ua=S.data.networth.accounts.find(a=>a.label==="Unsorted");
      if(ua)delete ua.balances[S.month];
    }
    // Reverse any sorted amounts back from accounts
    const sortDetail=S.data._sortedDetail?.[S.month];
    if(sortDetail&&S.data.networth?.accounts){
      Object.entries(sortDetail).forEach(([acctId,amt])=>{
        const acct=S.data.networth.accounts.find(a=>a.id===acctId);
        if(acct){const cur=getNWBalance(acct,S.month);acct.balances[S.month]=Math.max(0,cur-amt)}
      });
      delete S.data._sortedDetail[S.month];
    }
    // Remove flags
    delete S.data._closed[S.month];
    if(!S.data._sorted)S.data._sorted={};
    S.data._sorted[S.month]=true;
    save();render();toast("Month reopened");
  });
}

function updateSortRemaining(){

  const totalAvail=m.remaining||0;

  const left=totalAvail-allocated;
  const el=document.getElementById("sort-status");
  if(el){
    el.style.color=left<0?'var(--rd)':left===0?'var(--gn)':'var(--t2)';
    el.innerHTML=left<0?'Over by '+fmt(Math.abs(left)):left===0?'\u2713 Fully allocated':fmt(left)+' remaining';
  }
  // Disable Apply if over
  const btn=document.querySelector('.mbs .sv');
  if(btn){btn.style.opacity=left<0?'0.4':'1';btn.style.pointerEvents=left<0?'none':'auto'}
}

function applySortFunds(){
  const m=S.modal;
  // Validate total doesn't exceed available
  const nwCheck=(S.data.networth?.accounts||[]).filter(a=>a.label!=="Unsorted");
  let totalAlloc=0;nwCheck.forEach((_,ai)=>{totalAlloc+=parseFloat(m['_sort'+ai])||0});
  if(totalAlloc>(m.remaining||0)+1){toast("Total exceeds available surplus");return}if(!m)return;
  const nw2=(S.data.networth?.accounts||[]).filter(a=>a.label!=="Unsorted");
  let totalAllocated=0;
  nw2.forEach((a,ai)=>{
    const add=parseFloat(m['_sort'+ai])||0;
    if(add>0){
      const curBal=getNWBalance(a,S.month);
      a.balances[S.month]=curBal+add;
      totalAllocated+=add;
    }
  });
  // Reduce unsorted by allocated amount (from total across all months)
  const unsorted2=S.data.networth.accounts.find(a=>a.label==="Unsorted");
  if(unsorted2){
    let totalUnsorted=0;
    Object.values(unsorted2.balances||{}).forEach(v=>{totalUnsorted+=v||0});
    const remaining=Math.max(0,totalUnsorted-totalAllocated);
    // Clear all month balances and set remaining on current month
    Object.keys(unsorted2.balances).forEach(k=>{unsorted2.balances[k]=0});
    if(remaining>0)unsorted2.balances[S.month]=remaining;
  }
  // Track what was sorted for this month (so reopen can reverse it)
  if(!S.data._sortedDetail)S.data._sortedDetail={};
  if(!S.data._sortedDetail[S.month])S.data._sortedDetail[S.month]={};
  nw2.forEach((a,ai)=>{
    const add=parseFloat(m['_sort'+ai])||0;
    if(add>0)S.data._sortedDetail[S.month][a.id]=(S.data._sortedDetail[S.month][a.id]||0)+add;
  });
  if(!S.data._sorted)S.data._sorted={};
  S.data._sorted[S.month]=true;
  save();closeModal();toast("Sorted "+fmt(totalAllocated)+" into accounts");
}

function recommendBudget(basePay,selectedCats){
  // Budget off BASE pay only. Commissions/variable → savings/debt
  const recs={};
  const rules={
    "Rent / Housing":{pct:0.30,items:[{l:"Rent",p:0.85,r:true},{l:"Utilities",p:0.10,r:true},{l:"Insurance",p:0.05,r:true}]},

  else if(S.view==="cards"){

      // Aggregates
      const totalBal=cards.reduce((s,x)=>s+x.balance,0);
      const totalLim=cards.reduce((s,x)=>s+(x.limit||0),0);
      const totalUtil=totalLim>0?Math.round(totalBal/totalLim*100):0;
      // Sanity check minimums: real min payments are typically max($25, 1-3% of balance)
      cards.forEach(cd2=>{const realMin=Math.max(25,Math.round(cd2.balance*0.01));if(cd2.minPayment>cd2.balance)cd2.minPayment=cd2.balance;if(cd2.minPayment>cd2.balance*0.15)cd2.minPayment=realMin;if(cd2.balance>0&&cd2.minPayment<=0)cd2.minPayment=realMin});
      const totalMin=cards.reduce((s,x)=>s+Math.min(x.minPayment||25,x.balance),0);
      const monthlyInterest=cards.reduce((s,x)=>s+x.balance*(x.apr/100/12),0);
      const weightedApr=totalBal>0?cards.reduce((s,x)=>s+x.apr*(x.balance/totalBal),0):0;

      // Budget calculation
      const md3=cm();
      const totalIncome=md3.income.reduce((s,x)=>s+txTotal(x),0)||md3.income.reduce((s,x)=>s+x.budgeted,0);
      const totalExpense=md3.categories.reduce((s,c2)=>s+c2.items.reduce((ss,x)=>ss+x.budgeted,0),0);
      const available=Math.max(0,totalIncome-totalExpense);

      // Debt-to-income bracket
      const annualIncome=totalIncome*12||1;
      const dtiRatio=totalBal/annualIncome;
      let bracket,bracketLabel,bracketColor,bracketAdvice,suggestedPct;
      if(dtiRatio<0.05){bracket="low";bracketLabel="Low";bracketColor="var(--gn)";bracketAdvice="Debt is minimal. Pay a bit above minimums and focus on savings.";suggestedPct=0.10}
      else if(dtiRatio<0.15){bracket="moderate";bracketLabel="Moderate";bracketColor="var(--yl)";bracketAdvice="Solid position. Put 15-20% of your free cash toward debt to clear it within a year.";suggestedPct=0.20}
      else if(dtiRatio<0.30){bracket="elevated";bracketLabel="Elevated";bracketColor="var(--or)";bracketAdvice="Prioritize payoff. Aim to put 30-40% of available money toward debt. Cut discretionary spending.";suggestedPct=0.35}
      else if(dtiRatio<0.50){bracket="high";bracketLabel="High";bracketColor="var(--rd)";bracketAdvice="This needs attention. Allocate 50%+ of available cash to debt. Consider a side hustle or expense cuts.";suggestedPct=0.50}
      else{bracket="critical";bracketLabel="Critical";bracketColor="var(--rd)";bracketAdvice="Debt exceeds half your annual income. Put every spare dollar toward payoff. Consider balance transfers or debt consolidation.";suggestedPct=0.70}

      // Calculate recommended total payment
      const suggestedTotal=Math.max(totalMin,Math.round(available*suggestedPct/10)*10);
      const extra=Math.max(0,suggestedTotal-totalMin);

      // Strategy
      const strat="avalanche";
      const sorted=[...cards].map((cd2,i)=>({...cd2,idx:i}));
      if(strat==="avalanche")sorted.sort((a,b)=>b.apr-a.apr);
      else sorted.sort((a,b)=>a.balance-b.balance);
      const payments={};
      cards.forEach(cd2=>{payments[cd2.id]=cd2.minPayment||0});
      let extraLeft=extra;
      for(const cd2 of sorted){if(cd2.balance>0&&extraLeft>0){const add2=Math.min(extraLeft,cd2.balance-payments[cd2.id]);if(add2>0){payments[cd2.id]+=add2;extraLeft-=add2}}}

      // Simulate payoff month-by-month (avalanche: highest APR first)
      // totalBudget = total amount you put toward ALL cards each month
      function simPayoffBudget(totalBudget){
        if(totalBudget<=0)return{months:999,interest:0};
        let sc=cards.map(cd2=>({id:cd2.id,name:cd2.name,bal:cd2.balance,apr:cd2.apr,min:cd2.minPayment||25}));
        let mo=0,totalInt=0;
        while(sc.some(cd2=>cd2.bal>0.01)&&mo<360){
          mo++;
          // 1. Accrue interest on each card
          sc.forEach(cd2=>{if(cd2.bal>0){const interest=cd2.bal*(cd2.apr/100/12);cd2.bal+=interest;totalInt+=interest}});
          // 2. Pay minimums first
          let budget=totalBudget;
          sc.forEach(cd2=>{if(cd2.bal>0){const pay=Math.min(cd2.bal,cd2.min);cd2.bal-=pay;budget-=pay}});
          // 3. Apply remaining budget to highest APR card (avalanche)
          const sorted2=[...sc].filter(cd2=>cd2.bal>0).sort((a,b)=>b.apr-a.apr);
          for(const cd2 of sorted2){if(budget<=0)break;if(cd2.bal>0){const pay=Math.min(cd2.bal,budget);cd2.bal-=pay;budget-=pay}}
          // 4. When a card is paid off, its min payment frees up (already handled by budget)
          sc.forEach(cd2=>{if(cd2.bal<0.01)cd2.bal=0});
        }

    h+=`<div class="sec"><div class="sh" onclick="S.expanded['subs-main']=!S.expanded['subs-main'];render()" style="cursor:pointer"><span class="sh-t">Subscriptions</span><span class="sh-v">${subs.length?fmt(subTotal)+'/mo':''}</span></div>`;
    if(S.expanded['subs-main']){
      if(subs.length){
        subs.forEach((sub,si)=>{
          const dayLabel=sub.billDay?'Bills on the '+sub.billDay+(sub.billDay===1?'st':sub.billDay===2?'nd':sub.billDay===3?'rd':'th'):'';
          h+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);cursor:pointer" onclick="S.modal={type:'editsub',si:${si}};render()">
            <div><div style="font-size:13px;font-weight:600">${esc(sub.name)}</div>
            <div style="font-size:11px;color:var(--t3)">${esc(sub.category||'')}${dayLabel?' · '+dayLabel:''}</div></div>

            </div>
          </div>`;
        });
        h+=`<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;font-weight:700"><span>Monthly total</span><span>${fmt(subTotal)}</span></div>`;
        h+=`<div style="font-size:11px;color:var(--t2);margin-bottom:4px">Annual: ${fmt(subTotal*12)}</div>`;
      } else {
        h+=`<div style="padding:8px 0;font-size:12px;color:var(--t3)">No subscriptions tracked yet.</div>`;
      }
      h+=`<button class="add" style="margin-top:4px" onclick="S.modal={type:'addsub'};render()">+ Add subscription</button>`;
    }
    h+=`</div>`;

    // Net worth
    const nw=S.data.networth?.accounts||[];
    const unsortedAcct=nw.find(a=>a.label==="Unsorted");
    // Sum unsorted across ALL months (each closed month may have unsorted balance)
    let unsortedBal=0;
    if(unsortedAcct&&unsortedAcct.balances){Object.values(unsortedAcct.balances).forEach(v=>{unsortedBal+=v||0})}
    let totalNW=0;
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Net worth</span><span class="sh-v"></span></div>`;
    
    // Unassigned money card (prominent)
    if(unsortedBal>0){
      h+=`<div style="padding:12px;background:rgba(219,181,110,.06);border:1px solid rgba(219,181,110,.15);border-radius:12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center">

          <div style="font-size:18px;font-weight:800;color:var(--ac)">${fmt(unsortedBal)}</div>
        </div>
        <button style="margin-top:8px;width:100%;padding:8px;background:var(--ac);color:#ede0cc;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer" onclick="S.modal={type:'sortfunds',remaining:${unsortedBal}};render()">Sort into accounts</button>
      </div>`;
    }
    
    // Regular accounts (skip Unsorted in the list)
    nw.filter(a=>a.label!=="Unsorted").forEach((a,ai)=>{
      const bal=getNWBalance(a,S.month);
      const realIdx=nw.indexOf(a);
      totalNW+=a.type==="asset"?bal:-bal;
      h+=`<div class="nw-card"><div class="nw-h"><div><div style="font-size:12px;font-weight:600">${esc(a.label)}</div><div class="nw-t">${a.type==="asset"?"Asset":"Debt"}</div></div><span class="nw-v" style="color:${a.type==='debt'?'var(--rd)':'var(--gn)'}" onclick="openNWBalanceModal(${realIdx})">${fmt(bal)}</span></div></div>`;
    });
    totalNW+=unsortedBal; // include unsorted in total
    if(nw.length>1||unsortedBal>0)h+=`<div style="text-align:right;font-size:14px;font-weight:700;padding:5px 0;color:${totalNW>=0?'var(--gn)':'var(--rd)'}">Net worth: ${fmt(totalNW)}</div>`;
    else if(nw.length<=1)h+=`<div style="padding:10px 0;font-size:12px;color:var(--t3)">Add accounts in Edit Setup to track net worth.</div>`;

    // === SECTION: ACCOUNT ===
    h+=`<div style="font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);font-weight:700;padding:16px 0 4px">⚙️ Account</div>`;

    // Theme picker
    const curTheme=S.data.theme||"bee";
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Theme</span><span class="sh-v">${THEMES[curTheme]?.name||'Bee'}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 0">`;
    Object.entries(THEMES).forEach(([id,t])=>{
      const isOn=curTheme===id;
      h+=`<div onclick="applyTheme('${id}');render()" style="cursor:pointer;border-radius:12px;overflow:hidden;border:2px solid ${isOn?'var(--ac)':'transparent'};${isOn?'box-shadow:0 0 0 1px var(--ac)':''}">
        <div style="display:flex;height:28px">
          <div style="flex:2;background:${t.bg}"></div>
          <div style="flex:2;background:${t.c1}"></div>
          <div style="flex:1;background:${t.ac}"></div>
          <div style="flex:1;background:${t.gn}"></div>
          <div style="flex:1;background:${t.rd}"></div>
        </div>
        <div style="padding:5px 8px;background:${t.c1};display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:11px;font-weight:600;color:${t.tx}">${t.name}</span>
          <div style="display:flex;gap:3px"><span style="font-size:9px;color:${t.gn}">+$50</span><span style="font-size:9px;color:${t.rd}">-$30</span></div>
        </div>
      </div>`;
    });
    h+=`</div></div>`;

    // Start month
    const sm=S.data._startMonth||mk();
    const[smY,smM]=sm.split("-");
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Start month</span><span class="sh-v">${monthLabel(sm)}</span></div>
      <div style="padding:5px 0;font-size:12px;color:var(--t2);margin-bottom:4px">Only months from this date onward are tracked.</div>
      <div style="display:flex;gap:6px">
        <select style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--c1);color:var(--tx);font-size:13px" onchange="S.data._startMonth=this.value+'-'+document.getElementById('sm-month').value;save();render()" id="sm-year">`;
    const curYr=new Date().getFullYear();for(let y=curYr-5;y<=curYr;y++)h+=`<option value="${y}" ${String(y)===smY?"selected":""}>${y}</option>`;
    h+=`</select>
        <select id="sm-month" style="flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--c1);color:var(--tx);font-size:13px" onchange="S.data._startMonth=document.getElementById('sm-year').value+'-'+this.value;save();render()">`;
    MO.forEach((mn,mi2)=>{const mv=String(mi2+1).padStart(2,"0");h+=`<option value="${mv}" ${mv===smM?"selected":""}>${mn}</option>`});
    h+=`</select></div></div>`;

    // Timezone
    const tz=S.data.timezone||Intl?.DateTimeFormat?.()?.resolvedOptions?.()?.timeZone||'Not set';
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Timezone</span><span class="sh-v">${esc(tz)}</span></div>
      <div style="padding:5px 0"><select style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--c1);color:var(--tx);font-size:13px" onchange="S.data.timezone=this.value;save();render()">`;
    const tzones=["America/New_York","America/Chicago","America/Denver","America/Los_Angeles","America/Phoenix","America/Anchorage","Pacific/Honolulu","America/Toronto","America/Vancouver","Europe/London","Europe/Paris","Europe/Berlin","Asia/Tokyo","Asia/Shanghai","Asia/Kolkata","Australia/Sydney","UTC"];
    tzones.forEach(z=>{h+=`<option value="${z}" ${tz===z?'selected':''}>${z.replace(/_/g,' ')}</option>`});
    h+=`<option value="other">Other...</option></select></div></div>`;

    // Data size
    const dataSize=JSON.stringify(S.data).length;
    const dataSizeKB=(dataSize/1024).toFixed(1);
    const dataSizeMB=(dataSize/1024/1024).toFixed(2);
    const monthCount=Object.keys(S.data.months||{}).length;
    const archivedCount=Object.keys(S.data.months||{}).filter(m=>S.data.months[m]._archived).length;
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Storage</span><span class="sh-v">${dataSizeKB} KB</span></div>
      <div style="padding:5px 0;font-size:12px;color:var(--t2)">${monthCount} months tracked · ${archivedCount} archived<br>Firebase free tier: 1 GB (you are using ${dataSizeMB} MB)</div></div>`;

    // Data
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Data</span><span class="sh-v"></span></div>
      <div style="padding:5px 0;display:flex;flex-direction:column;gap:5px">
        <button class="add" onclick="exportData()">Export backup (JSON)</button>
        <button class="add" onclick="cleanGroupTxs()">Remove group-logged transactions</button>
        <button class="add" onclick="S.modal={type:'resetmonth'};render()">Reset current month's transactions</button>
        <button class="add" onclick="recalcAll()">Recalculate all totals</button>
        <button class="add" onclick="importData()">Import backup</button>
      </div></div>`;
    const syncCode=localStorage.getItem("bt-sync")||"";
    h+=`<div class="sec"><div class="sh"><span class="sh-t">Sync</span><span class="sh-v">${db?'Cloud ☁️':'Local 📱'}</span></div>
      <div style="padding:8px 0">
        <div style="font-size:12px;color:var(--t2);margin-bottom:6px">Enter this code on another device to connect:</div>
        <div style="font-size:18px;font-weight:700;letter-spacing:3px;padding:12px;background:var(--c1);border-radius:10px;text-align:center;font-family:monospace;user-select:all;-webkit-user-select:all;box-shadow:var(--sh)">${syncCode}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:6px">Keep this private. Anyone with this code can access your budget.</div>
      </div>
      <div style="margin-bottom:8px">${localStorage.getItem('bt-user')?'<div style="font-size:12px;color:var(--t2);margin-bottom:2px">Logged in as</div><div style="font-size:15px;font-weight:600;margin-bottom:8px">'+esc(localStorage.getItem('bt-user'))+'</div>':''}
      <div style="font-size:12px;color:var(--t2);margin-bottom:2px">Recovery code — screenshot this</div></div>
      <button class="add" onclick="startReOnboard()">Edit setup (income, categories, cards)</button>
      <button class="add" onclick="S.modal={type:'changeuser'};render()">Change username</button>
        <button class="add" onclick="S.modal={type:'changepass'};render()">Change password</button>
      <button class="add" style="color:var(--rd);border-color:var(--rd)" onclick="customConfirm('Log out? You will need your sync code to reconnect.',()=>{localStorage.removeItem('bt-sync');location.reload()})">Log out</button>
      <button class="add" style="color:var(--rd);border-color:var(--rd);margin-top:4px" onclick="customConfirm('Start over? This will erase ALL your data and reset the app. This cannot be undone.',()=>{localStorage.clear();location.reload()})">Start over</button>
    </div></div>`;
  }

  // FAB

  // Tab bar
  h+=`<div class="tab-bar">`;
  [{v:"budget",l:"Budget",d:"M3 3h18v18H3zM3 9h18M9 3v18"},{v:"cards",l:"Cards",d:"M2 7h20v12H2zM2 7V5h20v2M6 11h4"},{v:"group",l:"Group",d:"M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"},{v:"goals",l:"Goals",d:"M12 3a9 9 0 110 18 9 9 0 010-18zM12 7a5 5 0 110 10 5 5 0 010-10z"},{v:"trends",l:"Trends",d:"M3 20V4M7 20V10M11 20V7M15 20V12M19 20V5"},{v:"settings",l:"More",d:"M12 3v2M12 19v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M3 12h2M19 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42M12 8a4 4 0 100 8 4 4 0 000-8z"}].forEach(t=>{
    h+=`<button class="tab ${S.view===t.v?'active':''}" onclick="switchTab('${t.v}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${t.d}"/></svg>${t.l}</button>`;
  });
  h+=`</div>`;

  // Modal
  if(S.modal)h+=renderModal();

  document.getElementById("app").innerHTML=h;
  if(S.view==="trends")setTimeout(renderChart,10);
  if(S._addingMember)setTimeout(()=>{const el=document.getElementById('inline-member');if(el)el.focus()},50);
  if(S.view==="settings")setTimeout(doSearch,10);
}
// ===== SECTION RENDERER =====
function renderSection(items,title,catId,em,isIncome){
  const total=items.reduce((s,x)=>s+txTotal(x),0);
  const budget=items.reduce((s,x)=>s+x.budgeted,0);
  const ov=total>budget;
  const secKey="sec-"+(catId||"income");
  // Default: collapse sections where all items are recurring and not in edit mode
  if(S.collapsed===undefined)S.collapsed={};
  const allRecurring=items.every(i=>i.recurring);
  const isOpen=S.collapsed[secKey]===true?false:true;
  let h=`<div class="sec">`;
  // Header - clickable to toggle
  h+=`<div class="sh" onclick="${em?'':'toggleSection(\''+secKey+'\')'}"><div style="display:flex;align-items:center;gap:3px">`;
  if(!em)h+=`<span class="sh-arrow ${isOpen?'open':''}">▸</span>`;
  if(em&&!isIncome)h+=`<button class="xb" onclick="event.stopPropagation();removeCategory('${catId}')">×</button>`;
  if(em&&!isIncome)h+=`<span class="cat-emoji" style="cursor:pointer" onclick="event.stopPropagation();openEmojiPicker('${catId}')">${getCatEmoji(title)}</span><span class="sh-t" style="cursor:pointer" onclick="event.stopPropagation();renameCatUI(this,'${catId}')">${esc(title)}</span>`;
  else h+=`<span class="sh-t">${isIncome?"💰 ":"<span class=\"cat-emoji\">"+getCatEmoji(title)+"</span> "}${esc(title)}</span>`;
  h+=`</div><span class="sh-v" style="color:${ov&&!isIncome?'var(--rd)':''}">${fmt(total)} / ${fmt(budget)}</span></div>`;
  // Body - collapsible
  h+=`<div class="sec-body ${isOpen?'expanded':'collapsed'}">`;

  items.forEach(it=>{
    const tot=txTotal(it),p=pct(tot,it.budgeted),iov=tot>it.budgeted;
    const expKey=(catId||"inc")+"-"+it.id;
    const isExp=S.expanded[expKey];
    const txs=it.transactions||[];

    h+=`<div class="rw"><div class="rw-t"><div class="rw-l">`;
    if(em)h+=`<button class="xb" onclick="removeItemFromFuture('${it.id}',${catId?`'${catId}'`:'null'})">×</button>`;
    h+=`<span>${esc(it.label)}</span>`;
    if(it.recurring){
      const autoTx=it.transactions.find(t=>t.auto);
      const isPaid=autoTx?.confirmed;
      if(!em&&!isIncome){
        h+=`<button style="font-size:12px;padding:6px 12px;border-radius:8px;border:1.5px solid ${isPaid?'var(--gn)':'var(--bd)'};background:${isPaid?'rgba(140,192,99,.15)':'transparent'};color:${isPaid?'var(--gn)':'var(--t3)'};cursor:pointer;margin-left:4px;min-height:32px" onclick="event.stopPropagation();event.preventDefault();confirmPaid('${it.id}',${catId?"'"+catId+"'":'null'})">${isPaid?'✓ Paid':'Pay'}</button>`;
      } else {
        h+=`<span class="rec-badge">↻</span>`;
      }
    }
    // Show remaining balance for debt items
    if(!em&&it._balance!==undefined&&it._balance>0){
      const bPct=it._startBalance?Math.round((1-it._balance/it._startBalance)*100):0;
      const moInt=it._apr?it._balance*(it._apr/100/12):0;
      const moLeft=it.budgeted>moInt?Math.ceil(it._balance/(it.budgeted-moInt)):999;
      h+=`<span style="font-size:10px;color:var(--t3);margin-left:4px">${fmt(it._balance)} left${it._apr?' · '+it._apr+'%':''}</span>`;
    } else if(!em&&it._balance!==undefined&&it._balance<=0&&it.recurring){
      h+=`<span style="font-size:10px;color:var(--gn);margin-left:4px">✓ Paid off!</span>`;
    }
    if(!em&&!isIncome){
      const isRec=!!it.recurring;
      h+=`<button style="font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid `+(isRec?`var(--ac)`:`var(--bd)`)+`;background:`+(isRec?`rgba(219,181,110,.1)`:`transparent`)+`;color:`+(isRec?`var(--ac)`:`var(--t3)`)+`;cursor:pointer;margin-left:3px" onclick="event.stopPropagation();event.preventDefault();toggleRecurring('${it.id}',`+(catId?`'${catId}'`:`null`)+`)">`+(isRec?`↻`:`set ↻`)+`</button>`;
    }
    h+=`</div><div class="rw-n">`;

    // Amount display
    if(it.recurring&&!em){
      h+=`<span class="act" onclick="openTxModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">${fmt(tot)}</span>`;
    } else {
      h+=`<span class="act ${tot===0?'z':''}" style="${iov&&!isIncome?'color:var(--rd)':''}" onclick="openTxModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">${tot===0?(isIncome?"+log":"+add"):fmt(tot)}</span>`;
    }

    if(em){
      h+=`<span class="bud" onclick="openEditItemModal('${it.id}',${catId?`'${catId}'`:'null'},${isIncome})">✎ ${fmt(it.budgeted)}</span>`;
    } else {
      h+=`<span class="bud" onclick="event.stopPropagation();event.preventDefault();editBudgetInline('${catId}','${it.id}',${isIncome},${it.budgeted})" style="cursor:pointer">/ ${fmt(it.budgeted)}</span>`;
    }
    h+=`</div></div>`;
    if(!em&&it.budgeted>0&&!isIncome){const remaining=it.budgeted-tot;
      h+=`<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px"><span style="color:var(--t3)">${fmt(tot)} spent</span><span style="color:${remaining>=0?'var(--gn)':'var(--rd)'};font-weight:600">${remaining>=0?fmt(remaining)+' left':fmt(Math.abs(remaining))+' over'}</span></div>`;
      if(it._balance>0&&it.budgeted>0){
        const mi3=it._apr?it._balance*(it._apr/100/12):0;
        const eff=it.budgeted-mi3;
        const moEst=eff>0?Math.ceil(it._balance/eff):999;
        h+=`<div style="font-size:10px;color:var(--t3);margin-bottom:2px">${fmt(it._balance)} remaining${it._apr?' · '+fmt(mi3)+'/mo interest':''} · ~${moEst} months to payoff</div>`}
    }
    h+=`<div class="bar"><div class="bar-f" style="width:${p}%;background:${bCol(p,iov,isIncome)}"></div></div>`;
    if(it.note&&!em)h+=`<div class="note-text">${esc(it.note)}</div>`;

    // Transaction log
    const manualTxs=txs.filter(t=>!t.auto);
    if(manualTxs.length>0||txs.length>1){
      const showTxs=it.recurring?txs:manualTxs;
      if(showTxs.length>0){
        h+=`<span class="tx-toggle" onclick="S.expanded['${expKey}']=!S.expanded['${expKey}'];render()">${isExp?'▾ Hide':'▸ '+showTxs.length+' entr'+(showTxs.length!==1?'ies':'y')}</span>`;
        if(isExp){
          h+=`<div class="txlog">`;
          showTxs.forEach(tx=>{
            h+=`<div class="txlog-i"><div class="meta"><span class="dt">${tx.date||""}</span><span class="nt">${esc(tx.note||"")}</span>`;
            if(tx.tags?.length)tx.tags.forEach(tg=>h+=`<span class="tg">${esc(tg)}</span>`);
            h+=`</div><span class="amt">${fmt(tx.amount)}</span>`;
            if(!tx.auto){h+=`<button class="xb" onclick="editTx('${it.id}',${catId?"'"+catId+"'":'null'},'${tx.id}')" style="font-size:11px">✎</button>`;h+=`<button class="xb" onclick="removeTxById('${it.id}',${catId?"'"+catId+"'":'null'},'${tx.id}')" style="font-size:14px">×</button>`}
            h+=`</div>`;
          });
          h+=`</div>`;
        }
      }
    }
    h+=`</div>`;
  });

  if(em){
    if(isIncome)h+=`<button class="add" onclick="addItemToAll(null,{id:uid()})">+ Add income</button>`;
    else h+=`<button class="add" onclick="addItemToAll('${catId}',{id:uid()})">+ Add item</button>`;
  }
  h+=`</div></div>`;
  return h;
}

// ===== MODAL RENDERER =====
function renderModal(){
  const m=S.modal;
  let h=`<div class="mbg" onclick="if(event.target===this)closeModal()"><div class="mdl">`;

  if(m.type==="addtx"){
    h+=`<h3>${esc(m.label)}</h3>`;
    if(m.currentTotal>0)h+=`<div style="font-size:12px;color:var(--t2);margin-bottom:6px">Current total: ${fmt(m.currentTotal)}</div>`;
    h+=`<label>Amount</label><input id="m-inp" type="number" inputmode="decimal" placeholder="0" onkeydown="if(event.key==='Enter')saveTx()">
      <label>What's it for?</label><input id="m-note" maxlength="100" placeholder="e.g. Uber Eats, dinner with friends">
      <label>Tags (comma separated, optional)</label><input id="m-tags" maxlength="100" placeholder="e.g. impulse, work lunch">
      <div class="mbs"><button class="cn" onclick="closeModal()">Cancel</button>`;
    if(m.currentTotal>0)h+=`<button class="cn" onclick="clearItemTxs('${m.itemId}',${m.catId?`'${m.catId}'`:'null'})">Clear all</button>`;
    h+=`<button class="sv" onclick="saveTx()">Add</button></div>`;
  }
  else if(m.type==="edititem"){
    h+=`<h3>Edit item</h3>
      <label>Name</label><input id="m-label" maxlength="50" value="${esc(m.label)}">

function openTxModal(itemId,catId,isIncome){
  const md=cm(),item=getItemFromMonth(md,itemId,catId);
  if(!item)return;
  S.modal={type:"addtx",label:item.label,itemId,catId,isIncome,currentTotal:txTotal(item)};
  render();setTimeout(()=>{const i=document.getElementById("m-inp");if(i){i.focus();i.select()}},60);
}

function saveTx(){
  const m=S.modal,md=cm();
  const amt=parseFloat(document.getElementById("m-inp").value)||0;
  if(amt===0){closeModal();return}
  const note=document.getElementById("m-note").value.trim();
  const tagsRaw=document.getElementById("m-tags").value.trim();
  const tags=tagsRaw?tagsRaw.split(",").map(t=>t.trim()).filter(Boolean):[];
  const d=new Date();
  const tx={id:uid(),date:(d.getMonth()+1)+"/"+d.getDate(),isoDate:d.toISOString().split('T')[0],amount:amt,note,tags,auto:false};
  const item=getItemFromMonth(md,m.itemId,m.catId);
  if(!item)return;
  if(!item.transactions)item.transactions=[];
  tx.paidWith=m.paidWith||"cash";
  item.transactions.push(tx);
  // If paid with credit card, increase card balance
  if(m.qaType==="expense"&&m.paidWith&&m.paidWith!=="cash"&&m.paidWith!=="debit"){
    const ecard=(S.data.debts?.cards||[]).find(cd=>cd.id===m.paidWith);
    if(ecard)ecard.balance+=amt;
  }
  S.data.streakDate=new Date().toISOString().split('T')[0];
  // Deposit income to account if selected
  if(m.qaType==="income"&&m.depositTo&&m.depositTo!=="none"&&m.depositTo!=="cash"){
    const acct=S.data.networth?.accounts?.find(a=>a.id===m.depositTo);
    if(acct){const cur=getNWBalance(acct,S.month);acct.balances[S.month]=cur+amt}
  }
  save();closeModal();
}

function removeTxById(itemId,catId,txId){
  const md=cm();let item=null;
  if(catId){const cat=findById(md.categories,catId);if(cat)item=findById(cat.items,itemId)}
  else{item=findById(md.income,itemId)}
  if(!item)return;
  const txIdx=item.transactions.findIndex(t=>t.id===txId);
  if(txIdx<0)return;
  const tx=item.transactions[txIdx];
  // Reverse card balance if paid with a card
  if(tx.paidWith&&tx.paidWith!=="cash"&&tx.paidWith!=="debit"){
    const card=S.data.debts?.cards?.find(cd=>cd.id===tx.paidWith);
    if(card)card.balance=Math.max(0,card.balance-tx.amount);
  }
  item.transactions.splice(txIdx,1);
  save();render();
}

function clearItemTxs(itemId,catId){
  const md=cm(),item=getItemFromMonth(md,itemId,catId);
  if(!item)return;
  item.transactions=item.recurring?item.transactions.filter(t=>t.auto):[];
  save();closeModal();
}

    save();render();
  });
}

  S.data.goals.active.push({id:goalId,label,type:gtype,current:gtype==="payoff"?target:0,target:gtype==="payoff"?0:target,start:gtype==="payoff"?target:0,monthly,created:Date.now()});

function saveGoalEdit(gi){
  const g=S.data.goals.active[gi];
  g.label=document.getElementById("m-label").value.trim()||g.label;
