function saveGoalEdit(gi){
  const g=S.data.goals.active[gi];
  g.label=document.getElementById("m-label").value.trim()||g.label;
  const tv=parseFloat(document.getElementById("m-target").value);
  if(g.type==="payoff")g.start=tv||g.start;else g.target=tv||g.target;
  g.monthly=parseFloat(document.getElementById("m-monthly").value)||g.monthly;
  save();closeModal();

function saveGoalCurrent(gi){
  const v=parseFloat(document.getElementById("m-inp").value)||0;

  const g=S.data.goals.active[gi];

// Export/Import
function exportData(){
  const exportData={...S.data,_syncCode:localStorage.getItem("bt-sync")||""};
  const blob=new Blob([JSON.stringify(exportData,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="budget-backup-"+mk()+".json";a.click();
}
function importData(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json";
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{
    const parsed=JSON.parse(ev.target.result);
    if(parsed._syncCode){localStorage.setItem("bt-sync",parsed._syncCode);S.pin=parsed._syncCode;delete parsed._syncCode}
    S.data=parsed;ensureStructure();save();render();toast("Restored!")
  }catch{toast("Invalid file")}};r.readAsText(f)};
  inp.click();
}

let chartInst=null;
function renderPayoffChart(){
  if(!S._payoffChart)return;
  const el=document.getElementById("payoff-chart");
  if(!el)return;
  const{projData,minProjData,cards:chartCards,target}=S._payoffChart;
  const ctx=el.getContext("2d");if(!ctx)return;
  const colors=["#2266CC","#1a8f5c","#cc3b3b","#e68a00","#8833cc"];
  const datasets=[];
  // Total with plan
  datasets.push({label:"With plan",data:projData.map(d=>({x:d.month,y:Math.round(d.total)})),borderColor:"#2266CC",backgroundColor:"rgba(34,102,204,.08)",fill:true,borderWidth:2.5,tension:0.3,pointRadius:0});
  // Minimums only
  datasets.push({label:"Minimums only",data:minProjData.map(d=>({x:d.month,y:Math.round(d.total)})),borderColor:"#cc3b3b",borderDash:[6,4],borderWidth:1.5,tension:0.3,pointRadius:0,fill:false});
  // Per card lines
  chartCards.forEach((cd2,ci)=>{
    datasets.push({label:cd2.name,data:projData.map(d=>({x:d.month,y:Math.round(d[cd2.id]||0)})),borderColor:colors[(ci+2)%colors.length],borderWidth:1.5,tension:0.3,pointRadius:0,fill:false});
  });
  // Target line
  datasets.push({label:"Target",data:[{x:target,y:0},{x:target,y:projData[0]?.total||0}],borderColor:"rgba(26,143,92,.4)",borderDash:[3,3],borderWidth:1,pointRadius:0,fill:false});

  if(window._payoffChartInst)window._payoffChartInst.destroy();
  const isDark=matchMedia("(prefers-color-scheme:dark)").matches;
  window._payoffChartInst=new Chart(ctx,{type:"line",data:{datasets},options:{responsive:true,maintainAspectRatio:true,interaction:{intersect:false,mode:"index"},plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:12,font:{size:10},color:isDark?"#aaa":"#666"}},tooltip:{callbacks:{label:function(c2){return c2.dataset.label+": $"+c2.parsed.y.toLocaleString()}}}},scales:{x:{type:"linear",title:{display:true,text:"Months",font:{size:11},color:isDark?"#888":"#999"},ticks:{font:{size:10},color:isDark?"#888":"#999"},grid:{color:isDark?"rgba(255,255,255,.06)":"rgba(0,0,0,.06)"}},y:{title:{display:false},ticks:{callback:v=>"$"+v.toLocaleString(),font:{size:10},color:isDark?"#888":"#999"},grid:{color:isDark?"rgba(255,255,255,.06)":"rgba(0,0,0,.06)"}}}}});
  S._payoffChart=null;
}

function renderChart(){
  const el=document.getElementById("mainChart");if(!el)return;
  if(chartInst)chartInst.destroy();
  const ctx=el.getContext("2d");
  const isDark=matchMedia("(prefers-color-scheme:dark)").matches;
  const grid=isDark?"rgba(255,255,255,.08)":"rgba(0,0,0,.06)";
  const tCol=isDark?"#999":"#666";
  const months=Object.keys(S.data.months||{}).sort().slice(-6);
  const colors=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];

  if(S.chartType==="spending"&&months.length>0){
    const catNames=[...new Set(months.flatMap(m=>(S.data.months[m].categories||[]).map(c=>c.name)))];
    const ds=catNames.map((cn,i)=>({label:cn,backgroundColor:colors[i%8],data:months.map(m=>{const c=(S.data.months[m].categories||[]).find(c2=>c2.name===cn);return c?c.items.reduce((s,x)=>s+txTotal(x),0):0})}));
    chartInst=new Chart(ctx,{type:"bar",data:{labels:months.map(monthLabel),datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:10,font:{size:10},color:tCol}}},scales:{x:{stacked:true,ticks:{color:tCol},grid:{display:false}},y:{stacked:true,ticks:{color:tCol,callback:v=>"$"+v},grid:{color:grid}}}}});
  }
  else if(S.chartType==="income-vs-spend"&&months.length>0){
    const inc=months.map(m=>S.data.months[m].income.reduce((s,x)=>s+txTotal(x),0));
    const exp=months.map(m=>S.data.months[m].categories.reduce((s,c)=>s+c.items.reduce((ss,x)=>ss+txTotal(x),0),0));
    chartInst=new Chart(ctx,{type:"line",data:{labels:months.map(monthLabel),datasets:[
      {label:"Income",data:inc,borderColor:"#1baf7a",backgroundColor:"rgba(27,175,122,.1)",fill:true,tension:.3},
      {label:"Spending",data:exp,borderColor:"#eb6834",backgroundColor:"rgba(235,104,52,.1)",fill:true,tension:.3}
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:10,font:{size:10},color:tCol}}},scales:{x:{ticks:{color:tCol},grid:{display:false}},y:{ticks:{color:tCol,callback:v=>"$"+v},grid:{color:grid}}}}});
  }
  else if(S.chartType==="breakdown"){
    const md=cm();
    const cd=md.categories.map(c=>({name:c.name,total:c.items.reduce((s,x)=>s+txTotal(x),0)})).filter(c=>c.total>0);
    if(cd.length>0){
      chartInst=new Chart(ctx,{type:"doughnut",data:{labels:cd.map(c=>c.name),datasets:[{data:cd.map(c=>c.total),backgroundColor:cd.map((_,i)=>colors[i%8])}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:"bottom",labels:{boxWidth:10,font:{size:10},color:tCol,generateLabels:c=>{const d=c.data.datasets[0].data;const t=d.reduce((a,b)=>a+b,0);return c.data.labels.map((l,i)=>({text:`${l} ${Math.round(d[i]/t*100)}%`,fillStyle:colors[i%8]}))}}}}}});
    }
  }
}

// ===== SEARCH =====
let searchTimer=null;
function doSearch(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    const container=document.getElementById("search-results");if(!container)return;
    let txs=allTransactions();
    const range=parseInt(S.searchRange);
    if(S.searchRange!=="all"&&range>0){const d=new Date();d.setMonth(d.getMonth()-range);txs=txs.filter(t=>t.month>=mk(d))}
    if(S.searchCat!=="all")txs=txs.filter(t=>t.category===S.searchCat);
    if(S.searchQ){const q=S.searchQ.toLowerCase();txs=txs.filter(t=>(t.note||"").toLowerCase().includes(q)||(t.item||"").toLowerCase().includes(q)||(t.tags||[]).some(tg=>tg.toLowerCase().includes(q)))}
    txs.sort((a,b)=>(b.month+b.date).localeCompare(a.month+a.date));
    const total=txs.reduce((s,t)=>s+(t.amount||0),0);
    let h=`<div class="s-total">${txs.length} result${txs.length!==1?'s':''} · ${fmt(total)}</div>`;
    txs.slice(0,50).forEach(t=>{
      h+=`<div class="s-result"><div class="top-r"><span>${esc(t.note||t.item)}</span><span style="font-weight:600">${fmt(t.amount)}</span></div><div class="cat">${esc(t.category)} › ${esc(t.item)} · ${t.month} ${t.date||""} ${(t.tags||[]).map(tg=>`<span style="font-size:9px;color:var(--ac);background:rgba(34,102,204,.1);padding:0 3px;border-radius:2px;margin-left:2px">${esc(tg)}</span>`).join("")}</div></div>`;
    });
    if(txs.length>50)h+=`<div style="padding:6px 0;font-size:11px;color:var(--t3)">Showing 50 of ${txs.length}</div>`;
    if(txs.length===0)h+=`<div style="padding:18px 0;text-align:center;color:var(--t3)">No results</div>`;
    container.innerHTML=h;
  },150); // debounce 150ms
}

// ===== AUTH =====
async function deriveCode(user,pass){
  const raw=user.toLowerCase().trim()+":"+pass;
  const enc=new TextEncoder().encode(raw);
  const hash=await crypto.subtle.digest("SHA-256",enc);
  const hex=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
  // Convert first 16 hex chars to our code alphabet
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";for(let i=0;i<16;i++){const idx=parseInt(hex.substr(i*2,2),16)%chars.length;code+=chars[idx]}
  return code;
}

function generateSyncCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";for(let i=0;i<16;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}
function generateGroupCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code="";for(let i=0;i<8;i++)code+=chars[Math.floor(Math.random()*chars.length)];
  return code;
}

async function doLogin(){
  const user=document.getElementById("login-user").value.trim();
  const pass=document.getElementById("login-pass").value;
  if(!user||!pass){S.err="Enter username and password";render();return}
  const code=await deriveCode(user,pass);
  localStorage.setItem("bt-user",user);
  localStorage.setItem("bt-sync",code);
  S.pin=code;
  await connect(code);
}

async function autoStart(){
  let code=localStorage.getItem("bt-sync");
  if(code){S.pin=code;await connect(code)}
  else{S.phase="welcome";render()}
}

      h+=`<div style="display:flex;gap:6px;align-items:center"><span style="font-size:14px;color:var(--t3)">$</span><input class="ob-input" style="flex:1;margin:0;text-align:left;font-size:14px;padding:10px" type="number" inputmode="decimal" placeholder="Monthly savings amount" value="${S.obSavingsGoal||''}" onchange="S.obSavingsGoal=parseFloat(this.value)||0;S.obBudgetsSeeded=false;render()"></div>`;
    }
    h+=`<div style="font-size:12px;margin-top:6px;color:var(--t2)">Left for spending: <b style="color:${flexiblePot>0?'var(--gn)':'var(--rd)'}">${fmt(flexiblePot)}</b></div>`;
    h+=`</div>`;
    if(flexiblePot>0)h+=`<p style="text-align:center;font-size:12px;color:var(--t2);margin-bottom:4px">Recommended spending from the remaining ${fmt(flexiblePot)}</p>`;
    h+=`<div style="max-width:340px;margin:0 auto;width:100%">`;
    // Show all categories with amounts
    const allCats=[...new Set([...Object.keys(fixedByCategory),...(S.obCats||[])])];
    allCats.forEach(catName=>{
      const cne=catName.replace(/'/g,"\\'");
      if(!S.obBudgets[catName])S.obBudgets[catName]=[{label:"",amount:0,recurring:false}];
      const items=S.obBudgets[catName];
      const isFixed=fixedCats.has(catName)||fixedByCategory[catName];
      h+=`<div style="margin-bottom:14px"><div style="font-size:14px;font-weight:700;margin-bottom:6px">${esc(catName)} ${isFixed?'<span style="font-size:10px;color:var(--t3);font-weight:400">fixed</span>':''}</div>`;
      items.forEach((it2,ii)=>{
        h+=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px"><input class="ob-input" style="flex:1;text-align:left;margin:0;font-size:13px;padding:10px" maxlength="50" value="${esc(it2.label)}" onchange="S.obBudgets['${cne}'][${ii}].label=this.value"><div style="position:relative;flex:0 0 90px"><span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:13px">$</span><input class="ob-input" style="margin:0;padding:10px 10px 10px 22px;font-size:13px" type="number" inputmode="decimal" value="${it2.amount||''}" onchange="S.obBudgets['${cne}'][${ii}].amount=parseFloat(this.value)||0"></div><button style="background:none;border:none;color:var(--t3);font-size:16px;padding:4px;min-width:28px" onclick="S.obBudgets['${cne}'].splice(${ii},1);render()">\u00d7</button></div>`;
      });
      h+=`<button style="background:none;border:none;color:var(--ac);font-size:12px;font-weight:600;padding:4px 0" onclick="S.obBudgets['${cne}'].push({label:'',amount:0,recurring:false});render()">+ Add item</button></div>`;
    });
    h+=`</div>`;
    const totalB3=Object.values(S.obBudgets).flat().reduce((s,i)=>s+(i.amount||0),0);
    const totalI3=Object.values(S.obIncomeAmts||{}).reduce((s,v)=>s+v,0);
    if(totalB3>0||totalI3>0){const left3=totalI3-totalB3;h+=`<div style="text-align:center;font-size:12px;margin-top:8px;padding:10px;background:var(--c1);border-radius:10px;line-height:1.6">Income: ${fmt(totalI3)}<br>Fixed: ${fmt(fixedTotal2)} · Savings: ${fmt(S.obSavingsGoal||0)} · Spending: ${fmt(totalB3-fixedTotal2-(S.obSavingsGoal||0))}<br><span style="color:${left3>=0?'var(--gn)':'var(--rd)'}">Unbudgeted: ${fmt(left3)}</span></div>`}
    h+=`<button class="ob-btn" style="margin-top:12px;align-self:center" onclick="S.obStep=6;if(!S.obCards)S.obCards=[];render()">Next</button></div>`;
  } else if(step===6){
    if(!S.obCards)S.obCards=[];
    h+=`<div class="ob-top">${backBtn(5)}<div class="ob-step">Step 6 of 6</div><h2>Got credit cards?</h2><p>Add any cards with a balance.</p>`;
    S.obCards.forEach((cd,ci)=>{h+=`<div style="width:100%;max-width:300px;background:var(--c1);border-radius:12px;padding:10px 14px;margin:4px 0;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--sh)"><div><div style="font-weight:600">${esc(cd.name)}</div><div style="font-size:11px;color:var(--t2)">${fmt(cd.balance)} · ${cd.apr}% · Limit ${fmt(cd.limit)}</div></div><button class="xb" onclick="S.obCards.splice(${ci},1);render()">\u00d7</button></div>`});
    h+=`<div style="width:100%;max-width:300px;margin-top:8px"><input id="ob-cn" class="ob-input" style="text-align:left;margin:4px 0" maxlength="50" placeholder="Card name (e.g. Chase)"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="ob-cb" class="ob-input" style="margin:0" type="number" inputmode="decimal" placeholder="Balance"><input id="ob-cl" class="ob-input" style="margin:0" type="number" inputmode="decimal" placeholder="Limit"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><input id="ob-ca" class="ob-input" style="margin:0" type="number" inputmode="decimal" placeholder="APR %"><input id="ob-cm" class="ob-input" style="margin:0" type="number" inputmode="decimal" placeholder="Min payment"></div><div style="margin-top:6px"><input id="ob-cs" class="ob-input" style="margin:0" type="number" inputmode="numeric" placeholder="Statement date (day, e.g. 15)"></div><button class="ob-btn sec" style="width:100%;margin-top:6px" onclick="const n=document.getElementById('ob-cn').value.trim();const b=parseFloat(document.getElementById('ob-cb').value)||0;const l=parseFloat(document.getElementById('ob-cl').value)||0;const a=parseFloat(document.getElementById('ob-ca').value)||0;const mp=parseFloat(document.getElementById('ob-cm').value)||0;if(!n){toast('Enter card name');return}const sd=parseInt(document.getElementById('ob-cs').value)||0;S.obCards.push({name:n,balance:b,limit:l,apr:a,minPayment:mp,stmtDate:sd});render()">+ Add this card</button></div>`;
    h+=`<button class="ob-btn" style="margin-top:12px" onclick="S.obStep=7;render()">Next</button><button class="ob-skip" onclick="S.obStep=7;render()">Skip — no cards</button></div>`;
  } else if(step===7){
    h+=`<div class="ob-top">${backBtn(6)}<div class="ob-step">Quick tour — 1 of 3</div><h2>Your dashboard</h2><div style="max-width:300px;text-align:left;line-height:1.7;font-size:14px;color:var(--t2)"><p>💰 <b style="color:var(--tx)">Money In</b> — your income</p><p>💸 <b style="color:var(--tx)">Money Out</b> — your expenses</p><p>🎤 <b style="color:var(--tx)">Voice log</b> — say what you spent</p><p style="margin-top:6px">📊 <b style="color:var(--tx)">History</b> — every month's net</p></div><button class="ob-btn" onclick="S.obStep=8;render()">Next</button></div>`;
  } else if(step===8){
    h+=`<div class="ob-top">${backBtn(7)}<div class="ob-step">Quick tour — 2 of 3</div><h2>Logging</h2><div style="max-width:300px;text-align:left;line-height:1.7;font-size:14px;color:var(--t2)"><p><span style="display:inline-flex;width:26px;height:26px;background:var(--ac);color:#fff;border-radius:50%;align-items:center;justify-content:center;font-size:14px;vertical-align:middle">+</span> Quick-add expense, income, or payment</p><p>⚡ <b style="color:var(--tx)">Quick Log</b> — one-tap for daily buys</p><p>✏️ <b style="color:var(--tx)">Edit</b> — adjust budgets anytime</p></div><button class="ob-btn" onclick="S.obStep=9;render()">Next</button></div>`;
  } else if(step===9){
    h+=`<div class="ob-top">${backBtn(8)}<div class="ob-step">Quick tour — 3 of 3</div><h2>Other tabs</h2><div style="max-width:300px;text-align:left;line-height:1.7;font-size:14px;color:var(--t2)"><p>💳 <b style="color:var(--tx)">Cards</b> — debt payoff plan</p><p>👥 <b style="color:var(--tx)">Group</b> — split with roommates</p><p>🎯 <b style="color:var(--tx)">Goals</b> — savings targets</p><p>📊 <b style="color:var(--tx)">Trends</b> — spending charts</p></div><button class="ob-btn" onclick="S.obStep=10;render()">Got it!</button></div>`;
  } else if(step===10){
    const totalDebt=(S.obCards||[]).reduce((s,x)=>s+x.balance,0);
    const totalB2=Object.values(S.obBudgets||{}).flat().reduce((s,i)=>s+(i.amount||0),0);
    const totalI2=Object.values(S.obIncomeAmts||{}).reduce((s,v)=>s+v,0);
    h+=`<div class="ob-top">${backBtn(9)}<div style="font-size:48px;margin-bottom:12px">🎉</div><h2>You're ready!</h2>`;
    h+=`<div style="font-size:13px;color:var(--t2);max-width:280px;text-align:center;line-height:1.8;margin-bottom:12px">`;
    if(totalI2)h+=`Income: ${fmt(totalI2)}/mo<br>`;
    if(totalB2)h+=`Budget: ${fmt(totalB2)}/mo<br>`;
    if(totalDebt>0)h+=`Cards: ${(S.obCards||[]).length} · ${fmt(totalDebt)} debt<br>`;
    h+=`${(S.obCats||[]).length} categories</div>`;
    h+=`<button class="ob-btn" onclick="finishOnboarding()">Let's go</button></div>`;
  }
   h+=`</div>`;
  document.getElementById("app").innerHTML=h;
}


function finishOnboarding(){
  startOnboardFinish();return}
async function startOnboardFinish(){
  let code;
  if(S.obUser&&S.obPass){code=await deriveCode(S.obUser,S.obPass);localStorage.setItem('bt-user',S.obUser)}else{code=generateSyncCode()}
  localStorage.setItem('bt-sync',code);S.pin=code;
  S.data=JSON.parse(JSON.stringify(DEF));S.data.userName=S.obName||"";
  const amts=S.obIncomeAmts||{};const it=S.obIncomeType;
  if(it==="salary")S.data.template.income.push({id:uid(),label:"Salary",amount:amts.salary||0,recurring:true,note:""});
  else if(it==="hourly")S.data.template.income.push({id:uid(),label:"Hourly pay",amount:amts.hourly||0,recurring:false,note:""});
  else if(it==="base_comm"){S.data.template.income.push({id:uid(),label:"Base pay",amount:amts.base||0,recurring:true,note:""});S.data.template.income.push({id:uid(),label:"Commissions",amount:amts.comm||0,recurring:false,note:""})}
  else if(it==="comm_only")S.data.template.income.push({id:uid(),label:"Commissions",amount:amts.comm||0,recurring:false,note:""});
  else if(it==="freelance")S.data.template.income.push({id:uid(),label:"Freelance",amount:amts.freelance||0,recurring:false,note:""});
  (S.obExtraIncome||[]).forEach(label=>{S.data.template.income.push({id:uid(),label,amount:0,recurring:label==="Benefits",note:""})});
  const budgets=S.obBudgets||{};
  (S.obCats||[]).forEach(name=>{const items=(budgets[name]||[]).filter(i=>i.label.trim()).map(i=>({id:uid(),label:i.label.trim(),amount:i.amount||0,recurring:i.recurring||false,note:""}));S.data.template.categories.push({id:uid(),name,items})});
  // Ensure Misc and Splurges exist
  if(!S.data.template.categories.find(c2=>c2.name==="Misc"))S.data.template.categories.push({id:uid(),name:"Misc",items:[{id:uid(),label:"Uncategorized",amount:0,recurring:false,note:""}]});
  if(!S.data.template.categories.find(c2=>c2.name==="Splurges"))S.data.template.categories.push({id:uid(),name:"Splurges",items:[{id:uid(),label:"Unnecessary purchases",amount:0,recurring:false,note:""}]});
  // Merge fixed costs into categories (in case step 5 was skipped)
  (S.obFixed||[]).filter(f=>f.on&&f.amount>0).forEach(f=>{
    const catName=f.cat||"Misc";
    let cat=S.data.template.categories.find(c2=>c2.name===catName);
    if(!cat){cat={id:uid(),name:catName,items:[]};S.data.template.categories.push(cat)}
    const label=f.label.split("(")[0].trim();
    if(!cat.items.find(i=>i.label===label)){cat.items.push({id:uid(),label,amount:f.amount,recurring:true,note:""})}
  });
    (S.obCards||[]).forEach(cd=>{S.data.debts.cards.push({id:uid(),name:cd.name,balance:cd.balance,limit:cd.limit||0,apr:cd.apr,minPayment:cd.minPayment,stmtDate:cd.stmtDate||0,payments:[]})});
  ensureStructure();S.phase="app";S.month=mk();save();render();
}

let groupRefs={};let groupDatas={};
function createGroup(){
  const code=generateGroupCode();
  const name=S.data.userName||"Me";
  const grp={code,name};
  S.data.groups.push(grp);
  const gd={members:{[name]:true},expenses:[]};
  groupDatas[code]=gd;
  if(db){const ref=db.ref("groups/"+code);ref.set(gd);groupRefs[code]=ref;ref.on("value",s=>{if(s.exists()){groupDatas[code]=s.val();if(S.view==="group")render()}})}
  S.activeGroup=S.data.groups.length-1;
  save();render();
}
function joinGroup(code){
  const name=S.data.userName||"Me";
  if(S.data.groups.some(g=>g.code===code)){toast("Already in this group");return}
  const grp={code,name};
  S.data.groups.push(grp);
  S.activeGroup=S.data.groups.length-1;
  if(db){const ref=db.ref("groups/"+code);groupRefs[code]=ref;
    ref.once("value").then(s=>{
      if(s.exists()){groupDatas[code]=s.val();const members=groupDatas[code].members||{};members[name]=true;ref.update({members})}
      else{groupDatas[code]={members:{[name]:true},expenses:[]};ref.set(groupDatas[code])}
      ref.on("value",s2=>{if(s2.exists()){groupDatas[code]=s2.val();if(S.view==="group")render()}});save();render()});
  } else {groupDatas[code]={members:{[name]:true},expenses:[]};save();render()}
}
function connectGroups(){
  if(!db)return;
  (S.data.groups||[]).forEach(grp=>{
    if(!groupRefs[grp.code]){
      const ref=db.ref("groups/"+grp.code);groupRefs[grp.code]=ref;
      ref.on("value",s=>{if(s.exists()){groupDatas[grp.code]=s.val();if(S.view==="group")render()}});
    }
  });
}
function addGroupExpense(){
  const m=S.modal;const amt=parseFloat(document.getElementById("m-inp").value)||0;
  if(amt===0){closeModal();return}
  const note=document.getElementById("m-note").value.trim()||"Shared expense";
  const split=m.splitWith||[];if(split.length===0){toast("Select who to split with");return}
  const grp=S.data.groups[S.activeGroup];if(!grp)return;
  const gd=groupDatas[grp.code];if(!gd)return;
  const d=new Date();
  const expense={id:uid(),paidBy:grp.name,amount:amt,note,date:(d.getMonth()+1)+"/"+d.getDate(),month:S.month,splitBetween:[grp.name,...split]};
  if(!gd.expenses)gd.expenses=[];
  gd.expenses.push(expense);
  if(groupRefs[grp.code])groupRefs[grp.code].update({expenses:gd.expenses});
  closeModal();
}
function calcGroupBalances(gd){
  const expenses=gd?.expenses||[];const balances={};
  expenses.forEach(ex=>{const pp=ex.amount/ex.splitBetween.length;ex.splitBetween.forEach(person=>{if(person!==ex.paidBy){balances[person+"→"+ex.paidBy]=(balances[person+"→"+ex.paidBy]||0)+pp}})});
  const netBalances={};const people=new Set();
  Object.entries(balances).forEach(([key,amt])=>{const[from,to]=key.split("→");people.add(from);people.add(to);const rev=balances[to+"→"+from]||0;const net=amt-rev;if(net>0)netBalances[from+"→"+to]=net});
  return{netBalances,people:[...people]};
}

initFB();autoStart();
